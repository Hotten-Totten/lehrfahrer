<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="same-origin">
<title>Auditprotokoll · Lehrfahrer</title>
<link rel="stylesheet" href="audit.css?v=1">
<script src="js/audit.js?v=1" defer></script>
</head>
<body>
<main>
<header><div><p>Lehrfahrer®</p><h1>Auditprotokoll</h1></div><a href="index.html">Zurück zum Editor</a></header>
<p>Protokoll Ihrer aktiven Gesellschaft. Zeitfilter beziehen sich auf UTC. Akteure und Objekte erscheinen ausschließlich mit technischen Kennungen.</p>
<form id="auditFilters">
<label>Von (UTC)<input type="date" name="from"></label>
<label>Bis (UTC)<input type="date" name="to"></label>
<label>Ereignisart<select name="action"><option value="">Alle Ereignisarten</option></select></label>
<label>Ergebnis<select name="result"><option value="">Alle Ergebnisse</option><option value="SUCCESS">Erfolgreich</option><option value="DENIED">Abgewiesen</option><option value="FAILED">Fehlgeschlagen</option></select></label>
<label>Technische Objekt-ID<input name="objectId" maxlength="128" placeholder="z. B. training_000005"></label>
<button type="submit">Anwenden / Aktualisieren</button>
</form>
<p id="auditStatus" role="status" aria-live="polite"></p>
<div class="table-scroll"><table><caption>Ereignisse – neueste zuerst</caption><thead><tr><th>Zeit (UTC)</th><th>Ereignis</th><th>Ergebnis</th><th>Akteur / Mitgliedschaft</th><th>Objekt</th><th>Ereignis-ID</th></tr></thead><tbody id="auditEvents"></tbody></table></div>
<nav aria-label="Protokollseiten"><button id="auditFirst" type="button">Neueste Einträge</button><button id="auditNext" type="button" disabled>Ältere Einträge</button></nav>
</main>
</body></html>
