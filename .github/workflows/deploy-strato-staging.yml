          test -f "$private_root/control-account-migrate.php"
          test "$(stat -c '%a' "$private_root/control-account-migrate.php")" = 600
          LEHRFAHRER_ACCOUNT_MIGRATE_RUN=1 LEHRFAHRER_APP_ROOT="$webroot" \
            php -q -d "auto_prepend_file=$private_root/runtime-env.php" \
              -f "$private_root/control-account-migrate.php"
          REMOTE_SCRIPT
          origin='https://staging.lehrfahrer.de'
          jq -n --arg password "$ADMIN_PASSWORD" '{
            company: "lehrfahrer-test", login: "staging-admin", password: $password,
            deviceLabel: "GitHub Post-Migration Smoke"
          }' > /tmp/staging-account-migration-login.json
          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -H "Origin: $origin" -H 'Content-Type: application/json' \
            -c /tmp/staging-account-migration.cookies \
            --data-binary @/tmp/staging-account-migration-login.json \
            "$origin/api/auth/login.php" > /tmp/staging-account-migration-login-result.json
          jq -e '.ok == true and .company.slug == "lehrfahrer-test" and (.user.roles | index("ADMIN"))' \
            /tmp/staging-account-migration-login-result.json >/dev/null
          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -b /tmp/staging-account-migration.cookies "$origin/api/auth/me.php" \
            | jq -e '.ok == true and .runtime.environment == "staging"' >/dev/null
          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -b /tmp/staging-account-migration.cookies "$origin/" \
            > /tmp/staging-account-migration-editor.html
          grep -q '<title>Linien-Editor</title>' /tmp/staging-account-migration-editor.html
          csrf="$(jq -r '.csrfToken' /tmp/staging-account-migration-login-result.json)"
          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -b /tmp/staging-account-migration.cookies -H "Origin: $origin" -H "X-CSRF-Token: $csrf" \
            -X POST "$origin/api/auth/logout.php" | jq -e '.ok == true' >/dev/null
          rm -f /tmp/staging-account-migration-login.json /tmp/staging-account-migration-login-result.json \
            /tmp/staging-account-migration.cookies /tmp/staging-account-migration-editor.html
          echo 'POST_MIGRATION_AUTH_SMOKE=OK'

      - name: Preflight or apply approved Cottbus migration
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.preflight_cottbus || inputs.apply_cottbus) }}
        shell: bash
        env:
          SSHPASS: ${{ secrets.STRATO_PASSWORD }}
          STRATO_USER: ${{ secrets.STRATO_USER }}
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          STRATO_PORT: ${{ secrets.STRATO_PORT }}
          STRATO_SSH_KEY: ${{ secrets.STRATO_SSH_KEY }}
          STAGING_TARGET_PATH: ${{ vars.STAGING_TARGET_PATH }}
          STAGING_PRIVATE_PATH: ${{ vars.STAGING_PRIVATE_PATH }}
          LIVE_TARGET_PATH: ${{ secrets.STRATO_TARGET_PATH }}
          CREATE_RESTORE_POINT: ${{ inputs.create_control_db_restore_point }}
          APPLY_COTTBUS: ${{ inputs.apply_cottbus }}
        run: |
          set -euo pipefail
          if [ "$CREATE_RESTORE_POINT" = true ]; then
            echo 'Apply und separater Restore-Punkt duerfen nicht im selben Lauf aktiviert werden.' >&2
            exit 1
          fi
          REMOTE="$STRATO_USER@$STRATO_HOST"
          SSH_BASE=(ssh -p "$STRATO_PORT" -o UpdateHostKeys=no -o StrictHostKeyChecking=yes)
          if [ -n "$STRATO_SSH_KEY" ]; then
            SSH_BASE+=(-i ~/.ssh/id_rsa)
            SSH_RUN=("${SSH_BASE[@]}")
          else
            SSH_RUN=(sshpass -e "${SSH_BASE[@]}")
          fi

          set +e
          "${SSH_RUN[@]}" "$REMOTE" \
            "bash -s -- '$STAGING_TARGET_PATH' '$STAGING_PRIVATE_PATH' '$LIVE_TARGET_PATH' '$APPLY_COTTBUS'" <<'REMOTE_SCRIPT'
          set -euo pipefail
          staging_target="$1"
          staging_private="$2"
          live_target="${3#/}"
          apply_cottbus="$4"
          company_id='cmp_2ff1b82166c99988ed6f7eb51cca7b56'
          expected_gtfs_sha256='edd76d5cb8d628cf63b81445c3a7524cb081f0652c4220f9f22f7920f8b4b035'
          expected_backup_sha256='56e2e05c343ba2d0f9bb2af3cb17c01eeaf00857cdad3b158bc22ed47d115a39'
          webroot="$(cd "./$staging_target" && pwd -P)"
          private_root="$(cd "./$staging_private" && pwd -P)"
          if [ -z "$live_target" ] || [ "$live_target" = "." ]; then
            live_webroot="$(pwd -P)"
          else
            live_webroot="$(cd "./$live_target" && pwd -P)"
          fi
          live_private="$(dirname "$live_webroot")/lehrfahrer-private"
          case "$private_root/" in "$webroot/"*|"$live_webroot/"*|"$live_private/"*) exit 41 ;; esac
          case "$webroot/" in "$private_root/"*) exit 42 ;; esac
          test "$(stat -c '%a' "$private_root")" = 700

          umask 077
          temp_root="$(mktemp -d "$private_root/.cottbus-apply.XXXXXX")"
          case "$temp_root/" in "$private_root/"*) ;; *) exit 43 ;; esac
          test -d "$temp_root" && test ! -L "$temp_root"
          chmod 700 "$temp_root"

          validator="$temp_root/validate-cottbus-apply.php"
          approval_file="$temp_root/cottbus-apply-source-approval.txt"
          pre_result="$temp_root/cottbus-apply-preflight.json"
          apply_result="$temp_root/cottbus-apply-result.json"
          apply_stderr="$temp_root/cottbus-apply-stderr.log"
          post_result="$temp_root/cottbus-apply-post-dry-run.json"
          pre_state="$temp_root/cottbus-apply-pre-state.json"
          safe_result="$temp_root/cottbus-apply-safe-result.json"
          test_id_reader="$temp_root/read-test-company-id.php"
          diagnostic_failure=0
          cleanup() {
            cleanup_status=$?
            trap - EXIT HUP INT TERM
            set +e
            cleanup_result=OK
            for cleanup_file in "$validator" "$approval_file" "$pre_result" "$apply_result" "$apply_stderr" \
              "$post_result" "$pre_state" "$safe_result" "$test_id_reader"; do
              if [ -e "$cleanup_file" ] || [ -L "$cleanup_file" ]; then
                rm -f -- "$cleanup_file" || cleanup_result=FAILED
              fi
            done
            rmdir -- "$temp_root" 2>/dev/null || cleanup_result=FAILED
            if [ "$diagnostic_failure" -eq 1 ]; then
              printf 'COTTBUS_APPLY_PRIVATE_TEMP_CLEANUP=%s\n' "$cleanup_result"
              printf 'COTTBUS_APPLY_ROLLBACK_STATUS_REPORTED=YES\n'
            fi
            if [ "$cleanup_result" != OK ] && [ "$cleanup_status" -eq 0 ]; then cleanup_status=1; fi
            exit "$cleanup_status"
          }
          trap cleanup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          gtfs_source="$live_webroot/gtfs/data/gtfs/latest.zip"
          if [ ! -f "$gtfs_source" ] || [ -L "$gtfs_source" ]; then
            echo 'Freigegebene GTFS-Quelle fehlt, ist kein regulaeres File oder ist ein Symlink.' >&2
            exit 1
          fi
          actual_gtfs_sha256="$(sha256sum "$gtfs_source" | awk '{print $1}')"
          if [ "$actual_gtfs_sha256" != "$expected_gtfs_sha256" ]; then
            echo 'SOURCE_DRIFT unmittelbar vor Apply.' >&2
            exit 1
          fi

          cat > "$test_id_reader" <<'PHP'
          <?php
          try {
              $data = json_decode((string)file_get_contents((string)getenv('PROVISION_RESULT')), true, 512, JSON_THROW_ON_ERROR);
              $id = (string)($data['company_id'] ?? '');
              if (($data['slug'] ?? '') !== 'lehrfahrer-test' || preg_match('/^cmp_[0-9a-f]{32}$/D', $id) !== 1) exit(1);
              echo $id;
          } catch (Throwable $error) { exit(1); }
          PHP
          chmod 600 "$test_id_reader"
          legacy_helper="$private_root/read-test-company-id.php"
          legacy_helper_found=NO
          legacy_helper_removed=NO
          if [ -e "$legacy_helper" ] || [ -L "$legacy_helper" ]; then
            legacy_helper_found=YES
            legacy_helper_sha256=''
            expected_helper_sha256=''
            if [ -f "$legacy_helper" ] && [ ! -L "$legacy_helper" ]; then
              legacy_helper_sha256="$(sha256sum "$legacy_helper" | awk '{print $1}')"
              expected_helper_sha256="$(sha256sum "$test_id_reader" | awk '{print $1}')"
            fi
            if [ ! -f "$legacy_helper" ] || [ -L "$legacy_helper" ] \
              || [ "$(stat -c '%a' "$legacy_helper")" != 600 ] \
              || [ "$legacy_helper_sha256" != "$expected_helper_sha256" ]; then
              echo 'Vorhandener read-test-company-id.php-Helfer ist nicht eindeutig diesem Workflow zuzuordnen.' >&2
              exit 1
            fi
            rm -f -- "$legacy_helper"
            legacy_helper_removed=YES
          fi
          test_company_id="$(PROVISION_RESULT="$private_root/provision-result.json" php -q -f "$test_id_reader")"
          test_root="$private_root/companies/$test_company_id"
          test -d "$test_root"

          tree_fingerprint() {
            root="$1"
            if find "$root" -type l -print -quit | grep -q .; then return 1; fi
            (
              cd "$root"
              find . -type f -print0 | sort -z | while IFS= read -r -d '' file; do
                  relative="${file#./}"
                  size="$(stat -c '%s' "$file")"
                  sha="$(sha256sum "$file" | awk '{print $1}')"
                  printf '%s\0%s\0%s\n' "$relative" "$size" "$sha"
                done
            ) | sha256sum | awk '{print $1}'
          }
          test_fingerprint_before="$(tree_fingerprint "$test_root")"

          cat > "$validator" <<'PHP'
          <?php
          declare(strict_types=1);

          function apply_validation_fail(string $message): never {
              file_put_contents('php://stderr', $message . "\n");
              exit(1);
          }

          function apply_report(string $path): array {
              $raw = (string)file_get_contents($path);
              if (str_starts_with($raw, "\xEF\xBB\xBF")) $raw = substr($raw, 3);
              $raw = str_replace(["\r\n", "\r"], "\n", $raw);
              if (preg_match('/\A(?:(?:Content-Type|X-Powered-By|Status):[^\n]*\n)*\n*(\{.*\})\s*\z/isD', $raw, $matches) !== 1) {
                  apply_validation_fail('Migrationswerkzeug lieferte keine eindeutige JSON-Ausgabe.');
              }
              try { $data = json_decode($matches[1], true, 512, JSON_THROW_ON_ERROR); }
              catch (Throwable $error) { apply_validation_fail('Migrationswerkzeug lieferte ungueltiges JSON.'); }
              if (!is_array($data)) apply_validation_fail('Migrationsbericht ist unvollstaendig.');
              return $data;
          }

          function all_status(array $status, string $expected): bool {
              return $status !== [] && array_filter($status, static fn($value): bool => $value !== $expected) === [];
          }

          function validate_plan(array $data): void {
              $manifest = $data['deterministic_manifest'] ?? [];
              $expected = $manifest['expected_target'] ?? [];
              $gtfsCounts = $manifest['gtfs']['counts'] ?? [];
              if (($manifest['company_id'] ?? '') !== 'cmp_2ff1b82166c99988ed6f7eb51cca7b56'
                  || ($expected['cities'] ?? null) !== 1 || ($expected['lines'] ?? null) !== 3
                  || ($expected['routes'] ?? null) !== 4 || ($expected['route_files'] ?? null) !== 12
                  || ($expected['drivers'] ?? null) !== 1 || ($expected['trainings'] ?? null) !== 1
                  || ($expected['packages'] ?? null) !== 1 || ($expected['documents'] ?? null) !== 2
                  || ($expected['catalog_stops'] ?? null) !== 1531 || ($expected['gtfs_agencies'] ?? null) !== 1
                  || ($manifest['gtfs']['agency_id'] ?? '') !== '143'
                  || ($gtfsCounts['agencies'] ?? null) !== 1 || ($gtfsCounts['routes'] ?? null) !== 75
                  || ($gtfsCounts['trips'] ?? null) !== 3686 || ($gtfsCounts['stop_times'] ?? null) !== 62227
                  || ($gtfsCounts['used_stops'] ?? null) !== 1531
                  || ($manifest['variants_index']['integrity_check'] ?? '') !== 'ok'
                  || ($manifest['variants_index']['routes'] ?? null) !== 75
                  || ($manifest['variants_index']['variants'] ?? null) !== 678
                  || count($manifest['remappings'] ?? []) !== 40
                  || ($manifest['routes']['free_stops_preserved'] ?? null) !== 21
                  || ($manifest['routes']['geometry'] ?? '') !== 'UNCHANGED') {
                  apply_validation_fail('Migrationsplan weicht von der fachlichen Freigabe ab.');
              }
          }

          function redacted_apply_error(string $path, int $exitCode, bool $unexpectedStderr): array {
              $fallback = [
                  'error_code' => $unexpectedStderr
                      ? 'COTTBUS_APPLY_UNEXPECTED_STDERR_FAILED'
                      : 'COTTBUS_APPLY_UNREADABLE_FAILURE',
                  'error_stage' => 'PREPARE_TARGET',
                  'error_category' => 'DIAGNOSTIC_OUTPUT',
                  'sanitized_message' => 'REDACTED',
                  'exit_code' => $exitCode,
                  'rollback_status' => 'UNKNOWN',
                  'failed_operation' => $unexpectedStderr ? 'validate-empty-stderr' : 'parse-private-error-result',
                  'timestamp' => gmdate('c'),
                  'company_id' => 'cmp_2ff1b821...7b56',
              ];
              if ($unexpectedStderr) return $fallback;
              $raw = @file_get_contents($path);
              if (!is_string($raw)) return $fallback;
              if (str_starts_with($raw, "\xEF\xBB\xBF")) $raw = substr($raw, 3);
              $raw = str_replace(["\r\n", "\r"], "\n", $raw);
              if (preg_match('/\A(?:(?:Content-Type|X-Powered-By|Status):[^\n]*\n)*\n*(\{.*\})\s*\z/isD', $raw, $matches) !== 1) return $fallback;
              try { $report = json_decode($matches[1], true, 512, JSON_THROW_ON_ERROR); }
              catch (Throwable $error) { return $fallback; }
              $summary = is_array($report['error_summary'] ?? null) ? $report['error_summary'] : [];
              $allowedStages = ['PREPARE_TARGET','BUILD_ROUTES','BUILD_DRIVERS','BUILD_TRAINING','BUILD_PACKAGE',
                  'BUILD_CATALOG','FILTER_GTFS','BUILD_VARIANTS','VALIDATE_TEMP_ROOT','DB_TRANSACTION',
                  'ROOT_SWAP','POST_VALIDATE','ROLLBACK'];
              $message = trim((string)($summary['sanitized_message'] ?? ''));
              $suspicious = '/(?:password|passwd|secret|token|authorization|bearer|cookie|session|activation[_ -]?token|'
                  . '(?:mysql|pgsql|postgres(?:ql)?):[^\s]*?(?:password|passwd|pwd)=|'
                  . '(?:password|passwd|pwd|token|secret|cookie|session)\s*[:=]\s*\S+)/i';
              if ($message === '' || preg_match($suspicious, $message) === 1
                  || preg_match('/[\x00-\x1F\x7F]/', $message) === 1 || strlen($message) > 240) {
                  $message = 'REDACTED';
              }
              $stage = (string)($summary['error_stage'] ?? '');
              $code = (string)($summary['error_code'] ?? '');
              $category = (string)($summary['error_category'] ?? '');
              $operation = (string)($summary['failed_operation'] ?? '');
              $rollback = (string)($summary['rollback_status'] ?? '');
              $timestamp = (string)($summary['timestamp'] ?? '');
              $company = $summary['company_id'] ?? null;
              if (!in_array($stage, $allowedStages, true)
                  || preg_match('/^COTTBUS_APPLY_[A-Z_]+_(?:FAILED|FAILURE)$/D', $code) !== 1
                  || preg_match('/^[A-Z_]+$/D', $category) !== 1
                  || preg_match('/^[a-z0-9-]+$/D', $operation) !== 1
                  || preg_match('/^[A-Z_]+$/D', $rollback) !== 1
                  || preg_match('/^\d{4}-\d{2}-\d{2}T[^\s]+$/D', $timestamp) !== 1
                  || ($company !== null && preg_match('/^cmp_[0-9a-f]{8}\.\.\.[0-9a-f]{4}$/D', (string)$company) !== 1)) {
                  return $fallback;
              }
              return [
                  'error_code' => $code, 'error_stage' => $stage, 'error_category' => $category,
                  'sanitized_message' => $message, 'exit_code' => $exitCode,
                  'rollback_status' => $rollback, 'failed_operation' => $operation,
                  'timestamp' => $timestamp, 'company_id' => $company,
              ];
          }

          $phase = (string)getenv('VALIDATION_PHASE');
          if ($phase === 'error') {
              $summary = redacted_apply_error(
                  (string)getenv('APPLY_RESULT'),
                  (int)getenv('APPLY_EXIT_CODE'),
                  getenv('APPLY_UNEXPECTED_STDERR') === '1'
              );
              echo json_encode(['COTTBUS_APPLY_ERROR_SUMMARY' => $summary], JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR), "\n";
              echo 'COTTBUS_APPLY_ROLLBACK_STATUS=', $summary['rollback_status'], "\n";
              exit;
          }
          if ($phase === 'pre') {
              $privateRoot = (string)getenv('STAGING_PRIVATE_ROOT');
              $expectedBackup = (string)getenv('EXPECTED_BACKUP_SHA256');
              $foundRestorePoint = false;
              foreach (glob($privateRoot . '/backups/control-db/*', GLOB_ONLYDIR) ?: [] as $directory) {
                  $dump = $directory . '/control.sql';
                  $manifestPath = $directory . '/manifest.json';
                  if (is_link($directory) || !is_file($dump) || is_link($dump) || !is_file($manifestPath) || is_link($manifestPath)) continue;
                  if (!hash_equals($expectedBackup, (string)hash_file('sha256', $dump))) continue;
                  try { $manifest = json_decode((string)file_get_contents($manifestPath), true, 512, JSON_THROW_ON_ERROR); }
                  catch (Throwable $error) { continue; }
                  if (!hash_equals($expectedBackup, (string)($manifest['sha256'] ?? ''))
                      || (int)($manifest['bytes'] ?? -1) !== (int)filesize($dump)
                      || ($manifest['schema_version'] ?? null) !== '6'
                      || ($manifest['restore']['client_validated'] ?? false) !== true
                      || substr(sprintf('%o', fileperms($directory)), -3) !== '700'
                      || substr(sprintf('%o', fileperms($dump)), -3) !== '600'
                      || substr(sprintf('%o', fileperms($manifestPath)), -3) !== '600') continue;
                  $foundRestorePoint = true;
              }
              if (!$foundRestorePoint) apply_validation_fail('Freigegebener DB-Restore-Punkt fehlt oder ist ungueltig.');
              $pre = apply_report((string)getenv('PRE_RESULT'));
              validate_plan($pre);
              $status = $pre['real_target']['target_status'] ?? [];
              if (($pre['mode'] ?? '') !== 'DRY_RUN' || ($pre['READY_FOR_APPLY'] ?? '') !== 'YES'
                  || ($pre['APPLY_ORCHESTRATION_READY'] ?? '') !== 'YES' || ($pre['BLOCKERS'] ?? null) !== []
                  || ($pre['DB_BACKUP_CAPABLE'] ?? '') !== 'YES' || ($pre['DB_RESTORE_PATH_VALID'] ?? '') !== 'YES'
                  || ($pre['VARIANTS_REBUILD_CAPABLE'] ?? '') !== 'YES'
                  || ($pre['VARIANTS_VALIDATION_CAPABLE'] ?? '') !== 'YES'
                  || !all_status($status, 'CREATE')
                  || ($pre['real_target']['target_unchanged'] ?? false) !== true
                  || ($pre['real_target']['other_tenants_unchanged'] ?? false) !== true
                  || ($pre['read_only_evidence']['database_writes'] ?? -1) !== 0
                  || ($pre['read_only_evidence']['target_writes'] ?? -1) !== 0) {
                  apply_validation_fail('Unmittelbarer Apply-Preflight ist nicht freigegeben.');
              }
              $source = (string)($pre['SOURCE_FINGERPRINT'] ?? '');
              if (preg_match('/^[0-9a-f]{64}$/D', $source) !== 1) apply_validation_fail('Source-Fingerprint fehlt.');
              $approval = 'LIVE-COTTBUS:' . $source;
              if (file_put_contents((string)getenv('APPROVAL_FILE'), $approval, LOCK_EX) !== strlen($approval)
                  || !chmod((string)getenv('APPROVAL_FILE'), 0600)) {
                  apply_validation_fail('Source-Freigabe konnte nicht privat festgehalten werden.');
              }
              $state = [
                  'source_fingerprint' => $source,
                  'target_before' => $pre['real_target']['target_fingerprint_before'],
                  'other_tenants_before' => $pre['real_target']['other_tenants_fingerprint_before'],
              ];
              $encoded = json_encode($state, JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . "\n";
              if (file_put_contents((string)getenv('PRE_STATE'), $encoded, LOCK_EX) !== strlen($encoded)
                  || !chmod((string)getenv('PRE_STATE'), 0600)) apply_validation_fail('Pre-State konnte nicht gespeichert werden.');
              echo json_encode([
                  'READY_FOR_APPLY' => 'YES', 'APPLY_ORCHESTRATION_READY' => 'YES', 'BLOCKERS' => [],
                  'restore_point_verified' => true, 'target_status' => ['CREATE' => count($status)],
                  'cottbus_fingerprint_before' => $pre['real_target']['target_fingerprint_before'] ?? null,
                  'source_fingerprint' => $source,
                  'source_files_verified' => $pre['read_only_evidence']['source_files_verified_after_plan'] ?? null,
              ], JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR), "\n";
              exit;
          }

          if ($phase !== 'post') apply_validation_fail('Unbekannte Validierungsphase.');
          $apply = apply_report((string)getenv('APPLY_RESULT'));
          $post = apply_report((string)getenv('POST_RESULT'));
          validate_plan($apply);
          validate_plan($post);
          try { $preState = json_decode((string)file_get_contents((string)getenv('PRE_STATE')), true, 512, JSON_THROW_ON_ERROR); }
          catch (Throwable $error) { apply_validation_fail('Pre-State ist unlesbar.'); }
          $applyStatus = $apply['apply_result']['target_status'] ?? [];
          $postStatus = $post['real_target']['target_status'] ?? [];
          if (($apply['mode'] ?? '') !== 'APPLY') { apply_validation_fail('Apply-Modus fehlt.'); }
          if (($apply['apply_result']['result'] ?? '') !== 'APPLIED') { apply_validation_fail('Apply wurde nicht abgeschlossen.'); }
          if (!all_status($applyStatus, 'CREATE')) { apply_validation_fail('Apply-Status ist nicht vollstaendig CREATE.'); }
          if (($apply['apply_result']['rollback_cleanup_pending'] ?? true) !== false) { apply_validation_fail('Rollback-Bereich ist nicht bereinigt.'); }
          if (($apply['apply_result']['db_restore_point_retained'] ?? false) !== true) { apply_validation_fail('Apply-Restore-Punkt wurde nicht erhalten.'); }
          if (($apply['apply_result']['variants_index']['integrity_check'] ?? '') !== 'ok') { apply_validation_fail('Variantenindex ist nicht integer.'); }
          if (($apply['apply_result']['variants_index']['routes'] ?? null) !== 75) { apply_validation_fail('Variantenindex-Routen weichen ab.'); }
          if (($apply['apply_result']['variants_index']['variants'] ?? null) !== 678) { apply_validation_fail('Variantenanzahl weicht ab.'); }
          if (strval($post['mode'] ?? '') !== 'DRY_RUN') { apply_validation_fail('Idempotenz-Dry-Run fehlt.'); }
          if (strval($post['READY_FOR_APPLY'] ?? '') !== 'YES') { apply_validation_fail('Post-Dry-Run ist nicht bereit.'); }
          if (strval($post['APPLY_ORCHESTRATION_READY'] ?? '') !== 'YES') { apply_validation_fail('Post-Dry-Run-Orchestrierung ist nicht bereit.'); }
          if (!is_array($post['BLOCKERS'] ?? null) || count($post['BLOCKERS']) !== 0) { apply_validation_fail('Post-Dry-Run meldet Blocker.'); }
          if (!all_status($postStatus, 'SKIP')) { apply_validation_fail('Idempotenz-Dry-Run ist nicht vollstaendig SKIP.'); }
          if (($post['real_target']['target_unchanged'] ?? false) !== true) { apply_validation_fail('Post-Dry-Run veraenderte Cottbus.'); }
          if (($post['real_target']['other_tenants_unchanged'] ?? false) !== true) { apply_validation_fail('Post-Dry-Run veraenderte fremde Tenants.'); }
          if (intval($post['read_only_evidence']['database_writes'] ?? -1) !== 0) { apply_validation_fail('Post-Dry-Run schrieb in die DB.'); }
          if (intval($post['read_only_evidence']['target_writes'] ?? -1) !== 0) { apply_validation_fail('Post-Dry-Run schrieb in den Tenant.'); }
          $postSourceFingerprint = (string)($post['SOURCE_FINGERPRINT'] ?? '');
          $postOtherTenants = (string)($post['real_target']['other_tenants_fingerprint_after'] ?? '');
          if (!hash_equals((string)$preState['source_fingerprint'], $postSourceFingerprint)) { apply_validation_fail('Source-Fingerprint driftete waehrend des Apply.'); }
          if (!hash_equals((string)$preState['other_tenants_before'], $postOtherTenants)) { apply_validation_fail('Ein anderer Tenant wurde veraendert.'); }
          $manifest = $apply['deterministic_manifest'];
          $safe = [
              'apply_started' => true, 'apply_successful' => true, 'rollback_required' => false,
              'result' => 'APPLIED', 'post_dry_run' => 'ALL_SKIP', 'BLOCKERS' => [],
              'counts' => $manifest['expected_target'], 'gtfs_counts' => $manifest['gtfs']['counts'],
              'variants_index' => $manifest['variants_index'],
              'remappings' => ['total' => count($manifest['remappings']), 'EXACT' => 36, 'HIGH' => 4],
              'free_stops_preserved' => $manifest['routes']['free_stops_preserved'],
              'route_geometry' => $manifest['routes']['geometry'],
              'cottbus_fingerprint_before' => $preState['target_before'],
              'cottbus_fingerprint_after' => $post['real_target']['target_fingerprint_after'],
              'other_tenants_unchanged' => true,
              'apply_restore_point' => [
                  'bytes' => $apply['apply_result']['db_restore_point']['bytes'] ?? null,
                  'sha256' => $apply['apply_result']['db_restore_point']['sha256'] ?? null,
                  'retained' => true,
              ],
          ];
          $json = json_encode($safe, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . "\n";
          if (file_put_contents((string)getenv('SAFE_RESULT'), $json, LOCK_EX) !== strlen($json)
              || !chmod((string)getenv('SAFE_RESULT'), 0600)) apply_validation_fail('Sicherer Apply-Bericht konnte nicht geschrieben werden.');
          PHP
          chmod 600 "$validator"
          LEHRFAHRER_ENV=staging \
          LEHRFAHRER_APP_ROOT="$webroot" \
          LEHRFAHRER_PRIVATE_DATA_DIR="$private_root" \
          LEHRFAHRER_STAGING_CGI_DRY_RUN=1 \
            php -q -d max_execution_time=900 -d register_argc_argv=1 -d "auto_prepend_file=$private_root/runtime-env.php" \
              -f "$private_root/cottbus-migrate-staging.php" -- \
              --dry-run --public-root="$live_webroot" --private-root="$live_private" \
              --gtfs-zip="$gtfs_source" --company-id="$company_id" \
              --staging-private-root="$private_root" --compact > "$pre_result"
          chmod 600 "$pre_result"
          VALIDATION_PHASE=pre STAGING_PRIVATE_ROOT="$private_root" \
          EXPECTED_BACKUP_SHA256="$expected_backup_sha256" PRE_RESULT="$pre_result" \
          APPROVAL_FILE="$approval_file" PRE_STATE="$pre_state" \
            php -q -f "$validator"

          if [ "$apply_cottbus" != true ]; then
            test_fingerprint_after="$(tree_fingerprint "$test_root")"
            if [ "$test_fingerprint_before" != "$test_fingerprint_after" ]; then
              echo 'lehrfahrer-test wurde durch den Preflight veraendert.' >&2
              exit 1
            fi
            printf 'COTTBUS_PREFLIGHT_ONLY=YES\n'
            printf 'LEHRFAHRER_TEST_FINGERPRINT_BEFORE=%s\n' "$test_fingerprint_before"
            printf 'LEHRFAHRER_TEST_FINGERPRINT_AFTER=%s\n' "$test_fingerprint_after"
            printf 'LEGACY_HELPER_FOUND=%s\n' "$legacy_helper_found"
            printf 'LEGACY_HELPER_REMOVED=%s\n' "$legacy_helper_removed"
            exit 0
          fi

          source_approval="$(cat "$approval_file")"
          set +e
          LEHRFAHRER_ENV=staging \
          LEHRFAHRER_APP_ROOT="$webroot" \
          LEHRFAHRER_PRIVATE_DATA_DIR="$private_root" \
          LEHRFAHRER_STAGING_CGI_APPLY=1 \
            php -q -d max_execution_time=900 -d register_argc_argv=1 -d "auto_prepend_file=$private_root/runtime-env.php" \
              -f "$private_root/cottbus-migrate-staging.php" -- \
              --apply --confirm=APPLY-COTTBUS-STAGING \
              --source-approval="$source_approval" \
              --public-root="$live_webroot" --private-root="$live_private" \
              --gtfs-zip="$gtfs_source" --company-id="$company_id" \
              --staging-private-root="$private_root" --compact > "$apply_result" 2> "$apply_stderr"
          apply_exit=$?
          set -e
          chmod 600 "$apply_result"
          chmod 600 "$apply_stderr"
          if [ "$apply_exit" -ne 0 ] || [ -s "$apply_stderr" ]; then
            diagnostic_failure=1
            if [ "$apply_exit" -eq 0 ]; then apply_exit=70; fi
            unexpected_stderr=0
            if [ -s "$apply_stderr" ]; then unexpected_stderr=1; fi
            VALIDATION_PHASE=error APPLY_RESULT="$apply_result" APPLY_EXIT_CODE="$apply_exit" \
            APPLY_UNEXPECTED_STDERR="$unexpected_stderr" php -q -f "$validator"
            exit "$apply_exit"
          fi

          LEHRFAHRER_ENV=staging \
          LEHRFAHRER_APP_ROOT="$webroot" \
          LEHRFAHRER_PRIVATE_DATA_DIR="$private_root" \
          LEHRFAHRER_STAGING_CGI_DRY_RUN=1 \
            php -q -d max_execution_time=900 -d register_argc_argv=1 -d "auto_prepend_file=$private_root/runtime-env.php" \
              -f "$private_root/cottbus-migrate-staging.php" -- \
              --dry-run --public-root="$live_webroot" --private-root="$live_private" \
              --gtfs-zip="$gtfs_source" --company-id="$company_id" \
              --staging-private-root="$private_root" --compact > "$post_result"
          chmod 600 "$post_result"

          test_fingerprint_after="$(tree_fingerprint "$test_root")"
          if [ "$test_fingerprint_before" != "$test_fingerprint_after" ]; then
            echo 'lehrfahrer-test wurde durch den Apply veraendert.' >&2
            exit 1
          fi
          VALIDATION_PHASE=post APPLY_RESULT="$apply_result" POST_RESULT="$post_result" \
          PRE_STATE="$pre_state" SAFE_RESULT="$safe_result" php -q -f "$validator"
          cat "$safe_result"
          printf 'LEHRFAHRER_TEST_FINGERPRINT_BEFORE=%s\n' "$test_fingerprint_before"
          printf 'LEHRFAHRER_TEST_FINGERPRINT_AFTER=%s\n' "$test_fingerprint_after"
          printf 'LEGACY_HELPER_FOUND=%s\n' "$legacy_helper_found"
          printf 'LEGACY_HELPER_REMOVED=%s\n' "$legacy_helper_removed"
          REMOTE_SCRIPT

          remote_status=$?
          set -e

          "${SSH_RUN[@]}" "$REMOTE" \
            "bash -s -- '$STAGING_PRIVATE_PATH'" <<'REMOTE_CLEANUP_CHECK'
          set -euo pipefail
          private_root="$(cd "./$1" && pwd -P)"
          if find "$private_root" -maxdepth 1 -name '.cottbus-apply.*' -print -quit | grep -q .; then
            echo 'Privater Cottbus-Arbeitsbereich wurde nicht vollstaendig entfernt.' >&2
            exit 1
          fi
          if [ -e "$private_root/read-test-company-id.php" ] || [ -L "$private_root/read-test-company-id.php" ]; then
            echo 'Alter read-test-company-id.php-Helfer ist noch vorhanden.' >&2
            exit 1
          fi
          echo 'COTTBUS_TEMP_CLEANUP=OK'
          REMOTE_CLEANUP_CHECK
          if [ "$remote_status" -ne 0 ]; then exit "$remote_status"; fi

      - name: Verify live public content is unchanged
        shell: bash
        run: |
          set -euo pipefail
          for host in lehrfahrer.de www.lehrfahrer.de; do
            curl --fail --silent --show-error --location "https://${host}/VERSION" \
              | sha256sum >> /tmp/lehrfahrer-live-after.sha256
          done
          cmp /tmp/lehrfahrer-live-before.sha256 /tmp/lehrfahrer-live-after.sha256
