name: Read-only A4 staging acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-check:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Configure existing staging SSH access
        shell: bash
        env:
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          STRATO_PORT: ${{ secrets.STRATO_PORT }}
          STRATO_SSH_KEY: ${{ secrets.STRATO_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$STRATO_SSH_KEY" ]; then
            printf '%s\n' "$STRATO_SSH_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
          else
            if ! sudo apt-get update -qq >/dev/null 2>&1 \
                || ! sudo apt-get install -y -qq sshpass >/dev/null 2>&1; then
              echo 'SMOKE_CATEGORY=ACCESS_FAILURE'
              exit 0
            fi
          fi
          if [ -n "${{ secrets.STRATO_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.STRATO_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$STRATO_PORT" "$STRATO_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Verify TESTA4 audit sequence and chain without writes
        shell: bash
        env:
          SSHPASS: ${{ secrets.STRATO_PASSWORD }}
          STRATO_USER: ${{ secrets.STRATO_USER }}
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          STRATO_PORT: ${{ secrets.STRATO_PORT }}
          STRATO_SSH_KEY: ${{ secrets.STRATO_SSH_KEY }}
          STAGING_TARGET_PATH: ${{ vars.STAGING_TARGET_PATH }}
          STAGING_PRIVATE_PATH: ${{ vars.STAGING_PRIVATE_PATH }}
          LIVE_TARGET_PATH: ${{ secrets.STRATO_TARGET_PATH }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "diagnose/a4-readonly-20261108"
          for path in "$STAGING_TARGET_PATH" "$STAGING_PRIVATE_PATH" "$LIVE_TARGET_PATH"; do
          [[ "$path" =~ ^[A-Za-z0-9_./-]+$ ]]
          case "$path" in /*|.|..|*../*|*/..) exit 1;; esac
          done
          ssh_run() {
          if [ -n "$STRATO_SSH_KEY" ]; then
          ssh -p "$STRATO_PORT" -o UpdateHostKeys=no -o StrictHostKeyChecking=yes -i ~/.ssh/id_rsa "$@"
          else
          sshpass -e ssh -p "$STRATO_PORT" -o UpdateHostKeys=no -o StrictHostKeyChecking=yes "$@"
          fi
          }
          ssh_run "$STRATO_USER@$STRATO_HOST" "bash -s -- '$STAGING_TARGET_PATH' '$STAGING_PRIVATE_PATH' '$LIVE_TARGET_PATH'" <<'REMOTE_A4'
          set -euo pipefail
          webroot="$(cd "./$1" && pwd -P)"
          private_root="$(cd "./$2" && pwd -P)"
          live_root="$(cd "./$3" && pwd -P)"
          test "$webroot" != "$live_root"
          test "$private_root" != "$live_root"
          test "$webroot" != "$private_root"
          test -f "$private_root/runtime-env.php"
          LEHRFAHRER_ENV=staging LEHRFAHRER_APP_ROOT="$webroot" LEHRFAHRER_PRIVATE_DATA_DIR="$private_root" \
          php -q -d "auto_prepend_file=$private_root/runtime-env.php" <<'PHP'
          <?php
          set_exception_handler(static function(Throwable $e):void {fwrite(STDERR,"A4_CHECK_FAILED: ".$e->getMessage()."\n");exit(1);});
          require_once getenv('LEHRFAHRER_APP_ROOT').'/api/_audit.php';
          if(lehrfahrer_environment()!=='staging') throw new RuntimeException('Environment mismatch');
          $c=lehrfahrer_control_mysql_configuration();
          $pdo=new PDO($c['dsn'],$c['user'],$c['password'],$c['options']);
          $pdo->exec('SET TRANSACTION READ ONLY');
          $pdo->beginTransaction();
          $company='cmp_2ff1b82166c99988ed6f7eb51cca7b56';
          $reference='cottbus/Linie_TESTA4/Standard/Route_01_Audit-Abnahme.json';
          $object='route_'.substr(hash('sha256',$company."\0".$reference),0,32);
          $q=$pdo->prepare('SELECT sequence_number,occurred_at,account_id,membership_id,context_type,company_id,capability_snapshot,action,result FROM audit_events WHERE object_type=? AND object_id=? ORDER BY sequence_number');
          $q->execute(['ROUTE',$object]);$rows=$q->fetchAll(PDO::FETCH_ASSOC);
          $actions=array_column($rows,'action');
          if($actions!==['ROUTE_CREATE','ROUTE_CHANGE','ROUTE_DELETE']) throw new RuntimeException('Unexpected event sequence: '.json_encode($actions));
          $actor=$rows[0]['account_id'];$membership=$rows[0]['membership_id'];
          if(!$actor||!$membership) throw new RuntimeException('Actor missing');
          foreach($rows as $r){
          if($r['company_id']!==$company||$r['context_type']!=='TENANT'||$r['result']!=='SUCCESS'||$r['account_id']!==$actor||$r['membership_id']!==$membership) throw new RuntimeException('Tenant or actor mismatch');
          if($r['capability_snapshot']!==($r['action']==='ROUTE_DELETE'?'routes.delete':'routes.write')) throw new RuntimeException('Capability mismatch');
          }
          if(!lehrfahrer_audit_verify_chain($pdo)) throw new RuntimeException('Audit chain invalid');
          $pdo->rollBack();
          echo json_encode(['environment'=>'staging','routeEvents'=>$actions,'eventCount'=>count($rows),'actorConsistent'=>true,'tenantConsistent'=>true,'capabilitiesCorrect'=>true,'unchangedSaveHasNoExtraEvent'=>true,'auditChainValid'=>true,'databaseReadOnly'=>true],JSON_THROW_ON_ERROR)."\n";
          PHP
          REMOTE_A4
