name: Deploy staging to Strato

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: ["staging"]
  workflow_dispatch:

concurrency:
  group: deploy-strato-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.lehrfahrer.de

    steps:
      - name: Checkout staging commit
        uses: actions/checkout@v5

      - name: Preflight and regression checks
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "staging"
          git diff --check

          while IFS= read -r -d '' file; do
            case "$file" in
              build/*|editor/*|backup_liniendaten/*) continue ;;
            esac
            node --check "$file"
          done < <(git ls-files -z -- '*.js')

          while IFS= read -r -d '' file; do
            case "$file" in
              api/pdf/test_preview.php|api/pdf/test_preview_v2.php|api/pdf/preview_v2.php) continue ;;
            esac
            php -l "$file" >/dev/null
          done < <(git ls-files -z -- '*.php')

          node --test \
            tools/company-provisioning.test.js \
            tools/control-database.test.js \
            tools/session-auth.test.js \
            tools/capability-authorization.test.js \
            tools/security-dom-xss.test.js \
            tools/security-sensitive-storage.test.js \
            tools/tenant-storage.test.js \
            tools/tenant-lines-cities.test.js \
            tools/tenant-personnel.test.js \
            tools/tenant-catalog-imports.test.js

      - name: Validate isolated staging configuration
        shell: bash
        env:
          STAGING_TARGET_PATH: ${{ vars.STAGING_TARGET_PATH }}
          STAGING_PRIVATE_PATH: ${{ vars.STAGING_PRIVATE_PATH }}
          STAGING_AUTH_PATH: ${{ vars.STAGING_AUTH_PATH }}
          LIVE_TARGET_PATH: ${{ secrets.STRATO_TARGET_PATH }}
          STAGING_DB_DSN: ${{ secrets.STAGING_DB_DSN }}
          STAGING_DB_USER: ${{ secrets.STAGING_DB_USER }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_DB_TLS_CA_PEM: ${{ secrets.STAGING_DB_TLS_CA_PEM }}
          STAGING_API_TOKEN: ${{ secrets.STAGING_API_TOKEN }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          STAGING_BASIC_AUTH_USER: ${{ secrets.STAGING_BASIC_AUTH_USER }}
          STAGING_BASIC_AUTH_PASSWORD: ${{ secrets.STAGING_BASIC_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          required=(
            STAGING_TARGET_PATH STAGING_PRIVATE_PATH STAGING_AUTH_PATH LIVE_TARGET_PATH
            STAGING_DB_DSN STAGING_DB_USER STAGING_DB_PASSWORD STAGING_DB_TLS_CA_PEM
            STAGING_API_TOKEN STAGING_ADMIN_PASSWORD
            STAGING_BASIC_AUTH_USER STAGING_BASIC_AUTH_PASSWORD
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Fehlende Staging-Konfiguration: $name" >&2
              exit 1
            fi
          done
          for path in "$STAGING_TARGET_PATH" "$STAGING_PRIVATE_PATH" "$STAGING_AUTH_PATH"; do
            case "$path" in
              /*|.|..|*../*|*/..|*//*|*[!A-Za-z0-9._/-]*)
                echo "Unsicherer Staging-Pfad." >&2
                exit 1
                ;;
            esac
          done
          normalize() { printf '%s' "${1#/}" | sed 's:/*$::'; }
          if [ "$(normalize "$STAGING_TARGET_PATH")" = "$(normalize "$LIVE_TARGET_PATH")" ]; then
            echo "Staging- und Live-DocumentRoot duerfen nicht identisch sein." >&2
            exit 1
          fi
          if [ "$(normalize "$STAGING_TARGET_PATH")" = "$(normalize "$STAGING_AUTH_PATH")" ] \
              || [ "$(normalize "$STAGING_PRIVATE_PATH")" = "$(normalize "$STAGING_AUTH_PATH")" ]; then
            echo "Staging-Auth-Pfad muss von DocumentRoot und Private Storage getrennt sein." >&2
            exit 1
          fi
          case "$(normalize "$STAGING_PRIVATE_PATH")" in
            lehrfahrer-private|*/lehrfahrer-private)
              echo "Staging darf nicht den Live-Private-Storage verwenden." >&2
              exit 1
              ;;
          esac

      - name: Fingerprint live before staging deployment
        shell: bash
        run: |
          set -euo pipefail
          for host in lehrfahrer.de www.lehrfahrer.de; do
            curl --fail --silent --show-error --location "https://${host}/VERSION" \
              | sha256sum >> /tmp/lehrfahrer-live-before.sha256
          done

      - name: Prepare SSH client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [ -n "${{ secrets.STRATO_SSH_KEY }}" ]; then
            printf '%s\n' "${{ secrets.STRATO_SSH_KEY }}" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
          else
            sudo apt-get update
            sudo apt-get install -y sshpass
          fi
          if [ -n "${{ secrets.STRATO_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.STRATO_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${{ secrets.STRATO_PORT }}" "${{ secrets.STRATO_HOST }}" >> ~/.ssh/known_hosts
          fi

      - name: Build private staging runtime files
        shell: bash
        env:
          STAGING_DB_DSN: ${{ secrets.STAGING_DB_DSN }}
          STAGING_DB_USER: ${{ secrets.STAGING_DB_USER }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_DB_TLS_CA_PEM: ${{ secrets.STAGING_DB_TLS_CA_PEM }}
          STAGING_API_TOKEN: ${{ secrets.STAGING_API_TOKEN }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          STAGING_BASIC_AUTH_USER: ${{ secrets.STAGING_BASIC_AUTH_USER }}
          STAGING_BASIC_AUTH_PASSWORD: ${{ secrets.STAGING_BASIC_AUTH_PASSWORD }}
          STAGING_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          STAGING_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          export RUNTIME_OUTPUT=/tmp/lehrfahrer-staging-runtime-env.php
          export PROVISION_SECRET_OUTPUT=/tmp/lehrfahrer-staging-provision-secret.php
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export DEPLOYED_AT
          php <<'PHP'
          <?php
          $values = [
              'LEHRFAHRER_ENV' => 'staging',
              'LEHRFAHRER_PUBLIC_ORIGIN' => 'https://staging.lehrfahrer.de',
              'LEHRFAHRER_DB_DRIVER' => 'mysql',
              'LEHRFAHRER_DB_DSN' => getenv('STAGING_DB_DSN'),
              'LEHRFAHRER_DB_USER' => getenv('STAGING_DB_USER'),
              'LEHRFAHRER_DB_PASSWORD' => getenv('STAGING_DB_PASSWORD'),
              'LEHRFAHRER_DB_TLS_REQUIRED' => '1',
              'LEHRFAHRER_API_TOKEN' => getenv('STAGING_API_TOKEN'),
              'LEHRFAHRER_BUILD_COMMIT' => getenv('STAGING_BUILD_COMMIT'),
              'LEHRFAHRER_BUILD_ID' => getenv('STAGING_BUILD_ID'),
              'LEHRFAHRER_DEPLOYED_AT' => getenv('DEPLOYED_AT'),
              'LEHRFAHRER_STAGING_COMPANY_SLUG' => 'lehrfahrer-test',
          ];
          $php = "<?php\nputenv('LEHRFAHRER_PRIVATE_DATA_DIR=' . __DIR__);\n"
              . "putenv('LEHRFAHRER_DB_TLS_CA=' . __DIR__ . '/mariadb-ca.pem');\n";
          foreach ($values as $name => $value) {
              $php .= 'putenv(' . var_export($name . '=' . $value, true) . ");\n";
          }
          $php .= "if (is_file(__DIR__ . '/tenant-binding.php')) require __DIR__ . '/tenant-binding.php';\n";
          file_put_contents(getenv('RUNTIME_OUTPUT'), $php);
          file_put_contents(
              getenv('PROVISION_SECRET_OUTPUT'),
              "<?php\nputenv(" . var_export(
                  'LEHRFAHRER_STAGING_ADMIN_PASSWORD=' . getenv('STAGING_ADMIN_PASSWORD'),
                  true
              ) . ");\n"
          );
          PHP
          printf '%s\n' "$STAGING_DB_TLS_CA_PEM" > /tmp/lehrfahrer-staging-mariadb-ca.pem
          if ! command -v htpasswd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y apache2-utils
          fi
          printf '%s' "$STAGING_BASIC_AUTH_PASSWORD" \
            | htpasswd -n -i -B -C 12 "$STAGING_BASIC_AUTH_USER" \
            > /tmp/lehrfahrer-staging.htpasswd
          chmod 600 \
            /tmp/lehrfahrer-staging-runtime-env.php \
            /tmp/lehrfahrer-staging-provision-secret.php \
            /tmp/lehrfahrer-staging-mariadb-ca.pem \
            /tmp/lehrfahrer-staging.htpasswd

      - name: Deploy only to isolated staging paths
        shell: bash
        env:
          SSHPASS: ${{ secrets.STRATO_PASSWORD }}
          STAGING_TARGET_PATH: ${{ vars.STAGING_TARGET_PATH }}
          STAGING_PRIVATE_PATH: ${{ vars.STAGING_PRIVATE_PATH }}
          STAGING_AUTH_PATH: ${{ vars.STAGING_AUTH_PATH }}
          BASIC_USER: ${{ secrets.STAGING_BASIC_AUTH_USER }}
          BASIC_PASSWORD: ${{ secrets.STAGING_BASIC_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          REMOTE="${{ secrets.STRATO_USER }}@${{ secrets.STRATO_HOST }}"
          SSH_BASE=(ssh -p "${{ secrets.STRATO_PORT }}" -o UpdateHostKeys=no -o StrictHostKeyChecking=yes)
          SCP_BASE=(scp -P "${{ secrets.STRATO_PORT }}" -o UpdateHostKeys=no -o StrictHostKeyChecking=yes)
          if [ -n "${{ secrets.STRATO_SSH_KEY }}" ]; then
            SSH_BASE+=(-i ~/.ssh/id_rsa)
            SCP_BASE+=(-i ~/.ssh/id_rsa)
            RSYNC_SSH="ssh -p ${{ secrets.STRATO_PORT }} -i ~/.ssh/id_rsa -o UpdateHostKeys=no -o StrictHostKeyChecking=yes"
            SSH_RUN=("${SSH_BASE[@]}")
            SCP_RUN=("${SCP_BASE[@]}")
            RSYNC_RUN=(rsync)
          else
            SSH_RUN=(sshpass -e "${SSH_BASE[@]}")
            SCP_RUN=(sshpass -e "${SCP_BASE[@]}")
            RSYNC_SSH="ssh -p ${{ secrets.STRATO_PORT }} -o UpdateHostKeys=no -o StrictHostKeyChecking=yes"
            RSYNC_RUN=(sshpass -e rsync)
          fi

          "${SSH_RUN[@]}" "$REMOTE" \
            "mkdir -p -- './$STAGING_TARGET_PATH' './$STAGING_PRIVATE_PATH' './$STAGING_AUTH_PATH' && chmod 700 './$STAGING_PRIVATE_PATH'"

          "${RSYNC_RUN[@]}" -az --omit-dir-times --no-perms --no-owner --no-group \
            --exclude '.git/' --exclude '.github/' --exclude '.vscode/' \
            --exclude 'WorkingSystem/' --exclude 'Offlinekarten/' --exclude 'backup/' \
            --exclude 'backup_liniendaten/' --exclude 'autosave/' --exclude 'build/' \
            --exclude 'editor/' --exclude 'docs/' --exclude 'deploy/' --exclude 'tools/' \
            --exclude '_linien/' --exclude 'linien/test/' --exclude 'app5/' --exclude 'app6/' \
            --exclude 'node_modules/' --exclude '*.bak' --exclude '*.tmp' --exclude '*.log' \
            -e "$RSYNC_SSH" ./ "$REMOTE:./$STAGING_TARGET_PATH/"

          "${SCP_RUN[@]}" \
            /tmp/lehrfahrer-staging-runtime-env.php \
            /tmp/lehrfahrer-staging-provision-secret.php \
            /tmp/lehrfahrer-staging-mariadb-ca.pem \
            tools/provision-staging-company.php \
            tools/staging-smoke.php \
            "$REMOTE:./$STAGING_PRIVATE_PATH/"

          "${SCP_RUN[@]}" /tmp/lehrfahrer-staging.htpasswd \
            "$REMOTE:./$STAGING_AUTH_PATH/"

          "${SSH_RUN[@]}" "$REMOTE" \
            "bash -s -- '$STAGING_TARGET_PATH' '$STAGING_PRIVATE_PATH' '$STAGING_AUTH_PATH'" <<'REMOTE_SCRIPT'
          set -euo pipefail
          staging_target="$1"
          staging_private="$2"
          staging_auth="$3"
          webroot="$(cd "./$staging_target" && pwd -P)"
          private_root="$(cd "./$staging_private" && pwd -P)"
          auth_root="$(cd "./$staging_auth" && pwd -P)"
          case "$private_root/" in "$webroot/"*) exit 20 ;; esac
          case "$webroot/" in "$private_root/"*) exit 21 ;; esac
          case "$auth_root/" in "$webroot/"*|"$private_root/"*) exit 22 ;; esac
          case "$webroot/" in "$auth_root/"*) exit 23 ;; esac
          case "$private_root/" in "$auth_root/"*) exit 24 ;; esac

          chmod 700 "$private_root"
          chmod 600 \
            "$private_root/lehrfahrer-staging-runtime-env.php" \
            "$private_root/lehrfahrer-staging-provision-secret.php" \
            "$private_root/lehrfahrer-staging-mariadb-ca.pem"
          mv "$private_root/lehrfahrer-staging-runtime-env.php" "$private_root/runtime-env.php"
          mv "$private_root/lehrfahrer-staging-provision-secret.php" "$private_root/.provision-secret.php"
          mv "$private_root/lehrfahrer-staging-mariadb-ca.pem" "$private_root/mariadb-ca.pem"

          webroot_group_id="$(stat -c '%g' "$webroot")"
          apache_identities="$(ps -eo user=,group=,comm= 2>/dev/null \
            | awk '$3 ~ /^(apache2|httpd)$/ { print $1 ":" $2 }' \
            | sort -u | paste -sd, - || true)"
          if [ -z "$apache_identities" ]; then apache_identities=not-visible; fi
          if chgrp "$webroot_group_id" "$auth_root" "$auth_root/lehrfahrer-staging.htpasswd"; then
            auth_group_mode=available
          else
            auth_group_mode=unavailable
          fi
          chmod 750 "$auth_root"
          chmod 640 "$auth_root/lehrfahrer-staging.htpasswd"
          mv "$auth_root/lehrfahrer-staging.htpasswd" "$auth_root/.htpasswd"
          printf 'Basic-Auth-Pruefung: apache_identitaet=%s gruppenmodus=%s verzeichnis=750 datei=640\n' \
            "$apache_identities" "$auth_group_mode"

          printf 'auto_prepend_file=%s\n' "$private_root/runtime-env.php" > "$webroot/.user.ini"
          chmod 600 "$webroot/.user.ini"
          if [ -f "$webroot/.htaccess" ]; then
            sed '/# BEGIN LEHRFAHRER STAGING/,/# END LEHRFAHRER STAGING/d' "$webroot/.htaccess" \
              > "$webroot/.htaccess.staging"
            mv "$webroot/.htaccess.staging" "$webroot/.htaccess"
          fi
          cat >> "$webroot/.htaccess" <<HTACCESS
          # BEGIN LEHRFAHRER STAGING
          AuthType Basic
          AuthName "Lehrfahrer Staging"
          AuthUserFile "$auth_root/.htpasswd"
          Require valid-user
          <IfModule mod_headers.c>
            Header always set X-Robots-Tag "noindex, nofollow, noarchive"
          </IfModule>
          # END LEHRFAHRER STAGING
          HTACCESS
          printf 'User-agent: *\nDisallow: /\n' > "$webroot/robots.txt"

          cat > "$private_root/run-provision.php" <<PHP
          <?php
          putenv('LEHRFAHRER_APP_ROOT=$webroot');
          putenv('LEHRFAHRER_STAGING_CGI_PROVISION=1');
          putenv('LEHRFAHRER_STAGING_PROVISION_RESULT_FILE=$private_root/provision-result.json');
          file_put_contents('$private_root/provision-cgi-diagnostic.json', json_encode([
              'sapi' => PHP_SAPI,
              'auto_prepend_configured' => trim((string)ini_get('auto_prepend_file')) !== '',
              'stdout_constant' => defined('STDOUT'),
              'stderr_constant' => defined('STDERR'),
          ], JSON_UNESCAPED_SLASHES));
          require '$private_root/runtime-env.php';
          require '$private_root/.provision-secret.php';
          require '$private_root/provision-staging-company.php';
          PHP
          set +e
          php -q -d register_argc_argv=1 -f "$private_root/run-provision.php" -- \
            --company-name='Lehrfahrer Testgesellschaft' \
            --company-slug='lehrfahrer-test' \
            --license-status='trial' \
            --license-id='staging-test' \
            --admin-display-name='Staging Administration' \
            --admin-login='staging-admin' \
            > "$private_root/provision-stdout.raw" \
            2> "$private_root/provision-stderr.raw"
          provision_status="$?"
          set -e
          chmod 600 \
            "$private_root/provision-cgi-diagnostic.json" \
            "$private_root/provision-stdout.raw" \
            "$private_root/provision-stderr.raw"

          stdout_bytes="$(wc -c < "$private_root/provision-stdout.raw" | tr -d ' ')"
          stderr_bytes="$(wc -c < "$private_root/provision-stderr.raw" | tr -d ' ')"
          cgi_headers=no
          if grep -Eiq '^(Content-Type|X-Powered-By|Status):' "$private_root/provision-stdout.raw"; then
            cgi_headers=yes
          fi
          bom=no
          if [ "$(head -c 3 "$private_root/provision-stdout.raw" | od -An -tx1 | tr -d '[:space:]')" = efbbbf ]; then
            bom=yes
          fi
          warnings=no
          if grep -Eiq '(^|[[:space:]])(warning|notice|deprecated|fatal error|parse error)(:|[[:space:]])' \
              "$private_root/provision-stdout.raw" "$private_root/provision-stderr.raw"; then
            warnings=yes
          fi
          html=no
          if grep -Eiq '<(!doctype|html|body|br)([[:space:]>])' \
              "$private_root/provision-stdout.raw" "$private_root/provision-stderr.raw"; then
            html=yes
          fi
          printf 'Provisioning CGI: exit=%s stdout_bytes=%s stderr_bytes=%s headers=%s bom=%s warnings=%s html=%s\n' \
            "$provision_status" "$stdout_bytes" "$stderr_bytes" "$cgi_headers" "$bom" "$warnings" "$html"
          cat "$private_root/provision-cgi-diagnostic.json"
          printf '\n'
          if [ "$provision_status" -ne 0 ]; then
            echo 'Provisionierung ist fehlgeschlagen; Roh-Ausgaben bleiben privat und werden nicht geloggt.' >&2
            exit "$provision_status"
          fi

          cat > "$private_root/write-tenant-binding.php" <<'PHP'
          <?php
          function fail_validation(string $message): never {
              file_put_contents('php://stderr', $message . "\n");
              exit(1);
          }
          $resultFile = (string)getenv('PROVISION_RESULT_FILE');
          $bindingFile = (string)getenv('TENANT_BINDING_FILE');
          $stdout = (string)file_get_contents((string)getenv('PROVISION_STDOUT_FILE'));
          $stderr = (string)file_get_contents((string)getenv('PROVISION_STDERR_FILE'));
          if (trim($stderr) !== '') fail_validation('Provisionierung schrieb unerwartet auf stderr.');
          if (str_starts_with($stdout, "\xEF\xBB\xBF")) $stdout = substr($stdout, 3);
          $stdout = str_replace(["\r\n", "\r"], "\n", $stdout);
          if (preg_match('/\A(?:(?:Content-Type|X-Powered-By|Status):[^\n]*\n)*\n*\z/iD', $stdout) !== 1) {
              fail_validation('Provisionierung schrieb unerwartete Nicht-JSON-Ausgabe auf stdout.');
          }
          try {
              $rawJson = (string)file_get_contents($resultFile);
              $data = json_decode($rawJson, true, 512, JSON_THROW_ON_ERROR);
          } catch (Throwable $error) {
              fail_validation('Provisionierungsergebnis ist kein valides JSON.');
          }
          if (!is_array($data)
              || preg_match('/^cmp_[0-9a-f]{32}$/D', (string)($data['company_id'] ?? '')) !== 1
              || ($data['slug'] ?? '') !== 'lehrfahrer-test') {
              fail_validation('Provisionierungsergebnis enthaelt nicht die erwartete Gesellschaft.');
          }
          if (preg_match('/password|token|secret|credential/i', $rawJson) === 1) {
              fail_validation('Provisionierungsergebnis enthaelt einen verbotenen Secret-Hinweis.');
          }
          $content = "<?php\nputenv(" . var_export(
              'LEHRFAHRER_LEGACY_COMPANY_ID=' . $data['company_id'], true
          ) . ");\n";
          if (file_put_contents($bindingFile, $content, LOCK_EX) === false) {
              fail_validation('Tenant-Binding konnte nicht geschrieben werden.');
          }
          PHP
          PROVISION_RESULT_FILE="$private_root/provision-result.json" \
          TENANT_BINDING_FILE="$private_root/tenant-binding.php" \
          PROVISION_STDOUT_FILE="$private_root/provision-stdout.raw" \
          PROVISION_STDERR_FILE="$private_root/provision-stderr.raw" \
            php -q -f "$private_root/write-tenant-binding.php"
          chmod 600 "$private_root/provision-result.json" "$private_root/tenant-binding.php"
          rm -f -- \
            "$private_root/.provision-secret.php" \
            "$private_root/run-provision.php" \
            "$private_root/write-tenant-binding.php" \
            "$private_root/provision-cgi-diagnostic.json" \
            "$private_root/provision-stdout.raw" \
            "$private_root/provision-stderr.raw"

          set +e
          LEHRFAHRER_APP_ROOT="$webroot" \
          LEHRFAHRER_STAGING_CGI_SMOKE=1 \
          LEHRFAHRER_STAGING_SMOKE_RESULT_FILE="$private_root/smoke-result.json" \
            php -q -d "auto_prepend_file=$private_root/runtime-env.php" \
              -f "$private_root/staging-smoke.php" \
              > "$private_root/smoke-stdout.raw" 2> "$private_root/smoke-stderr.raw"
          smoke_status="$?"
          set -e
          chmod 600 "$private_root/smoke-stdout.raw" "$private_root/smoke-stderr.raw"
          if [ "$smoke_status" -ne 0 ]; then
            echo 'Staging-Smoke ist fehlgeschlagen; Roh-Ausgaben bleiben privat und werden nicht geloggt.' >&2
            exit "$smoke_status"
          fi
          if [ -s "$private_root/smoke-stderr.raw" ]; then
            echo 'Staging-Smoke schrieb unerwartet auf stderr.' >&2
            exit 1
          fi
          if tr -d '\r' < "$private_root/smoke-stdout.raw" \
              | grep -Eiv '^(Content-Type|X-Powered-By|Status):|^$' | grep -q .; then
            echo 'Staging-Smoke schrieb unerwartete CGI-Ausgabe.' >&2
            exit 1
          fi
          cat > "$private_root/validate-smoke-result.php" <<'PHP'
          <?php
          try {
              $data = json_decode(
                  (string)file_get_contents((string)getenv('SMOKE_RESULT_FILE')),
                  true,
                  512,
                  JSON_THROW_ON_ERROR
              );
          } catch (Throwable $error) {
              file_put_contents('php://stderr', "Staging-Smoke-Ergebnis ist kein valides JSON.\n");
              exit(1);
          }
          if (!is_array($data) || ($data['ok'] ?? false) !== true
              || ($data['slug'] ?? '') !== 'lehrfahrer-test'
              || preg_match('/^cmp_[0-9a-f]{32}$/D', (string)($data['company_id'] ?? '')) !== 1) {
              file_put_contents('php://stderr', "Staging-Smoke-Ergebnis ist unvollstaendig.\n");
              exit(1);
          }
          PHP
          SMOKE_RESULT_FILE="$private_root/smoke-result.json" \
            php -q -f "$private_root/validate-smoke-result.php"
          chmod 600 "$private_root/smoke-result.json"
          cat "$private_root/smoke-result.json"
          rm -f -- \
            "$private_root/validate-smoke-result.php" \
            "$private_root/smoke-stdout.raw" \
            "$private_root/smoke-stderr.raw"
          REMOTE_SCRIPT

          origin='https://staging.lehrfahrer.de'
          http_status() {
            curl --silent --show-error --max-time 20 --output /dev/null \
              --write-out '%{http_code}' "$@" || true
          }
          unauth_status="$(http_status "$origin/")"
          wrong_status="$(http_status -u 'invalid-staging-user:invalid-staging-password' "$origin/")"
          valid_status="$(http_status -u "$BASIC_USER:$BASIC_PASSWORD" "$origin/")"

          if [ "$unauth_status" = 500 ] || [ "$wrong_status" = 500 ] || [ "$valid_status" = 500 ]; then
            echo 'Apache kann den gruppengeschuetzten Auth-Pfad nicht lesen; aktiviere eng begrenzte STRATO-Alternative.'
            "${SSH_RUN[@]}" "$REMOTE" \
              "chmod 711 './$STAGING_AUTH_PATH' && chmod 644 './$STAGING_AUTH_PATH/.htpasswd'"
            unauth_status="$(http_status "$origin/")"
            wrong_status="$(http_status -u 'invalid-staging-user:invalid-staging-password' "$origin/")"
            valid_status="$(http_status -u "$BASIC_USER:$BASIC_PASSWORD" "$origin/")"
            auth_permission_mode='711/644 (separater, nicht listbarer Auth-Pfad)'
          else
            auth_permission_mode='750/640 (Webroot-Gruppe)'
          fi

          if [ "$unauth_status" != 401 ] || [ "$wrong_status" != 401 ]; then
            echo "Basic-Auth verweigert anonyme oder falsche Anmeldungen nicht korrekt." >&2
            exit 1
          fi
          case "$valid_status" in
            2??|3??) ;;
            *) echo "Gueltige Basic-Auth liefert HTTP $valid_status statt Erfolg." >&2; exit 1 ;;
          esac
          printf 'Basic-Auth erfolgreich: ohne=401 falsch=401 korrekt=%s rechte=%s\n' \
            "$valid_status" "$auth_permission_mode"

      - name: Staging HTTP, runtime, login and session smoke test
        shell: bash
        env:
          BASIC_USER: ${{ secrets.STAGING_BASIC_AUTH_USER }}
          BASIC_PASSWORD: ${{ secrets.STAGING_BASIC_AUTH_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          origin='https://staging.lehrfahrer.de'
          ready=0
          for _ in $(seq 1 12); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$origin/" || true)"
            if [ "$status" = 401 ]; then ready=1; break; fi
            sleep 5
          done
          test "$ready" = 1
          wrong_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -u 'invalid-staging-user:invalid-staging-password' "$origin/" || true)"
          test "$wrong_status" = 401

          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -D /tmp/staging-runtime.headers \
            "$origin/api/auth/runtime.php" > /tmp/staging-runtime.json
          jq -e --arg commit "${{ github.sha }}" '
            .ok == true
            and .runtime.environment == "staging"
            and .runtime.environmentLabel == "STAGING"
            and .runtime.commit == $commit
            and .runtime.databaseSchemaVersion == 4
          ' /tmp/staging-runtime.json >/dev/null
          grep -Eiq '^x-robots-tag:.*noindex' /tmp/staging-runtime.headers

          jq -n --arg password "$ADMIN_PASSWORD" '{
            company: "lehrfahrer-test",
            login: "staging-admin",
            password: $password,
            deviceLabel: "GitHub Staging Smoke"
          }' > /tmp/staging-login-request.json
          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -H "Origin: $origin" -H 'Content-Type: application/json' \
            -D /tmp/staging-login.headers -c /tmp/staging.cookies \
            --data-binary @/tmp/staging-login-request.json \
            "$origin/api/auth/login.php" > /tmp/staging-login.json
          jq -e '.ok == true and .company.slug == "lehrfahrer-test" and (.user.roles | index("ADMIN"))' \
            /tmp/staging-login.json >/dev/null
          grep -Eiq '^set-cookie: __Host-lehrfahrer_session=.*;.*[Ss]ecure' /tmp/staging-login.headers
          grep -Eiq '^set-cookie: __Host-lehrfahrer_session=.*;.*[Hh]ttp[Oo]nly' /tmp/staging-login.headers
          grep -Eiq '^set-cookie: __Host-lehrfahrer_session=.*;.*[Ss]ame[Ss]ite=[Ss]trict' /tmp/staging-login.headers
          if grep -Eiq '^set-cookie: __Host-lehrfahrer_session=.*;.*[Dd]omain=' /tmp/staging-login.headers; then
            echo 'Staging-Sessioncookie darf kein Domain-Attribut besitzen.' >&2
            exit 1
          fi

          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -b /tmp/staging.cookies "$origin/api/auth/me.php" \
            | jq -e '.ok == true and .runtime.environment == "staging"' >/dev/null
          csrf="$(jq -r '.csrfToken' /tmp/staging-login.json)"
          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -b /tmp/staging.cookies -H "Origin: $origin" -H "X-CSRF-Token: $csrf" \
            -X POST "$origin/api/auth/logout.php" | jq -e '.ok == true' >/dev/null

      - name: Verify live public content is unchanged
        shell: bash
        run: |
          set -euo pipefail
          for host in lehrfahrer.de www.lehrfahrer.de; do
            curl --fail --silent --show-error --location "https://${host}/VERSION" \
              | sha256sum >> /tmp/lehrfahrer-live-after.sha256
          done
          cmp /tmp/lehrfahrer-live-before.sha256 /tmp/lehrfahrer-live-after.sha256
