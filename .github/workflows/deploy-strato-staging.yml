name: Deploy staging to Strato

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: ["staging"]
  workflow_dispatch:
    inputs:
      create_control_db_restore_point:
        description: Create the private Control-DB restore point after all staging preflights
        required: true
        default: false
        type: boolean
      verify_control_db_recovery:
        description: Verify isolated restore and controlled recovery on real staging MariaDB
        required: true
        default: false
        type: boolean
      migrate_accounts:
        description: Run the approved one-time staging account 1:1 migration after a private restore point
        required: true
        default: false
        type: boolean
      apply_cottbus:
        description: Run the one-time approved Cottbus staging migration after all preflights
        required: true
        default: false
        type: boolean
      preflight_cottbus:
        description: Run the complete Cottbus staging preflight without applying the migration
        required: true
        default: false
        type: boolean
      check_official_cottbus:
        description: Check official DELFI GTFS and persist the exact checked candidate on staging (no adoption)
        required: true
        default: false
        type: boolean
      stamp_cottbus_source_sha:
        description: Verify unchanged Cottbus index against staging ZIP, then stamp source SHA
        required: true
        default: false
        type: boolean
      verify_gtfs_routes_v1:
        description: Check persisted Cottbus route comparison and warm derived report cache (no adoption)
        required: true
        default: false
        type: boolean
      repair_cottbus_city:
        description: Register the missing Cottbus city only after verifying both existing route hashes
        required: true
        default: false
        type: boolean

concurrency:
  group: deploy-strato-staging-v2
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.lehrfahrer.de

    steps:
      - name: Checkout staging commit
        uses: actions/checkout@v5

      - name: Preflight and regression checks
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "staging"
          if [ "${{ inputs.migrate_accounts }}" = true ]; then
            test "${{ inputs.apply_cottbus }}" != true
            test "${{ inputs.preflight_cottbus }}" != true
            test "${{ inputs.check_official_cottbus }}" != true
            test "${{ inputs.stamp_cottbus_source_sha }}" != true
          fi
          git diff --check

          while IFS= read -r -d '' file; do
            case "$file" in
              build/*|editor/*|backup_liniendaten/*) continue ;;
            esac
            node --check "$file"
          done < <(git ls-files -z -- '*.js')

          while IFS= read -r -d '' file; do
            case "$file" in
              api/pdf/test_preview.php|api/pdf/test_preview_v2.php|api/pdf/preview_v2.php) continue ;;
            esac
            php -l "$file" >/dev/null
          done < <(git ls-files -z -- '*.php')

          php tools/gtfs-service-compare.test.php
          php tools/gtfs-candidate.test.php
          php tools/gtfs-route-selection.test.php
          php tools/gtfs-route-preview.test.php
          php tools/gtfs-route-creation.test.php
          python3 tools/gtfs-official-candidate-filter.test.py
          python3 tools/staging-http-assets.test.py

          node --test \
            tools/company-activation.test.js \
            tools/company-activation-reissue.test.js \
            tools/company-provisioning.test.js \
            tools/control-database.test.js \
            tools/control-phase2-schema.test.js \
            tools/control-user-numbers.test.js \
            tools/control-account-preflight.test.js \
            tools/account-cutover-preflight.test.js \
            tools/auth-cutover-race.test.js \
            tools/control-db-recovery-drill.test.js \
            tools/control-account-migrate.test.js \
            tools/account-auth.test.js \
            tools/account-login-ui.test.js \
            tools/editor-identity.test.js \
            tools/tenant-cache-boundary.test.js \
            tools/session-auth.test.js \
            tools/capability-authorization.test.js \
            tools/legacy-auth-observation.test.js \
            tools/security-dom-xss.test.js \
            tools/security-sensitive-storage.test.js \
            tools/tenant-storage.test.js \
            tools/tenant-lines-cities.test.js \
            tools/app-online-status.test.js \
            tools/route-load-progress.test.js \
            tools/route-build-progress.test.js \
            tools/tenant-personnel.test.js \
            tools/tenant-catalog-imports.test.js \
            tools/gtfs-timetable-change.test.js \
            tools/cottbus-migrate-staging.test.js \
            tools/apply-orchestration.test.js

      - name: Validate isolated staging configuration
        shell: bash
        env:
          STAGING_TARGET_PATH: ${{ vars.STAGING_TARGET_PATH }}
          STAGING_PRIVATE_PATH: ${{ vars.STAGING_PRIVATE_PATH }}
          STAGING_AUTH_PATH: ${{ vars.STAGING_AUTH_PATH }}
          LIVE_TARGET_PATH: ${{ secrets.STRATO_TARGET_PATH }}
          STAGING_DB_DSN: ${{ secrets.STAGING_DB_DSN }}
          STAGING_DB_USER: ${{ secrets.STAGING_DB_USER }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_DB_TLS_CA_PEM: ${{ secrets.STAGING_DB_TLS_CA_PEM }}
          STAGING_API_TOKEN: ${{ secrets.STAGING_API_TOKEN }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          STAGING_BASIC_AUTH_USER: ${{ secrets.STAGING_BASIC_AUTH_USER }}
          STAGING_BASIC_AUTH_PASSWORD: ${{ secrets.STAGING_BASIC_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          required=(
            STAGING_TARGET_PATH STAGING_PRIVATE_PATH STAGING_AUTH_PATH LIVE_TARGET_PATH
            STAGING_DB_DSN STAGING_DB_USER STAGING_DB_PASSWORD STAGING_DB_TLS_CA_PEM
            STAGING_API_TOKEN STAGING_ADMIN_PASSWORD
            STAGING_BASIC_AUTH_USER STAGING_BASIC_AUTH_PASSWORD
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Fehlende Staging-Konfiguration: $name" >&2
              exit 1
            fi
          done
          for path in "$STAGING_TARGET_PATH" "$STAGING_PRIVATE_PATH" "$STAGING_AUTH_PATH"; do
            case "$path" in
              /*|.|..|*../*|*/..|*//*|*[!A-Za-z0-9._/-]*)
                echo "Unsicherer Staging-Pfad." >&2
                exit 1
                ;;
            esac
          done
          normalize() { printf '%s' "${1#/}" | sed 's:/*$::'; }
          if [ "$(normalize "$STAGING_TARGET_PATH")" = "$(normalize "$LIVE_TARGET_PATH")" ]; then
            echo "Staging- und Live-DocumentRoot duerfen nicht identisch sein." >&2
            exit 1
          fi
          if [ "$(normalize "$STAGING_TARGET_PATH")" = "$(normalize "$STAGING_AUTH_PATH")" ] \
              || [ "$(normalize "$STAGING_PRIVATE_PATH")" = "$(normalize "$STAGING_AUTH_PATH")" ]; then
            echo "Staging-Auth-Pfad muss von DocumentRoot und Private Storage getrennt sein." >&2
            exit 1
          fi
          case "$(normalize "$STAGING_PRIVATE_PATH")" in
            lehrfahrer-private|*/lehrfahrer-private)
              echo "Staging darf nicht den Live-Private-Storage verwenden." >&2
              exit 1
              ;;
          esac

      - name: Fingerprint live before staging deployment
        shell: bash
        run: |
          set -euo pipefail
          for host in lehrfahrer.de www.lehrfahrer.de; do
            curl --fail --silent --show-error --location "https://${host}/VERSION" \
              | sha256sum >> /tmp/lehrfahrer-live-before.sha256
          done

      - name: Prepare SSH client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [ -n "${{ secrets.STRATO_SSH_KEY }}" ]; then
            printf '%s\n' "${{ secrets.STRATO_SSH_KEY }}" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
          else
            sudo apt-get update
            sudo apt-get install -y sshpass
          fi
          if [ -n "${{ secrets.STRATO_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.STRATO_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${{ secrets.STRATO_PORT }}" "${{ secrets.STRATO_HOST }}" >> ~/.ssh/known_hosts
          fi

      - name: Check and persist official Cottbus candidate without adoption
        if: github.event_name == 'workflow_dispatch' && inputs.check_official_cottbus
        shell: bash
        env:
          SSHPASS: ${{ secrets.STRATO_PASSWORD }}
          STRATO_USER: ${{ secrets.STRATO_USER }}
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          STRATO_PORT: ${{ secrets.STRATO_PORT }}
          STRATO_SSH_KEY: ${{ secrets.STRATO_SSH_KEY }}
          STAGING_PRIVATE_PATH: ${{ vars.STAGING_PRIVATE_PATH }}
          STAGING_TARGET_PATH: ${{ vars.STAGING_TARGET_PATH }}
        run: |
          set -euo pipefail
          case "$STAGING_PRIVATE_PATH" in
            ''|/*|.|..|*../*|*/..|*//*|*[!A-Za-z0-9._/-]*) exit 1 ;;
          esac
          temp_dir="$(mktemp -d)"
          upload_dir=''
          cleanup_candidate_temp() {
            rm -rf -- "$temp_dir"
            if [ -n "$upload_dir" ] && [ -n "${REMOTE:-}" ]; then
              "${SSH_RUN[@]}" "$REMOTE" "bash -s -- '$STAGING_PRIVATE_PATH' '$(basename "$upload_dir")'" <<'REMOTE_CLEAN' || true
          set -euo pipefail
          private_root="$(pwd)/${1#./}"
          name="$2"
          case "$name" in candidate-upload.[A-Za-z0-9]*) ;; *) exit 1 ;; esac
          upload="$private_root/$name"
          test ! -L "$upload"
          rm -f -- "$upload/official.zip" "$upload/variants.sqlite" "$upload/gtfs-stage-candidate-staging.php" "$upload/result.json" "$upload/result.stdout" "$upload/result.stderr"
          rmdir -- "$upload" 2>/dev/null || true
          REMOTE_CLEAN
            fi
          }
          trap cleanup_candidate_temp EXIT
          if [ -n "$STRATO_SSH_KEY" ]; then
            SCP_RUN=(scp -i ~/.ssh/id_rsa -P "$STRATO_PORT" -o StrictHostKeyChecking=yes)
            SSH_RUN=(ssh -i ~/.ssh/id_rsa -p "$STRATO_PORT" -o StrictHostKeyChecking=yes)
          else
            SCP_RUN=(sshpass -e scp -P "$STRATO_PORT" -o StrictHostKeyChecking=yes)
            SSH_RUN=(sshpass -e ssh -p "$STRATO_PORT" -o StrictHostKeyChecking=yes)
          fi
          REMOTE="$STRATO_USER@$STRATO_HOST"
          remote_path="./${STAGING_PRIVATE_PATH#/}/companies/cmp_2ff1b82166c99988ed6f7eb51cca7b56/imports/gtfs/index/variants.sqlite"
          "${SCP_RUN[@]}" "$REMOTE:$remote_path" "$temp_dir/current.sqlite"
          current_zip="./${STAGING_PRIVATE_PATH#/}/companies/cmp_2ff1b82166c99988ed6f7eb51cca7b56/imports/gtfs/latest.zip"
          "${SCP_RUN[@]}" "$REMOTE:$current_zip" "$temp_dir/current.zip"
          curl --fail --location --silent --show-error --max-time 360 \
            --dump-header "$temp_dir/headers" \
            --output "$temp_dir/official.zip" https://download.gtfs.de/germany/nv_free/latest.zip
          size="$(stat -c %s "$temp_dir/official.zip")"
          if [ "$size" -lt 50000000 ] || [ "$size" -gt 500000000 ]; then
            echo 'Official GTFS size outside plausible range' >&2
            exit 1
          fi
          php -d max_execution_time=900 tools/gtfs-service-compare-cli.php "$temp_dir/official.zip" "$temp_dir/current.zip"
          published_at="$(python3 - "$temp_dir/headers" <<'PY'
          import email.utils, pathlib, sys
          lines = pathlib.Path(sys.argv[1]).read_text().splitlines()
          values = [line.split(':', 1)[1].strip() for line in lines if line.lower().startswith('last-modified:')]
          if not values:
              raise SystemExit('Official Last-Modified is missing')
          date = email.utils.parsedate_to_datetime(values[-1])
          if date.tzinfo is None:
              raise SystemExit('Official Last-Modified has no timezone')
          print(date.strftime('%Y-%m-%dT%H:%M:%SZ'))
          PY
          )"
          python3 tools/gtfs-official-candidate-filter.py "$temp_dir/official.zip" "$temp_dir/filtered"
          php -d memory_limit=1G tools/gtfs-build-candidate-index.php "$temp_dir/filtered" "$temp_dir/official.zip" "$temp_dir/variants.sqlite"
          upload_dir="$("${SSH_RUN[@]}" "$REMOTE" "bash -s -- '$STAGING_PRIVATE_PATH'" <<'REMOTE_CREATE'
          set -euo pipefail
          private_root="$(pwd)/${1#./}"
          test -d "$private_root" && test ! -L "$private_root"
          mktemp -d "$private_root/candidate-upload.XXXXXXXX"
          REMOTE_CREATE
          )"
          case "$upload_dir" in
            */candidate-upload.*) ;;
            *) echo 'Unsafe candidate upload directory' >&2; exit 1 ;;
          esac
          scp_upload_dir="./${STAGING_PRIVATE_PATH#/}/$(basename "$upload_dir")"
          "${SCP_RUN[@]}" "$temp_dir/official.zip" "$temp_dir/variants.sqlite" tools/gtfs-stage-candidate-staging.php \
            "$REMOTE:$scp_upload_dir/"
          "${SSH_RUN[@]}" "$REMOTE" \
            "bash -s -- '$STAGING_PRIVATE_PATH' '$STAGING_TARGET_PATH' '$upload_dir' '$published_at'" <<'REMOTE_STAGE'
          set -euo pipefail
          private_root="$(pwd)/${1#./}"
          webroot="$(pwd)/${2#./}"
          upload="$3"
          published="$4"
          case "$upload" in "$private_root"/candidate-upload.*) ;; *) exit 1 ;; esac
          test -d "$upload" && test ! -L "$upload"
          trap 'rm -f -- "$upload/official.zip" "$upload/variants.sqlite" "$upload/gtfs-stage-candidate-staging.php" "$upload/result.json" "$upload/result.stdout" "$upload/result.stderr"; rmdir -- "$upload"' EXIT
          set +e
          LEHRFAHRER_PRIVATE_DATA_DIR="$private_root" GTFS_STAGING_WEBROOT="$webroot" \
          GTFS_CANDIDATE_UPLOAD_ZIP="$upload/official.zip" GTFS_CANDIDATE_UPLOAD_INDEX="$upload/variants.sqlite" \
          GTFS_CANDIDATE_PUBLISHED_AT="$published" GTFS_CANDIDATE_RESULT_FILE="$upload/result.json" \
            php -q -d max_execution_time=900 -d memory_limit=512M -d "auto_prepend_file=$private_root/runtime-env.php" \
              -f "$upload/gtfs-stage-candidate-staging.php" \
              > "$upload/result.stdout" 2> "$upload/result.stderr"
          status="$?"
          set -e
          if [ "$status" -ne 0 ] || [ ! -s "$upload/result.json" ]; then
            echo 'Staging-Kandidatenvalidierung fehlgeschlagen.' >&2
            tail -n 3 "$upload/result.stderr" >&2
            exit 1
          fi
          cat "$upload/result.json"
          REMOTE_STAGE

      - name: Build private staging runtime files
        shell: bash
        env:
          STAGING_DB_DSN: ${{ secrets.STAGING_DB_DSN }}
          STAGING_DB_USER: ${{ secrets.STAGING_DB_USER }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_DB_TLS_CA_PEM: ${{ secrets.STAGING_DB_TLS_CA_PEM }}
          STAGING_API_TOKEN: ${{ secrets.STAGING_API_TOKEN }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          STAGING_BASIC_AUTH_USER: ${{ secrets.STAGING_BASIC_AUTH_USER }}
          STAGING_BASIC_AUTH_PASSWORD: ${{ secrets.STAGING_BASIC_AUTH_PASSWORD }}
          STAGING_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          STAGING_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          export RUNTIME_OUTPUT=/tmp/lehrfahrer-staging-runtime-env.php
          export PROVISION_SECRET_OUTPUT=/tmp/lehrfahrer-staging-provision-secret.php
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export DEPLOYED_AT
          php <<'PHP'
          <?php
          $values = [
              'LEHRFAHRER_ENV' => 'staging',
              'LEHRFAHRER_PUBLIC_ORIGIN' => 'https://staging.lehrfahrer.de',
              'LEHRFAHRER_DB_DRIVER' => 'mysql',
              'LEHRFAHRER_DB_DSN' => getenv('STAGING_DB_DSN'),
              'LEHRFAHRER_DB_USER' => getenv('STAGING_DB_USER'),
              'LEHRFAHRER_DB_PASSWORD' => getenv('STAGING_DB_PASSWORD'),
              'LEHRFAHRER_DB_TLS_REQUIRED' => '1',
              'LEHRFAHRER_API_TOKEN' => getenv('STAGING_API_TOKEN'),
              'LEHRFAHRER_BUILD_COMMIT' => getenv('STAGING_BUILD_COMMIT'),
              'LEHRFAHRER_BUILD_ID' => getenv('STAGING_BUILD_ID'),
              'LEHRFAHRER_DEPLOYED_AT' => getenv('DEPLOYED_AT'),
              'LEHRFAHRER_STAGING_COMPANY_SLUG' => 'lehrfahrer-test',
          ];
          $php = "<?php\nputenv('LEHRFAHRER_PRIVATE_DATA_DIR=' . __DIR__);\n"
              . "putenv('LEHRFAHRER_DB_TLS_CA=' . __DIR__ . '/mariadb-ca.pem');\n";
          foreach ($values as $name => $value) {
              $php .= 'putenv(' . var_export($name . '=' . $value, true) . ");\n";
          }
          $php .= "if (is_file(__DIR__ . '/tenant-binding.php')) require __DIR__ . '/tenant-binding.php';\n";
          file_put_contents(getenv('RUNTIME_OUTPUT'), $php);
          file_put_contents(
              getenv('PROVISION_SECRET_OUTPUT'),
              "<?php\nputenv(" . var_export(
                  'LEHRFAHRER_STAGING_ADMIN_PASSWORD=' . getenv('STAGING_ADMIN_PASSWORD'),
                  true
              ) . ");\n"
          );
          PHP
          printf '%s\n' "$STAGING_DB_TLS_CA_PEM" > /tmp/lehrfahrer-staging-mariadb-ca.pem
          if ! command -v htpasswd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y apache2-utils
          fi
          printf '%s' "$STAGING_BASIC_AUTH_PASSWORD" \
            | htpasswd -n -i -B -C 12 "$STAGING_BASIC_AUTH_USER" \
            > /tmp/lehrfahrer-staging.htpasswd
          chmod 600 \
            /tmp/lehrfahrer-staging-runtime-env.php \
            /tmp/lehrfahrer-staging-provision-secret.php \
            /tmp/lehrfahrer-staging-mariadb-ca.pem \
            /tmp/lehrfahrer-staging.htpasswd

      - name: Deploy only to isolated staging paths
        shell: bash
        env:
          SSHPASS: ${{ secrets.STRATO_PASSWORD }}
          STRATO_USER: ${{ secrets.STRATO_USER }}
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          STRATO_PORT: ${{ secrets.STRATO_PORT }}
          STRATO_SSH_KEY: ${{ secrets.STRATO_SSH_KEY }}
          STAGING_TARGET_PATH: ${{ vars.STAGING_TARGET_PATH }}
          STAGING_PRIVATE_PATH: ${{ vars.STAGING_PRIVATE_PATH }}
          STAGING_AUTH_PATH: ${{ vars.STAGING_AUTH_PATH }}
          LIVE_TARGET_PATH: ${{ secrets.STRATO_TARGET_PATH }}
          BASIC_USER: ${{ secrets.STAGING_BASIC_AUTH_USER }}
          BASIC_PASSWORD: ${{ secrets.STAGING_BASIC_AUTH_PASSWORD }}
          PREPARE_GTFS_WORK: ${{ github.event_name == 'workflow_dispatch' && inputs.preflight_cottbus }}
          STAMP_COTTBUS_SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.stamp_cottbus_source_sha }}
          MIGRATE_ACCOUNTS: ${{ github.event_name == 'workflow_dispatch' && inputs.migrate_accounts }}
        run: |
          set -euo pipefail
          REMOTE="$STRATO_USER@$STRATO_HOST"
          SSH_BASE=(ssh -p "$STRATO_PORT" -o UpdateHostKeys=no -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20)
          SCP_BASE=(scp -P "$STRATO_PORT" -o UpdateHostKeys=no -o StrictHostKeyChecking=yes)
          if [ -n "$STRATO_SSH_KEY" ]; then
            SSH_BASE+=(-i ~/.ssh/id_rsa)
            SCP_BASE+=(-i ~/.ssh/id_rsa)
            RSYNC_SSH="ssh -p $STRATO_PORT -i ~/.ssh/id_rsa -o UpdateHostKeys=no -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20"
            SSH_RUN=("${SSH_BASE[@]}")
            SCP_RUN=("${SCP_BASE[@]}")
            RSYNC_RUN=(rsync)
          else
            SSH_RUN=(sshpass -e "${SSH_BASE[@]}")
            SCP_RUN=(sshpass -e "${SCP_BASE[@]}")
            RSYNC_SSH="ssh -p $STRATO_PORT -o UpdateHostKeys=no -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20"
            RSYNC_RUN=(sshpass -e rsync)
          fi

          "${SSH_RUN[@]}" "$REMOTE" \
            "mkdir -p -- './$STAGING_TARGET_PATH' './$STAGING_PRIVATE_PATH' './$STAGING_AUTH_PATH' && chmod 700 './$STAGING_PRIVATE_PATH'"

          "${RSYNC_RUN[@]}" -az --omit-dir-times --no-perms --no-owner --no-group \
            --exclude '.git/' --exclude '.github/' --exclude '.vscode/' \
            --exclude 'WorkingSystem/' --exclude 'Offlinekarten/' --exclude 'backup/' \
            --exclude 'backup_liniendaten/' --exclude 'autosave/' --exclude 'build/' \
            --exclude 'editor/' --exclude 'docs/' --exclude 'deploy/' --exclude 'tools/' \
            --exclude '_linien/' --exclude 'linien/test/' --exclude 'app5/' --exclude 'app6/' \
            --exclude 'node_modules/' --exclude '*.bak' --exclude '*.tmp' --exclude '*.log' \
            -e "$RSYNC_SSH" ./ "$REMOTE:./$STAGING_TARGET_PATH/"

          "${SCP_RUN[@]}" \
            /tmp/lehrfahrer-staging-runtime-env.php \
            /tmp/lehrfahrer-staging-provision-secret.php \
            /tmp/lehrfahrer-staging-mariadb-ca.pem \
            tools/provision-staging-company.php \
            tools/provision-cottbus-staging.php \
            tools/reissue-first-admin-activation.php \
            tools/staging-reissue-state.php \
            tools/cottbus-migrate-staging.php \
            tools/cottbus-current-postcheck-staging.php \
            tools/stamp-cottbus-source-sha-staging.php \
            tools/prepare-cottbus-gtfs-work-staging.php \
            tools/_control-db-restore-point.php \
            tools/control-db-recovery-drill.php \
            tools/control-db-live-recovery.php \
            tools/control-account-preflight.php \
            tools/control-account-cutover-preflight.php \
            tools/control-account-migrate.php \
            tools/staging-smoke.php \
            "$REMOTE:./$STAGING_PRIVATE_PATH/"

          "${SCP_RUN[@]}" /tmp/lehrfahrer-staging.htpasswd \
            "$REMOTE:./$STAGING_AUTH_PATH/"

          "${SSH_RUN[@]}" "$REMOTE" \
            "bash -s -- '$STAGING_TARGET_PATH' '$STAGING_PRIVATE_PATH' '$STAGING_AUTH_PATH' '$LIVE_TARGET_PATH' '$PREPARE_GTFS_WORK' '$STAMP_COTTBUS_SOURCE_SHA' '$MIGRATE_ACCOUNTS'" <<'REMOTE_SCRIPT'
          set -euo pipefail
          staging_target="$1"
          staging_private="$2"
          staging_auth="$3"
          live_target="${4#/}"
          prepare_gtfs_work="$5"
          stamp_cottbus_source_sha="$6"
          migrate_accounts="$7"
          webroot="$(cd "./$staging_target" && pwd -P)"
          private_root="$(cd "./$staging_private" && pwd -P)"
          auth_root="$(cd "./$staging_auth" && pwd -P)"
          if [ -z "$live_target" ] || [ "$live_target" = "." ]; then
            live_webroot="$(pwd -P)"
          else
            live_webroot="$(cd "./$live_target" && pwd -P)"
          fi
          live_private="$(dirname "$live_webroot")/lehrfahrer-private"
          test -d "$live_private"
          case "$private_root/" in "$webroot/"*) exit 20 ;; esac
          case "$webroot/" in "$private_root/"*) exit 21 ;; esac
          case "$auth_root/" in "$webroot/"*|"$private_root/"*) exit 22 ;; esac
          case "$webroot/" in "$auth_root/"*) exit 23 ;; esac
          case "$private_root/" in "$auth_root/"*) exit 24 ;; esac
          if [ "$webroot" = "$live_webroot" ]; then exit 25; fi
