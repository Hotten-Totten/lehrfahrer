          grep -q 'autocomplete="username"' /tmp/staging-account-login.html
          grep -q 'autocomplete="current-password"' /tmp/staging-account-login.html
          if grep -q 'id="company"' /tmp/staging-account-login.html; then
            echo 'Das neue Login enthält ein Gesellschaftsfeld.' >&2
            exit 1
          fi
          account_script="$(grep -oE 'js/account-login\.js\?v=[a-f0-9]{12}' /tmp/staging-account-login.html | head -n 1)"
          test -n "$account_script"
          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            "$origin/$account_script" > /tmp/staging-account-login.js
          test "${account_script#*v=}" = "$(sha256sum /tmp/staging-account-login.js | cut -c 1-12)"
          tenant_script="$(grep -oE 'js/tenant-cache-boundary\.js\?v=[a-f0-9]{12}' /tmp/staging-account-login.html | head -n 1)"
          test -n "$tenant_script"
