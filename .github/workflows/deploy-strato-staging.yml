name: Deploy staging to Strato

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  STOP_TIMES_PROBE_ONLY: "1"

on:
  push:
    branches: ["staging"]
  workflow_dispatch:

concurrency:
  group: deploy-strato-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.lehrfahrer.de

    steps:
      - name: Checkout staging commit
        uses: actions/checkout@v5

      - name: Preflight and regression checks
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "staging"
          git diff --check

          while IFS= read -r -d '' file; do
            case "$file" in
              build/*|editor/*|backup_liniendaten/*) continue ;;
            esac
            node --check "$file"
          done < <(git ls-files -z -- '*.js')

          while IFS= read -r -d '' file; do
            case "$file" in
              api/pdf/test_preview.php|api/pdf/test_preview_v2.php|api/pdf/preview_v2.php) continue ;;
            esac
            php -l "$file" >/dev/null
          done < <(git ls-files -z -- '*.php')

          node --test \
            tools/company-provisioning.test.js \
            tools/control-database.test.js \
            tools/session-auth.test.js \
            tools/capability-authorization.test.js \
            tools/security-dom-xss.test.js \
            tools/security-sensitive-storage.test.js \
            tools/tenant-storage.test.js \
            tools/tenant-lines-cities.test.js \
            tools/tenant-personnel.test.js \
            tools/tenant-catalog-imports.test.js

      - name: Validate isolated staging configuration
        shell: bash
        env:
          STAGING_TARGET_PATH: ${{ vars.STAGING_TARGET_PATH }}
          STAGING_PRIVATE_PATH: ${{ vars.STAGING_PRIVATE_PATH }}
          STAGING_AUTH_PATH: ${{ vars.STAGING_AUTH_PATH }}
          LIVE_TARGET_PATH: ${{ secrets.STRATO_TARGET_PATH }}
          STAGING_DB_DSN: ${{ secrets.STAGING_DB_DSN }}
          STAGING_DB_USER: ${{ secrets.STAGING_DB_USER }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_DB_TLS_CA_PEM: ${{ secrets.STAGING_DB_TLS_CA_PEM }}
          STAGING_API_TOKEN: ${{ secrets.STAGING_API_TOKEN }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          STAGING_BASIC_AUTH_USER: ${{ secrets.STAGING_BASIC_AUTH_USER }}
          STAGING_BASIC_AUTH_PASSWORD: ${{ secrets.STAGING_BASIC_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          required=(
            STAGING_TARGET_PATH STAGING_PRIVATE_PATH STAGING_AUTH_PATH LIVE_TARGET_PATH
            STAGING_DB_DSN STAGING_DB_USER STAGING_DB_PASSWORD STAGING_DB_TLS_CA_PEM
            STAGING_API_TOKEN STAGING_ADMIN_PASSWORD
            STAGING_BASIC_AUTH_USER STAGING_BASIC_AUTH_PASSWORD
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Fehlende Staging-Konfiguration: $name" >&2
              exit 1
            fi
          done
          for path in "$STAGING_TARGET_PATH" "$STAGING_PRIVATE_PATH" "$STAGING_AUTH_PATH"; do
            case "$path" in
              /*|.|..|*../*|*/..|*//*|*[!A-Za-z0-9._/-]*)
                echo "Unsicherer Staging-Pfad." >&2
                exit 1
                ;;
            esac
          done
          normalize() { printf '%s' "${1#/}" | sed 's:/*$::'; }
          if [ "$(normalize "$STAGING_TARGET_PATH")" = "$(normalize "$LIVE_TARGET_PATH")" ]; then
            echo "Staging- und Live-DocumentRoot duerfen nicht identisch sein." >&2
            exit 1
          fi
          if [ "$(normalize "$STAGING_TARGET_PATH")" = "$(normalize "$STAGING_AUTH_PATH")" ] \
              || [ "$(normalize "$STAGING_PRIVATE_PATH")" = "$(normalize "$STAGING_AUTH_PATH")" ]; then
            echo "Staging-Auth-Pfad muss von DocumentRoot und Private Storage getrennt sein." >&2
            exit 1
          fi
          case "$(normalize "$STAGING_PRIVATE_PATH")" in
            lehrfahrer-private|*/lehrfahrer-private)
              echo "Staging darf nicht den Live-Private-Storage verwenden." >&2
              exit 1
              ;;
          esac

      - name: Fingerprint live before staging deployment
        shell: bash
        run: |
          set -euo pipefail
          for host in lehrfahrer.de www.lehrfahrer.de; do
            curl --fail --silent --show-error --location "https://${host}/VERSION" \
              | sha256sum >> /tmp/lehrfahrer-live-before.sha256
          done

      - name: Prepare SSH client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [ -n "${{ secrets.STRATO_SSH_KEY }}" ]; then
            printf '%s\n' "${{ secrets.STRATO_SSH_KEY }}" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
          else
            sudo apt-get update
            sudo apt-get install -y sshpass
          fi
          if [ -n "${{ secrets.STRATO_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.STRATO_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${{ secrets.STRATO_PORT }}" "${{ secrets.STRATO_HOST }}" >> ~/.ssh/known_hosts
          fi

      - name: Analyze live stop_times read-only
        shell: bash
        env:
          SSHPASS: ${{ secrets.STRATO_PASSWORD }}
          STRATO_USER: ${{ secrets.STRATO_USER }}
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          STRATO_PORT: ${{ secrets.STRATO_PORT }}
          STRATO_SSH_KEY: ${{ secrets.STRATO_SSH_KEY }}
        run: |
          set -euo pipefail
          remote="$STRATO_USER@$STRATO_HOST"
          scp_run=(scp -O -P "$STRATO_PORT" -o UpdateHostKeys=no -o StrictHostKeyChecking=yes)
          if [ -n "$STRATO_SSH_KEY" ]; then
            scp_run+=(-i ~/.ssh/id_rsa)
          else
            scp_run=(sshpass -e "${scp_run[@]}")
          fi
          live_zip='./lehrfahrer/gtfs/data/gtfs/latest.zip'
          "${scp_run[@]}" "$remote:$live_zip" /tmp/lehrfahrer-live-gtfs.zip
          test "$(stat -c %s /tmp/lehrfahrer-live-gtfs.zip)" = '250380748'
          printf '%s  %s\n' \
            'edd76d5cb8d628cf63b81445c3a7524cb081f0652c42200f9f22f7920f8b4b035' \
            /tmp/lehrfahrer-live-gtfs.zip | sha256sum --check --status

          python <<'PY'
          import csv, hashlib, io, json, zipfile
          from collections import Counter

          archive = '/tmp/lehrfahrer-live-gtfs.zip'
          members = ('stop_times.txt', 'trips.txt', 'routes.txt')
          paths = {name: '/tmp/' + name for name in members}
          with zipfile.ZipFile(archive) as source:
              for name, path in paths.items():
                  with source.open(name) as src, open(path, 'wb') as dst:
                      while chunk := src.read(1024 * 1024):
                          dst.write(chunk)

          raw_counts = {'crlf': 0, 'bare_lf': 0, 'bare_cr': 0, 'quotes': 0}
          previous_cr = False
          first = True
          bom = False
          with open(paths['stop_times.txt'], 'rb') as stream:
              while chunk := stream.read(1024 * 1024):
                  if first:
                      bom = chunk.startswith(b'\xef\xbb\xbf')
                      first = False
                  raw_counts['quotes'] += chunk.count(b'"')
                  crlf = chunk.count(b'\r\n')
                  if previous_cr and chunk.startswith(b'\n'):
                      crlf += 1
                  raw_counts['crlf'] += crlf
                  raw_counts['bare_lf'] += chunk.count(b'\n') - crlf
                  raw_counts['bare_cr'] += chunk.count(b'\r') - crlf
                  previous_cr = chunk.endswith(b'\r')

          def table(path):
              with open(path, 'r', encoding='utf-8-sig', newline='') as stream:
                  reader = csv.DictReader(stream, strict=True)
                  return list(reader)

          routes = {row.get('route_id', ''): row.get('agency_id', '') for row in table(paths['routes.txt'])}
          trips = {row.get('trip_id', ''): row.get('route_id', '') for row in table(paths['trips.txt'])}
          field_counts = Counter()
          bad = []
          blank_rows = 0
          empty_fields = False
          embedded_commas = False
          quoted_fields = raw_counts['quotes'] > 0
          with open(paths['stop_times.txt'], 'r', encoding='utf-8-sig', newline='') as stream:
              reader = csv.reader(stream, strict=True)
              header = next(reader)
              expected = len(header)
              trip_index = header.index('trip_id') if 'trip_id' in header else None
              stop_index = header.index('stop_id') if 'stop_id' in header else None
              sequence_index = header.index('stop_sequence') if 'stop_sequence' in header else None
              record = 1
              while True:
                  try:
                      row = next(reader)
                  except StopIteration:
                      break
                  except csv.Error as error:
                      bad.append({'record': record + 1, 'physical_line': reader.line_num,
                                  'parsed_fields': None, 'error': str(error), 'agency_id': None})
                      record += 1
                      continue
                  record += 1
                  if not row:
                      blank_rows += 1
                      continue
                  field_counts[len(row)] += 1
                  empty_fields = empty_fields or any(value == '' for value in row)
                  embedded_commas = embedded_commas or any(',' in value for value in row)
                  if len(row) != expected:
                      def value_at(index):
                          return row[index] if index is not None and index < len(row) else None
                      trip_id = value_at(trip_index)
                      route_id = trips.get(trip_id or '')
                      agency_id = routes.get(route_id or '')
                      bad.append({
                          'record': record,
                          'physical_line': reader.line_num,
                          'expected_fields': expected,
                          'parsed_fields': len(row),
                          'trip_id': trip_id,
                          'stop_id': value_at(stop_index),
                          'stop_sequence': value_at(sequence_index),
                          'route_id': route_id,
                          'agency_id': agency_id,
                          'cottbus_relevant': agency_id == '143',
                      })

          standard = {
              'trip_id', 'arrival_time', 'departure_time', 'stop_id', 'location_group_id',
              'location_id', 'stop_sequence', 'stop_headsign', 'start_pickup_drop_off_window',
              'end_pickup_drop_off_window', 'pickup_type', 'drop_off_type',
              'continuous_pickup', 'continuous_drop_off', 'shape_dist_traveled', 'timepoint',
              'pickup_booking_rule_id', 'drop_off_booking_rule_id'
          }
          summary = {
              'encoding': 'UTF-8', 'bom': bom, 'line_endings': raw_counts,
              'delimiter': ',', 'header': header, 'expected_fields': expected,
              'unknown_extension_columns': [name for name in header if name not in standard],
              'quoted_fields_present': quoted_fields, 'embedded_commas_present': embedded_commas,
              'empty_fields_present': empty_fields, 'blank_rows': blank_rows,
              'field_count_distribution': dict(sorted(field_counts.items())),
              'problem_rows': len(bad),
              'cottbus_relevant_problem_rows': sum(item.get('cottbus_relevant') is True for item in bad),
              'foreign_problem_rows': sum(item.get('cottbus_relevant') is False for item in bad),
              'unresolved_problem_rows': sum(item.get('cottbus_relevant') is None for item in bad),
              'details': bad[:20],
              'details_truncated': len(bad) > 20,
          }
          print('RFC_CSV_ANALYSIS=' + json.dumps(summary, ensure_ascii=True, sort_keys=True))
          PY

          php <<'PHP'
          <?php
          function scan(string $path, bool $explicitEscape): array {
              $stream = fopen($path, 'rb');
              $header = $explicitEscape ? fgetcsv($stream, null, ',', '"', '') : fgetcsv($stream);
              $expected = count($header);
              $tripIndex = array_search('trip_id', $header, true);
              $record = 1;
              $bad = [];
              $counts = [];
              while (($row = $explicitEscape ? fgetcsv($stream, null, ',', '"', '') : fgetcsv($stream)) !== false) {
                  $record++;
                  if ($row === [null] || $row === []) continue;
                  $count = count($row);
                  $counts[$count] = ($counts[$count] ?? 0) + 1;
                  if ($count !== $expected) {
                      $bad[] = [
                          'record' => $record,
                          'byte_after_record' => ftell($stream),
                          'expected_fields' => $expected,
                          'parsed_fields' => $count,
                          'trip_id' => is_int($tripIndex) && isset($row[$tripIndex]) ? $row[$tripIndex] : null,
                      ];
                  }
              }
              fclose($stream);
              ksort($counts, SORT_NUMERIC);
              return ['expected_fields' => $expected, 'field_count_distribution' => $counts,
                  'problem_rows' => count($bad), 'details' => array_slice($bad, 0, 20),
                  'details_truncated' => count($bad) > 20];
          }
          echo 'PHP_DEFAULT_ESCAPE=' . json_encode(scan('/tmp/stop_times.txt', false), JSON_UNESCAPED_SLASHES) . "\n";
          echo 'PHP_RFC_ESCAPE=' . json_encode(scan('/tmp/stop_times.txt', true), JSON_UNESCAPED_SLASHES) . "\n";
          PHP

      - name: Build private staging runtime files
        if: env.STOP_TIMES_PROBE_ONLY != '1'
        shell: bash
        env:
          STAGING_DB_DSN: ${{ secrets.STAGING_DB_DSN }}
          STAGING_DB_USER: ${{ secrets.STAGING_DB_USER }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_DB_TLS_CA_PEM: ${{ secrets.STAGING_DB_TLS_CA_PEM }}
          STAGING_API_TOKEN: ${{ secrets.STAGING_API_TOKEN }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          STAGING_BASIC_AUTH_USER: ${{ secrets.STAGING_BASIC_AUTH_USER }}
          STAGING_BASIC_AUTH_PASSWORD: ${{ secrets.STAGING_BASIC_AUTH_PASSWORD }}
          STAGING_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          STAGING_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          export RUNTIME_OUTPUT=/tmp/lehrfahrer-staging-runtime-env.php
          export PROVISION_SECRET_OUTPUT=/tmp/lehrfahrer-staging-provision-secret.php
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export DEPLOYED_AT
          php <<'PHP'
          <?php
          $values = [
              'LEHRFAHRER_ENV' => 'staging',
              'LEHRFAHRER_PUBLIC_ORIGIN' => 'https://staging.lehrfahrer.de',
              'LEHRFAHRER_DB_DRIVER' => 'mysql',
              'LEHRFAHRER_DB_DSN' => getenv('STAGING_DB_DSN'),
              'LEHRFAHRER_DB_USER' => getenv('STAGING_DB_USER'),
              'LEHRFAHRER_DB_PASSWORD' => getenv('STAGING_DB_PASSWORD'),
              'LEHRFAHRER_DB_TLS_REQUIRED' => '1',
              'LEHRFAHRER_API_TOKEN' => getenv('STAGING_API_TOKEN'),
              'LEHRFAHRER_BUILD_COMMIT' => getenv('STAGING_BUILD_COMMIT'),
              'LEHRFAHRER_BUILD_ID' => getenv('STAGING_BUILD_ID'),
              'LEHRFAHRER_DEPLOYED_AT' => getenv('DEPLOYED_AT'),
              'LEHRFAHRER_STAGING_COMPANY_SLUG' => 'lehrfahrer-test',
          ];
          $php = "<?php\nputenv('LEHRFAHRER_PRIVATE_DATA_DIR=' . __DIR__);\n"
              . "putenv('LEHRFAHRER_DB_TLS_CA=' . __DIR__ . '/mariadb-ca.pem');\n";
          foreach ($values as $name => $value) {
              $php .= 'putenv(' . var_export($name . '=' . $value, true) . ");\n";
          }
          $php .= "if (is_file(__DIR__ . '/tenant-binding.php')) require __DIR__ . '/tenant-binding.php';\n";
          file_put_contents(getenv('RUNTIME_OUTPUT'), $php);
          file_put_contents(
              getenv('PROVISION_SECRET_OUTPUT'),
              "<?php\nputenv(" . var_export(
                  'LEHRFAHRER_STAGING_ADMIN_PASSWORD=' . getenv('STAGING_ADMIN_PASSWORD'),
                  true
              ) . ");\n"
          );
          PHP
          printf '%s\n' "$STAGING_DB_TLS_CA_PEM" > /tmp/lehrfahrer-staging-mariadb-ca.pem
          if ! command -v htpasswd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y apache2-utils
          fi
          printf '%s' "$STAGING_BASIC_AUTH_PASSWORD" \
            | htpasswd -n -i -B -C 12 "$STAGING_BASIC_AUTH_USER" \
            > /tmp/lehrfahrer-staging.htpasswd
          chmod 600 \
            /tmp/lehrfahrer-staging-runtime-env.php \
            /tmp/lehrfahrer-staging-provision-secret.php \
            /tmp/lehrfahrer-staging-mariadb-ca.pem \
            /tmp/lehrfahrer-staging.htpasswd

      - name: Deploy only to isolated staging paths
        if: env.STOP_TIMES_PROBE_ONLY != '1'
        shell: bash
        env:
          SSHPASS: ${{ secrets.STRATO_PASSWORD }}
          STRATO_USER: ${{ secrets.STRATO_USER }}
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          STRATO_PORT: ${{ secrets.STRATO_PORT }}
          STRATO_SSH_KEY: ${{ secrets.STRATO_SSH_KEY }}
          STAGING_TARGET_PATH: ${{ vars.STAGING_TARGET_PATH }}
          STAGING_PRIVATE_PATH: ${{ vars.STAGING_PRIVATE_PATH }}
          STAGING_AUTH_PATH: ${{ vars.STAGING_AUTH_PATH }}
          LIVE_TARGET_PATH: ${{ secrets.STRATO_TARGET_PATH }}
          BASIC_USER: ${{ secrets.STAGING_BASIC_AUTH_USER }}
          BASIC_PASSWORD: ${{ secrets.STAGING_BASIC_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          REMOTE="$STRATO_USER@$STRATO_HOST"
          SSH_BASE=(ssh -p "$STRATO_PORT" -o UpdateHostKeys=no -o StrictHostKeyChecking=yes)
          SCP_BASE=(scp -P "$STRATO_PORT" -o UpdateHostKeys=no -o StrictHostKeyChecking=yes)
          if [ -n "$STRATO_SSH_KEY" ]; then
            SSH_BASE+=(-i ~/.ssh/id_rsa)
            SCP_BASE+=(-i ~/.ssh/id_rsa)
            RSYNC_SSH="ssh -p $STRATO_PORT -i ~/.ssh/id_rsa -o UpdateHostKeys=no -o StrictHostKeyChecking=yes"
            SSH_RUN=("${SSH_BASE[@]}")
            SCP_RUN=("${SCP_BASE[@]}")
            RSYNC_RUN=(rsync)
          else
            SSH_RUN=(sshpass -e "${SSH_BASE[@]}")
            SCP_RUN=(sshpass -e "${SCP_BASE[@]}")
            RSYNC_SSH="ssh -p $STRATO_PORT -o UpdateHostKeys=no -o StrictHostKeyChecking=yes"
            RSYNC_RUN=(sshpass -e rsync)
          fi

          "${SSH_RUN[@]}" "$REMOTE" \
            "mkdir -p -- './$STAGING_TARGET_PATH' './$STAGING_PRIVATE_PATH' './$STAGING_AUTH_PATH' && chmod 700 './$STAGING_PRIVATE_PATH'"

          "${RSYNC_RUN[@]}" -az --omit-dir-times --no-perms --no-owner --no-group \
            --exclude '.git/' --exclude '.github/' --exclude '.vscode/' \
            --exclude 'WorkingSystem/' --exclude 'Offlinekarten/' --exclude 'backup/' \
            --exclude 'backup_liniendaten/' --exclude 'autosave/' --exclude 'build/' \
            --exclude 'editor/' --exclude 'docs/' --exclude 'deploy/' --exclude 'tools/' \
            --exclude '_linien/' --exclude 'linien/test/' --exclude 'app5/' --exclude 'app6/' \
            --exclude 'node_modules/' --exclude '*.bak' --exclude '*.tmp' --exclude '*.log' \
            -e "$RSYNC_SSH" ./ "$REMOTE:./$STAGING_TARGET_PATH/"

          "${SCP_RUN[@]}" \
            /tmp/lehrfahrer-staging-runtime-env.php \
            /tmp/lehrfahrer-staging-provision-secret.php \
            /tmp/lehrfahrer-staging-mariadb-ca.pem \
            tools/provision-staging-company.php \
            tools/provision-cottbus-staging.php \
            tools/cottbus-migrate-staging.php \
            tools/staging-smoke.php \
            "$REMOTE:./$STAGING_PRIVATE_PATH/"

          "${SCP_RUN[@]}" /tmp/lehrfahrer-staging.htpasswd \
            "$REMOTE:./$STAGING_AUTH_PATH/"

          "${SSH_RUN[@]}" "$REMOTE" \
            "bash -s -- '$STAGING_TARGET_PATH' '$STAGING_PRIVATE_PATH' '$STAGING_AUTH_PATH' '$LIVE_TARGET_PATH'" <<'REMOTE_SCRIPT'
          set -euo pipefail
          staging_target="$1"
          staging_private="$2"
          staging_auth="$3"
          live_target="${4#/}"
          webroot="$(cd "./$staging_target" && pwd -P)"
          private_root="$(cd "./$staging_private" && pwd -P)"
          auth_root="$(cd "./$staging_auth" && pwd -P)"
          if [ -z "$live_target" ] || [ "$live_target" = "." ]; then
            live_webroot="$(pwd -P)"
          else
            live_webroot="$(cd "./$live_target" && pwd -P)"
          fi
          live_private="$(dirname "$live_webroot")/lehrfahrer-private"
          test -d "$live_private"
          case "$private_root/" in "$webroot/"*) exit 20 ;; esac
          case "$webroot/" in "$private_root/"*) exit 21 ;; esac
          case "$auth_root/" in "$webroot/"*|"$private_root/"*) exit 22 ;; esac
          case "$webroot/" in "$auth_root/"*) exit 23 ;; esac
          case "$private_root/" in "$auth_root/"*) exit 24 ;; esac

          chmod 700 "$private_root"
          chmod 600 \
            "$private_root/lehrfahrer-staging-runtime-env.php" \
            "$private_root/lehrfahrer-staging-provision-secret.php" \
            "$private_root/lehrfahrer-staging-mariadb-ca.pem"
          mv "$private_root/lehrfahrer-staging-runtime-env.php" "$private_root/runtime-env.php"
          mv "$private_root/lehrfahrer-staging-provision-secret.php" "$private_root/.provision-secret.php"
          mv "$private_root/lehrfahrer-staging-mariadb-ca.pem" "$private_root/mariadb-ca.pem"

          webroot_group_id="$(stat -c '%g' "$webroot")"
          apache_identities="$(ps -eo user=,group=,comm= 2>/dev/null \
            | awk '$3 ~ /^(apache2|httpd)$/ { print $1 ":" $2 }' \
            | sort -u | paste -sd, - || true)"
          if [ -z "$apache_identities" ]; then apache_identities=not-visible; fi
          if chgrp "$webroot_group_id" "$auth_root" "$auth_root/lehrfahrer-staging.htpasswd"; then
            auth_group_mode=available
          else
            auth_group_mode=unavailable
          fi
          chmod 750 "$auth_root"
          chmod 640 "$auth_root/lehrfahrer-staging.htpasswd"
          mv "$auth_root/lehrfahrer-staging.htpasswd" "$auth_root/.htpasswd"
          printf 'Basic-Auth-Pruefung: apache_identitaet=%s gruppenmodus=%s verzeichnis=750 datei=640\n' \
            "$apache_identities" "$auth_group_mode"

          printf 'auto_prepend_file=%s\n' "$private_root/runtime-env.php" > "$webroot/.user.ini"
          chmod 600 "$webroot/.user.ini"
          if [ -f "$webroot/.htaccess" ]; then
            sed '/# BEGIN LEHRFAHRER STAGING/,/# END LEHRFAHRER STAGING/d' "$webroot/.htaccess" \
              > "$webroot/.htaccess.staging"
            mv "$webroot/.htaccess.staging" "$webroot/.htaccess"
          fi
          cat >> "$webroot/.htaccess" <<HTACCESS
          # BEGIN LEHRFAHRER STAGING
          AuthType Basic
          AuthName "Lehrfahrer Staging"
          AuthUserFile "$auth_root/.htpasswd"
          Require valid-user
          <IfModule mod_headers.c>
            Header always set X-Robots-Tag "noindex, nofollow, noarchive"
          </IfModule>
          # END LEHRFAHRER STAGING
          HTACCESS
          printf 'User-agent: *\nDisallow: /\n' > "$webroot/robots.txt"

          cat > "$private_root/run-provision.php" <<PHP
          <?php
          putenv('LEHRFAHRER_APP_ROOT=$webroot');
          putenv('LEHRFAHRER_STAGING_CGI_PROVISION=1');
          putenv('LEHRFAHRER_STAGING_PROVISION_RESULT_FILE=$private_root/provision-result.json');
