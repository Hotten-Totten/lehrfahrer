              || ($data['VARIANTS_REBUILD_CAPABLE'] ?? '') !== 'YES'
              || ($data['VARIANTS_VALIDATION_CAPABLE'] ?? '') !== 'YES'
              || ($data['BLOCKERS'] ?? null) !== []
              || ($data['deterministic_manifest']['company_id'] ?? '') !== 'cmp_2ff1b82166c99988ed6f7eb51cca7b56'
              || ($data['deterministic_manifest']['expected_target'] ?? null) !== $expected
              || ($data['deterministic_manifest']['variants_index']['schema_version'] ?? null) !== 3
              || ($data['deterministic_manifest']['variants_index']['agency_ids'] ?? null) !== ['143']
              || ($data['deterministic_manifest']['variants_index']['routes'] ?? null) !== 75
              || ($data['deterministic_manifest']['variants_index']['variants'] ?? 0) < 1
              || ($data['deterministic_manifest']['variants_index']['integrity_check'] ?? '') !== 'ok'
              || preg_match('/^[0-9a-f]{64}$/D', (string)($data['deterministic_manifest']['variants_index']['sha256'] ?? '')) !== 1
              || ($data['WOULD_REMAP'] ?? null) !== ['EXACT' => 36, 'HIGH' => 4, 'MANUAL' => 0, 'UNRESOLVED' => 0]
              || ($data['real_target']['target_unchanged'] ?? false) !== true
              || ($data['real_target']['other_tenants_unchanged'] ?? false) !== true
              || $status === [] || count(array_filter($status, static fn($value) => $value !== 'CREATE')) !== 0
              || ($data['read_only_evidence']['database_writes'] ?? -1) !== 0
              || ($data['read_only_evidence']['target_writes'] ?? -1) !== 0
              || preg_match('/^[0-9a-f]{64}$/D', (string)($data['SOURCE_FINGERPRINT'] ?? '')) !== 1) {
              $safeBlockers = array_map(static function ($value): string {
                  $message = (string)$value;
                  return preg_match('/password|token|secret|credential|@/i', $message) === 1
                      ? '[redigierter Blocker]' : $message;
              }, is_array($data['BLOCKERS'] ?? null) ? $data['BLOCKERS'] : []);
              $statusCounts = [];
              foreach ($status as $value) $statusCounts[(string)$value] = ($statusCounts[(string)$value] ?? 0) + 1;
              file_put_contents('php://stderr', json_encode([
                  'mode' => $data['mode'] ?? null,
                  'READY_FOR_APPLY' => $data['READY_FOR_APPLY'] ?? null,
                  'APPLY_ORCHESTRATION_READY' => $data['APPLY_ORCHESTRATION_READY'] ?? null,
                  'DB_BACKUP_CAPABLE' => $data['DB_BACKUP_CAPABLE'] ?? null,
                  'DB_RESTORE_PATH_VALID' => $data['DB_RESTORE_PATH_VALID'] ?? null,
                  'VARIANTS_REBUILD_CAPABLE' => $data['VARIANTS_REBUILD_CAPABLE'] ?? null,
                  'VARIANTS_VALIDATION_CAPABLE' => $data['VARIANTS_VALIDATION_CAPABLE'] ?? null,
                  'BLOCKERS' => $safeBlockers,
                  'variants_index' => $data['deterministic_manifest']['variants_index'] ?? null,
                  'expected_target_matches' => ($data['deterministic_manifest']['expected_target'] ?? null) === $expected,
                  'target_status_counts' => $statusCounts,
                  'target_unchanged' => $data['real_target']['target_unchanged'] ?? null,
                  'other_tenants_unchanged' => $data['real_target']['other_tenants_unchanged'] ?? null,
                  'database_writes' => $data['read_only_evidence']['database_writes'] ?? null,
                  'target_writes' => $data['read_only_evidence']['target_writes'] ?? null,
              ], JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . "\n");
              file_put_contents('php://stderr', "Cottbus-Dry-Run-Ergebnis weicht von der Freigabe ab.\n");
              exit(1);
          }
          echo json_encode([
              'mode' => $data['mode'],
              'READY_FOR_APPLY' => $data['READY_FOR_APPLY'],
              'APPLY_ORCHESTRATION_READY' => $data['APPLY_ORCHESTRATION_READY'],
              'DB_BACKUP_CAPABLE' => $data['DB_BACKUP_CAPABLE'],
              'DB_RESTORE_PATH_VALID' => $data['DB_RESTORE_PATH_VALID'],
              'VARIANTS_REBUILD_CAPABLE' => $data['VARIANTS_REBUILD_CAPABLE'],
              'VARIANTS_VALIDATION_CAPABLE' => $data['VARIANTS_VALIDATION_CAPABLE'],
              'apply_orchestration' => $data['apply_orchestration'],
              'SOURCE_FINGERPRINT' => $data['SOURCE_FINGERPRINT'],
              'TARGET_FINGERPRINT' => $data['real_target']['target_fingerprint_after'],
              'WOULD_MIGRATE' => $expected,
              'WOULD_EXCLUDE' => $data['WOULD_EXCLUDE'],
              'WOULD_REMAP' => $data['WOULD_REMAP'],
              'BLOCKERS' => $data['BLOCKERS'],
              'source_files_verified' => $data['read_only_evidence']['source_files_verified_after_plan'],
              'target_unchanged' => true,
              'other_tenants_unchanged' => true,
              'database_writes' => 0,
              'target_writes' => 0,
          ], JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR), "\n";
          PHP
          COTTBUS_DRY_RUN_RESULT="$private_root/cottbus-dry-run-result.json" \
            php -q -f "$private_root/validate-cottbus-dry-run.php"
          printf 'APPLY_ORCHESTRATION_READY=YES\n'

          set +e
          php -q -f "$private_root/run-cottbus-provision.php" \
            > "$private_root/cottbus-provision-stdout.raw" \
            2> "$private_root/cottbus-provision-stderr.raw"
          cottbus_post_status="$?"
          set -e
          if [ "$cottbus_post_status" -ne 0 ] || [ -s "$private_root/cottbus-provision-stderr.raw" ]; then
            echo 'Cottbus-Nachpruefung ist fehlgeschlagen; Details bleiben privat.' >&2
            exit 1
          fi
          cottbus_fingerprints_after="$(
            COTTBUS_RESULT_FILE="$private_root/cottbus-provision-result.json" \
              php -q -f "$private_root/validate-cottbus-result.php"
          )"
          if [ "$cottbus_fingerprints_before" != "$cottbus_fingerprints_after" ]; then
            echo 'Cottbus- oder Testgesellschaft wurde durch den Dry-Run veraendert.' >&2
            exit 1
          fi
          printf 'Cottbus- und Testgesellschaft vor/nach Dry-Run unveraendert.\n'
          rm -f -- \
            "$private_root/run-cottbus-provision.php" \
            "$private_root/validate-cottbus-result.php" \
            "$private_root/cottbus-provision-stdout.raw" \
            "$private_root/cottbus-provision-stderr.raw" \
            "$private_root/report-cottbus-dry-run-error.php" \
            "$private_root/validate-cottbus-dry-run.php" \
            "$private_root/cottbus-dry-run-result.json" \
            "$private_root/cottbus-dry-run-stderr.raw"
          fi
          set +e
          account_preflight_report="$(LEHRFAHRER_ACCOUNT_PREFLIGHT_RUN=1 LEHRFAHRER_APP_ROOT="$webroot" \
            php -q -d "auto_prepend_file=$private_root/runtime-env.php" \
              -f "$private_root/control-account-preflight.php")"
          account_preflight_status="$?"
          set -e
          if [ -z "$account_preflight_report" ]; then
            echo 'Read-only Account-Preflight lieferte keinen Bericht.' >&2
            exit 2
          fi
          printf '%s\n' "$account_preflight_report"
          printf 'ACCOUNT_MIGRATION_PREFLIGHT_EXIT=%s\n' "$account_preflight_status"
          if [ "$migrate_accounts" = true ] && [ "$account_preflight_status" -ne 0 ]; then
            echo 'Account-Migration wegen Preflight-Blocker gestoppt.' >&2
            exit 2
          fi
          if [ "$account_preflight_status" -gt 1 ]; then
            echo 'Read-only Account-Preflight konnte nicht sicher ausgeführt werden.' >&2
            exit "$account_preflight_status"
          fi
          REMOTE_SCRIPT

          origin='https://staging.lehrfahrer.de'
          http_status() {
            curl --silent --show-error --max-time 20 --output /dev/null \
              --write-out '%{http_code}' "$@" || true
          }
          unauth_status="$(http_status "$origin/")"
          wrong_status="$(http_status -u 'invalid-staging-user:invalid-staging-password' "$origin/")"
          valid_status="$(http_status -u "$BASIC_USER:$BASIC_PASSWORD" "$origin/")"

          if [ "$unauth_status" = 500 ] || [ "$wrong_status" = 500 ] || [ "$valid_status" = 500 ]; then
            echo 'Apache kann den gruppengeschuetzten Auth-Pfad nicht lesen; aktiviere eng begrenzte STRATO-Alternative.'
            "${SSH_RUN[@]}" "$REMOTE" \
              "chmod 711 './$STAGING_AUTH_PATH' && chmod 644 './$STAGING_AUTH_PATH/.htpasswd'"
            unauth_status="$(http_status "$origin/")"
            wrong_status="$(http_status -u 'invalid-staging-user:invalid-staging-password' "$origin/")"
            valid_status="$(http_status -u "$BASIC_USER:$BASIC_PASSWORD" "$origin/")"
            auth_permission_mode='711/644 (separater, nicht listbarer Auth-Pfad)'
          else
            auth_permission_mode='750/640 (Webroot-Gruppe)'
          fi

          if [ "$unauth_status" != 401 ] || [ "$wrong_status" != 401 ]; then
            echo "Basic-Auth verweigert anonyme oder falsche Anmeldungen nicht korrekt." >&2
            exit 1
          fi
          case "$valid_status" in
            2??|3??) ;;
            *) echo "Gueltige Basic-Auth liefert HTTP $valid_status statt Erfolg." >&2; exit 1 ;;
          esac
          printf 'Basic-Auth erfolgreich: ohne=401 falsch=401 korrekt=%s rechte=%s\n' \
            "$valid_status" "$auth_permission_mode"

      - name: Read-only migrated account cutover preflight on staging
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.migrate_accounts }}
        shell: bash
        env:
          SSHPASS: ${{ secrets.STRATO_PASSWORD }}
          STRATO_USER: ${{ secrets.STRATO_USER }}
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          STRATO_PORT: ${{ secrets.STRATO_PORT }}
          STRATO_SSH_KEY: ${{ secrets.STRATO_SSH_KEY }}
          STAGING_TARGET_PATH: ${{ vars.STAGING_TARGET_PATH }}
          STAGING_PRIVATE_PATH: ${{ vars.STAGING_PRIVATE_PATH }}
          LIVE_TARGET_PATH: ${{ secrets.STRATO_TARGET_PATH }}
        run: |
          set -euo pipefail
          REMOTE="$STRATO_USER@$STRATO_HOST"
          SSH_BASE=(ssh -p "$STRATO_PORT" -o UpdateHostKeys=no -o StrictHostKeyChecking=yes)
          if [ -n "$STRATO_SSH_KEY" ]; then
            SSH_BASE+=(-i ~/.ssh/id_rsa)
            SSH_RUN=("${SSH_BASE[@]}")
          else
            SSH_RUN=(sshpass -e "${SSH_BASE[@]}")
          fi
          "${SSH_RUN[@]}" "$REMOTE" \
            "bash -s -- '$STAGING_TARGET_PATH' '$STAGING_PRIVATE_PATH' '$LIVE_TARGET_PATH'" <<'REMOTE_SCRIPT'
          set -euo pipefail
          staging_target="$1"
          staging_private="$2"
          live_target="${3#/}"
          webroot="$(cd "./$staging_target" && pwd -P)"
          private_root="$(cd "./$staging_private" && pwd -P)"
          if [ -z "$live_target" ] || [ "$live_target" = "." ]; then
            live_webroot="$(pwd -P)"
          else
            live_webroot="$(cd "./$live_target" && pwd -P)"
          fi
          test "$webroot" != "$live_webroot"
          case "$private_root/" in "$webroot/"*|"$live_webroot/"*) exit 31 ;; esac
          report="$(LEHRFAHRER_ENV=staging LEHRFAHRER_CUTOVER_PREFLIGHT_RUN=1 LEHRFAHRER_APP_ROOT="$webroot" \
            php -q -d "auto_prepend_file=$private_root/runtime-env.php" \
              -f "$private_root/control-account-cutover-preflight.php")"
          printf '%s\n' "$report"
          printf '%s\n' "$report" | grep -Eq '^\{"status":"(PASS|WARNING)"'
          printf '%s\n' "$report" | grep -Fq '"auth":{"mode":"PARALLEL","lock":"OPEN"}'
          REMOTE_SCRIPT

      - name: Staging HTTP, runtime, login and session smoke test
        shell: bash
        env:
          BASIC_USER: ${{ secrets.STAGING_BASIC_AUTH_USER }}
          BASIC_PASSWORD: ${{ secrets.STAGING_BASIC_AUTH_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          origin='https://staging.lehrfahrer.de'
          ready=0
          for _ in $(seq 1 12); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$origin/" || true)"
            if [ "$status" = 401 ]; then ready=1; break; fi
            sleep 5
          done
          test "$ready" = 1
          wrong_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -u 'invalid-staging-user:invalid-staging-password' "$origin/" || true)"
          test "$wrong_status" = 401

          root_status="$(curl --silent --show-error --output /tmp/staging-root-anonymous.html \
            --dump-header /tmp/staging-root-anonymous.headers --write-out '%{http_code}' \
            -u "$BASIC_USER:$BASIC_PASSWORD" "$origin/")"
          test "$root_status" = 302
          grep -Eiq '^location: *account-login\.php\?next=%2F' /tmp/staging-root-anonymous.headers
          if grep -q '<title>Linien-Editor</title>' /tmp/staging-root-anonymous.html; then
