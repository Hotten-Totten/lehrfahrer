name: Read-only A5 staging acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-check:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Configure existing staging SSH access
        shell: bash
        env:
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          STRATO_PORT: ${{ secrets.STRATO_PORT }}
          STRATO_SSH_KEY: ${{ secrets.STRATO_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$STRATO_SSH_KEY" ]; then
            printf '%s\n' "$STRATO_SSH_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
          else
            if ! sudo apt-get update -qq >/dev/null 2>&1 \
                || ! sudo apt-get install -y -qq sshpass >/dev/null 2>&1; then
              echo 'SMOKE_CATEGORY=ACCESS_FAILURE'
              exit 0
            fi
          fi
          if [ -n "${{ secrets.STRATO_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.STRATO_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$STRATO_PORT" "$STRATO_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Read-only A5 audit and archived training verification
        shell: bash
        env:
          SSHPASS: ${{ secrets.STRATO_PASSWORD }}
          STRATO_USER: ${{ secrets.STRATO_USER }}
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          STRATO_PORT: ${{ secrets.STRATO_PORT }}
          STRATO_SSH_KEY: ${{ secrets.STRATO_SSH_KEY }}
          STAGING_TARGET_PATH: ${{ vars.STAGING_TARGET_PATH }}
          STAGING_PRIVATE_PATH: ${{ vars.STAGING_PRIVATE_PATH }}
          LIVE_TARGET_PATH: ${{ secrets.STRATO_TARGET_PATH }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "diagnose/a5-readonly-20261108"
          for path in "$STAGING_TARGET_PATH" "$STAGING_PRIVATE_PATH" "$LIVE_TARGET_PATH"; do
          [[ "$path" =~ ^[A-Za-z0-9_./-]+$ ]]
          case "$path" in /*|.|..|*../*|*/..) exit 1;; esac
          done
          ssh_run(){
          if [ -n "$STRATO_SSH_KEY" ];then
          ssh -p "$STRATO_PORT" -o UpdateHostKeys=no -o StrictHostKeyChecking=yes -i ~/.ssh/id_rsa "$@"
          else
          sshpass -e ssh -p "$STRATO_PORT" -o UpdateHostKeys=no -o StrictHostKeyChecking=yes "$@"
          fi
          }
          ssh_run "$STRATO_USER@$STRATO_HOST" "bash -s -- '$STAGING_TARGET_PATH' '$STAGING_PRIVATE_PATH' '$LIVE_TARGET_PATH'" <<'REMOTE_A5'
          set -euo pipefail
          webroot="$(cd "./$1" && pwd -P)"
          private_root="$(cd "./$2" && pwd -P)"
          live_root="$(cd "./$3" && pwd -P)"
          test "$webroot" != "$live_root"
          test "$private_root" != "$live_root"
          test "$webroot" != "$private_root"
          test -f "$private_root/runtime-env.php"
          LEHRFAHRER_ENV=staging LEHRFAHRER_APP_ROOT="$webroot" LEHRFAHRER_PRIVATE_DATA_DIR="$private_root" \
          php -q -d "auto_prepend_file=$private_root/runtime-env.php" <<'PHP'
          <?php
          set_exception_handler(static function(Throwable $e):void{fwrite(STDERR,"A5_CHECK_FAILED: ".$e->getMessage()."\n");exit(1);});
          require_once getenv('LEHRFAHRER_APP_ROOT').'/api/_audit_file_operation.php';
          function check(bool $ok,string $reason):void{if(!$ok)throw new RuntimeException($reason);}
          check(lehrfahrer_environment()==='staging','Environment mismatch');
          $company='cmp_2ff1b82166c99988ed6f7eb51cca7b56';
          $base=getenv('LEHRFAHRER_PRIVATE_DATA_DIR').'/companies/'.$company;
          $journal=$base.'/imports/audit-file-operations';
          check(is_file($journal.'/.lock')&&!is_link($journal.'/.lock'),'Existing lock missing');
          $lock=fopen($journal.'/.lock','r');check($lock!==false&&flock($lock,LOCK_SH),'Read lock unavailable');
          check((glob($journal.'/*.json')?:[])===[],'Unfinished file journal');
          $read=static function(string $file):array{
           check(is_file($file)&&!is_link($file),'Expected data file missing');
           $d=json_decode(file_get_contents($file),true,512,JSON_THROW_ON_ERROR);
           check(is_array($d),'Invalid data file');return $d;
          };
          $training=$read($base.'/trainings/training_000005.json');
          check(($training['trainingId']??'')==='training_000005','Training identity mismatch');
          check(($training['status']??'')==='archived','Training not archived');
          check(!empty($training['completed']),'Completion time missing');
          check(count($training['routes']??[])===1&&($training['routes'][0]['routeStatus']??'')==='completed','Training route not complete');
          $driverId=$training['driverId']??'';
          $drivers=$read($base.'/drivers/drivers.json');
          foreach($drivers as $driver)check(($driver['id']??null)!==$driverId,'Test driver still present');
          $packageId='pkg_c83f5b7383c55639d26f987f7b40b734';
          check(!file_exists($base.'/packages/'.$packageId.'/paket.json'),'Package still present');
          check(!file_exists($base.'/packages/'.$packageId.'/paket.zip'),'Package ZIP still present');
          check((glob($base.'/documents/'.$packageId.'/*.pdf')?:[])===[],'Package PDFs still present');
          $settings=$read($base.'/settings/city_settings.json');
          check(($settings['cottbus']['dispatchPhone']??null)==='+49 355 8662 422','Authorized dispatch phone mismatch');
          $c=lehrfahrer_control_mysql_configuration();
          $pdo=new PDO($c['dsn'],$c['user'],$c['password'],$c['options']);
          $pdo->exec('SET TRANSACTION READ ONLY');$pdo->beginTransaction();
          $targets=['DRIVER'=>$driverId,'TRAINING'=>'training_000005','PACKAGE'=>$packageId,'SETTING'=>'cottbus'];
          $report=[];$actor=null;$membership=null;
          foreach($targets as $type=>$id){
           $identity=lehrfahrer_audit_file_business_identity($company,['type'=>$type,'id'=>$id]);
           $q=$pdo->prepare('SELECT action,account_id,membership_id,company_id,context_type,capability_snapshot,result,occurred_at FROM audit_events WHERE object_type=? AND object_id=? ORDER BY sequence_number');
           $q->execute([$type,$identity['objectId']]);$rows=$q->fetchAll(PDO::FETCH_ASSOC);
           if($type==='SETTING')$rows=array_values(array_filter($rows,static fn(array $r):bool=>$r['occurred_at']>='2026-11-08T14:13:00Z'));
           check($rows!==[],$type.' audit missing');
           foreach($rows as $r){
            check($r['company_id']===$company&&$r['context_type']==='TENANT'&&$r['result']==='SUCCESS',$type.' tenant/result mismatch');
            check(!empty($r['account_id'])&&!empty($r['membership_id']),$type.' actor missing');
            $actor??=$r['account_id'];$membership??=$r['membership_id'];
            check($r['account_id']===$actor&&$r['membership_id']===$membership,$type.' inconsistent actor');
            $caps=match($type){'DRIVER'=>['drivers.manage'],'TRAINING'=>['trainings.manage'],
              'PACKAGE'=>$r['action']==='PACKAGE_DOWNLOAD'?['packages.download']:($r['action']==='PACKAGE_CREATE'?['packages.create']:['packages.manage','packages.create']),
              'SETTING'=>['operations.settings.write']};
            check(in_array($r['capability_snapshot'],$caps,true),$type.' capability mismatch');
           }
           $actions=array_column($rows,'action');$counts=array_count_values($actions);
           if($type==='DRIVER'){
            check($actions[0]==='DRIVER_CREATE'&&end($actions)==='DRIVER_DELETE','Driver lifecycle incomplete');
            check(($counts['DRIVER_CREATE']??0)===1&&($counts['DRIVER_DELETE']??0)===1&&($counts['DRIVER_CHANGE']??0)>=1&&($counts['DRIVER_STATUS_CHANGE']??0)>=2,'Driver lifecycle counts invalid');
           }
           if($type==='TRAINING')check($actions===['TRAINING_CREATE','TRAINING_STATUS_CHANGE','TRAINING_ROUTE_COMPLETE','TRAINING_STATUS_CHANGE','TRAINING_STATUS_CHANGE'],'Training audit sequence invalid');
           if($type==='PACKAGE'){
            check($actions[0]==='PACKAGE_CREATE'&&end($actions)==='PACKAGE_DELETE','Package lifecycle incomplete');
            check(($counts['PACKAGE_CREATE']??0)===1&&($counts['PACKAGE_DELETE']??0)===1&&($counts['PACKAGE_CHANGE']??0)>=2&&($counts['PACKAGE_DOWNLOAD']??0)>=2,'Package lifecycle counts invalid');
           }
           if($type==='SETTING')check(count($actions)===($counts['SETTING_CHANGE']??0),'Unexpected settings action');
           $report[$type]=['actions'=>$actions,'counts'=>$counts];
          }
          check(lehrfahrer_audit_verify_chain($pdo),'Audit chain invalid');
          $pdo->rollBack();flock($lock,LOCK_UN);fclose($lock);
          echo json_encode(['environment'=>'staging','audit'=>$report,'trainingArchived'=>true,'trainingRouteCompleted'=>true,
          'testDriverRemoved'=>true,'testPackageAndArtifactsRemoved'=>true,'authorizedDispatchPhonePreserved'=>true,
          'actorAndTenantConsistent'=>true,'capabilitiesCorrect'=>true,'auditChainValid'=>true,'noUnfinishedFileJournals'=>true,
          'databaseReadOnly'=>true],JSON_THROW_ON_ERROR)."\n";
          PHP
          REMOTE_A5
