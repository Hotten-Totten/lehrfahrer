            exit 1
          fi
          legacy_root_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -u "$BASIC_USER:$BASIC_PASSWORD" "$origin/index.html")"
          test "$legacy_root_status" = 302
          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            "$origin/login.html" | grep -q 'Lehrfahrer-Anmeldung'
          anonymous_api_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -u "$BASIC_USER:$BASIC_PASSWORD" "$origin/api/list_cities.php")"
          test "$anonymous_api_status" = 401

          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -D /tmp/staging-runtime.headers \
            "$origin/api/auth/runtime.php" > /tmp/staging-runtime.json
          jq -e --arg commit "${{ github.sha }}" '
            .ok == true
            and .runtime.environment == "staging"
            and .runtime.environmentLabel == "STAGING"
            and .runtime.commit == $commit
            and .runtime.databaseSchemaVersion == 4
          ' /tmp/staging-runtime.json >/dev/null
          grep -Eiq '^x-robots-tag:.*noindex' /tmp/staging-runtime.headers

          jq -n '{
            company: "lehrfahrer-test",
            login: "staging-admin",
            password: "ungueltiges-staging-passwort",
            deviceLabel: "GitHub Staging Negative Smoke"
          }' > /tmp/staging-login-wrong-request.json
          wrong_login_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -u "$BASIC_USER:$BASIC_PASSWORD" -H "Origin: $origin" -H 'Content-Type: application/json' \
            --data-binary @/tmp/staging-login-wrong-request.json "$origin/api/auth/login.php")"
          test "$wrong_login_status" = 401

          jq -n --arg password "$ADMIN_PASSWORD" '{
            company: "lehrfahrer-test",
            login: "staging-admin",
            password: $password,
            deviceLabel: "GitHub Staging Smoke"
          }' > /tmp/staging-login-request.json
          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -H "Origin: $origin" -H 'Content-Type: application/json' \
            -D /tmp/staging-login.headers -c /tmp/staging.cookies \
            --data-binary @/tmp/staging-login-request.json \
            "$origin/api/auth/login.php" > /tmp/staging-login.json
          jq -e '.ok == true and .company.slug == "lehrfahrer-test" and (.user.roles | index("ADMIN"))' \
            /tmp/staging-login.json >/dev/null
          grep -Eiq '^set-cookie: __Host-lehrfahrer_session=.*;.*[Ss]ecure' /tmp/staging-login.headers
          grep -Eiq '^set-cookie: __Host-lehrfahrer_session=.*;.*[Hh]ttp[Oo]nly' /tmp/staging-login.headers
          grep -Eiq '^set-cookie: __Host-lehrfahrer_session=.*;.*[Ss]ame[Ss]ite=[Ss]trict' /tmp/staging-login.headers
          if grep -Eiq '^set-cookie: __Host-lehrfahrer_session=.*;.*[Dd]omain=' /tmp/staging-login.headers; then
            echo 'Staging-Sessioncookie darf kein Domain-Attribut besitzen.' >&2
            exit 1
          fi

          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -b /tmp/staging.cookies "$origin/api/auth/me.php" \
            | jq -e '.ok == true and .runtime.environment == "staging"' >/dev/null
          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -b /tmp/staging.cookies "$origin/" > /tmp/staging-editor.html
          grep -q '<title>Linien-Editor</title>' /tmp/staging-editor.html
          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -b /tmp/staging.cookies -D /tmp/staging-cities.headers \
            "$origin/api/list_cities.php" > /dev/null
          grep -Eiq '^x-lehrfahrer-auth-mode: *session' /tmp/staging-cities.headers
          csrf="$(jq -r '.csrfToken' /tmp/staging-login.json)"
          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -b /tmp/staging.cookies -c /tmp/staging.cookies -H "Origin: $origin" -H "X-CSRF-Token: $csrf" \
            -X POST "$origin/api/auth/logout.php" | jq -e '.ok == true' >/dev/null
          logged_out_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -u "$BASIC_USER:$BASIC_PASSWORD" -b /tmp/staging.cookies "$origin/")"
          test "$logged_out_status" = 302

      - name: Verify live public content is unchanged
        if: env.STOP_TIMES_PROBE_ONLY != '1'
        shell: bash
        run: |
          set -euo pipefail
          for host in lehrfahrer.de www.lehrfahrer.de; do
            curl --fail --silent --show-error --location "https://${host}/VERSION" \
              | sha256sum >> /tmp/lehrfahrer-live-after.sha256
          done
          cmp /tmp/lehrfahrer-live-before.sha256 /tmp/lehrfahrer-live-after.sha256
