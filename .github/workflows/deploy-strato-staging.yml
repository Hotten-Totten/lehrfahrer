              > "$private_root/cottbus-dry-run-result.json" \
              2> "$private_root/cottbus-dry-run-stderr.raw"
          dry_run_status="$?"
          set -e
          chmod 600 "$private_root/cottbus-dry-run-result.json" "$private_root/cottbus-dry-run-stderr.raw"
          if [ "$dry_run_status" -ne 0 ] || [ -s "$private_root/cottbus-dry-run-stderr.raw" ]; then
            COTTBUS_DRY_RUN_RESULT="$private_root/cottbus-dry-run-result.json" \
              php -q -f "$private_root/report-cottbus-dry-run-error.php" >&2
            echo 'Realer Cottbus-Dry-Run ist fehlgeschlagen; Details bleiben privat.' >&2
            exit 1
          fi
          cat > "$private_root/validate-cottbus-dry-run.php" <<'PHP'
          <?php
          try {
              $raw = (string)file_get_contents((string)getenv('COTTBUS_DRY_RUN_RESULT'));
              if (str_starts_with($raw, "\xEF\xBB\xBF")) $raw = substr($raw, 3);
              $raw = str_replace(["\r\n", "\r"], "\n", $raw);
              if (preg_match(
                  '/\A(?:(?:Content-Type|X-Powered-By|Status):[^\n]*\n)*\n*(\{.*\})\s*\z/isD',
                  $raw,
                  $matches
              ) !== 1) {
                  throw new RuntimeException('Unerwartete CGI-Ausgabe.');
              }
              $data = json_decode($matches[1], true, 512, JSON_THROW_ON_ERROR);
          } catch (Throwable $error) {
              file_put_contents('php://stderr', "Cottbus-Dry-Run-Ergebnis ist kein valides JSON.\n");
              exit(1);
          }
          $expected = [
              'cities' => 1, 'lines' => 3, 'routes' => 4, 'route_files' => 12,
              'drivers' => 1, 'trainings' => 1, 'packages' => 1, 'documents' => 2,
              'catalog_stops' => 1531, 'gtfs_agencies' => 1,
              'variants_index' => ['action' => 'REBUILD', 'agencyIds' => ['143']],
          ];
          $status = $data['real_target']['target_status'] ?? [];
          if (($data['mode'] ?? '') !== 'DRY_RUN' || ($data['READY_FOR_APPLY'] ?? '') !== 'YES'
              || ($data['BLOCKERS'] ?? null) !== []
              || ($data['deterministic_manifest']['company_id'] ?? '') !== 'cmp_2ff1b82166c99988ed6f7eb51cca7b56'
              || ($data['deterministic_manifest']['expected_target'] ?? null) !== $expected
              || ($data['WOULD_REMAP'] ?? null) !== ['EXACT' => 36, 'HIGH' => 4, 'MANUAL' => 0, 'UNRESOLVED' => 0]
              || ($data['real_target']['target_unchanged'] ?? false) !== true
              || ($data['real_target']['other_tenants_unchanged'] ?? false) !== true
              || $status === [] || count(array_filter($status, static fn($value) => $value !== 'CREATE')) !== 0
              || ($data['read_only_evidence']['database_writes'] ?? -1) !== 0
              || ($data['read_only_evidence']['target_writes'] ?? -1) !== 0
              || preg_match('/^[0-9a-f]{64}$/D', (string)($data['SOURCE_FINGERPRINT'] ?? '')) !== 1) {
              file_put_contents('php://stderr', "Cottbus-Dry-Run-Ergebnis weicht von der Freigabe ab.\n");
              exit(1);
          }
          echo json_encode([
              'mode' => $data['mode'],
