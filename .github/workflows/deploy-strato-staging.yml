          ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f /tmp/parallel-account-*.json /tmp/parallel-old-*.json /tmp/parallel-auth.cookies /tmp/parallel-account-only.cookies /tmp/parallel-legacy-only.cookies /tmp/parallel-account-relogin.cookies /tmp/parallel-account-editor.html /tmp/parallel-legacy-editor.html' EXIT
          origin='https://staging.lehrfahrer.de'
          jq -n --arg password "$ADMIN_PASSWORD" '{
            company: "lehrfahrer-test", login: "staging-admin", password: $password
          }' > /tmp/parallel-old-login.json
          jq -n --arg password "$ADMIN_PASSWORD" '{
            login: "staging-admin", password: $password
          }' > /tmp/parallel-account-login.json
          jq -n --arg password "$ADMIN_PASSWORD" '{
            login: "staging-admin", password: $password, company: "lehrfahrer-test"
          }' > /tmp/parallel-account-spoof.json
          spoof_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -u "$BASIC_USER:$BASIC_PASSWORD" -H "Origin: $origin" -H 'Content-Type: application/json' \
            --data-binary @/tmp/parallel-account-spoof.json \
            "$origin/api/auth/account_test.php?action=login")"
          test "$spoof_status" = 400
          jq -n '{login: "staging-admin", password: "invalid-password"}' > /tmp/parallel-account-wrong.json
          jq -n '{login: "unknown-account", password: "invalid-password"}' > /tmp/parallel-account-unknown.json
          for case_name in wrong unknown; do
            status="$(curl --silent --show-error --output "/tmp/parallel-account-$case_name-result.json" \
              --write-out '%{http_code}' -u "$BASIC_USER:$BASIC_PASSWORD" \
              -H "Origin: $origin" -H 'Content-Type: application/json' \
              --data-binary "@/tmp/parallel-account-$case_name.json" \
              "$origin/api/auth/account_test.php?action=login")"
            test "$status" = 401
          done
          cmp /tmp/parallel-account-wrong-result.json /tmp/parallel-account-unknown-result.json
          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -H "Origin: $origin" -H 'Content-Type: application/json' \
            -c /tmp/parallel-auth.cookies --data-binary @/tmp/parallel-old-login.json \
            "$origin/api/auth/login.php" > /tmp/parallel-old-result.json
          jq -e '.ok == true' /tmp/parallel-old-result.json >/dev/null
          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -H "Origin: $origin" -H 'Content-Type: application/json' \
            -b /tmp/parallel-auth.cookies -c /tmp/parallel-auth.cookies \
            --data-binary @/tmp/parallel-account-login.json \
            "$origin/api/auth/account_test.php?action=login" > /tmp/parallel-account-result.json
          jq -e '.ok == true and .context == "TENANT" and (.tenantCapabilities | index("routes.read")) and .platformCapabilities == []
            and (.companyName | type) == "string" and (.companyName | length) > 0
            and (.displayName | type) == "string" and (.displayName | length) > 0
            and (.userNumber | test("^[0-9]{5,}$"))
            and (.tenantRoles | type) == "array" and .platformRoles == []' \
            /tmp/parallel-account-result.json >/dev/null
          grep -q '__Host-lehrfahrer_session' /tmp/parallel-auth.cookies
          grep -q '__Host-lehrfahrer_account_test' /tmp/parallel-auth.cookies
          grep '__Host-lehrfahrer_account_test' /tmp/parallel-auth.cookies > /tmp/parallel-account-only.cookies
          grep '__Host-lehrfahrer_session' /tmp/parallel-auth.cookies > /tmp/parallel-legacy-only.cookies
          for cookie_file in /tmp/parallel-account-only.cookies /tmp/parallel-legacy-only.cookies; do
            editor_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              -u "$BASIC_USER:$BASIC_PASSWORD" -b "$cookie_file" "$origin/")"
            test "$editor_status" = 200
            curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
              -b "$cookie_file" "$origin/api/list_cities.php" | jq -e '.ok == true' >/dev/null
          done
          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -b /tmp/parallel-account-only.cookies "$origin/" > /tmp/parallel-account-editor.html
          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -b /tmp/parallel-account-only.cookies "$origin/" > /tmp/parallel-account-editor-reload.html
          grep -q 'js/editor.identity.js?v=' /tmp/parallel-account-editor-reload.html
          grep -q 'id="accountMenuRoot"' /tmp/parallel-account-editor.html
          if grep -q 'id="accountMenuRoot" style="display:none"' /tmp/parallel-account-editor.html; then
            echo 'Account-Kontomenü wurde nicht eingeblendet.' >&2
            exit 1
          fi
          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -b /tmp/parallel-account-only.cookies "$origin/account-login.php?mode=manage&next=%2F" \
            | grep -q 'id="accountDetails"'
          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -b /tmp/parallel-legacy-only.cookies "$origin/" > /tmp/parallel-legacy-editor.html
          grep -q 'id="accountMenuRoot" style="display:none"' /tmp/parallel-legacy-editor.html
          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -b /tmp/parallel-auth.cookies "$origin/api/auth/me.php" \
            | jq -e '.ok == true and .runtime.environment == "staging"' >/dev/null
          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -b /tmp/parallel-auth.cookies "$origin/api/auth/account_test.php?action=me" \
            | jq -e '.ok == true and .context == "TENANT" and (.userNumber | test("^[0-9]{5,}$"))
              and (.companyName | length) > 0 and (.tenantRoles | type) == "array"' >/dev/null
          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -b /tmp/parallel-auth.cookies "$origin/api/auth/account_test.php?action=memberships" \
            | jq -e '.ok == true and (.memberships | length) == 1 and .currentMembershipId == .memberships[0].id' >/dev/null
          new_csrf="$(jq -r '.csrfToken' /tmp/parallel-account-result.json)"
          membership_id="$(jq -r '.membershipId' /tmp/parallel-account-result.json)"
          jq -n --arg membershipId "$membership_id" '{membershipId: $membershipId}' \
            > /tmp/parallel-account-switch.json
          switch_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -u "$BASIC_USER:$BASIC_PASSWORD" -b /tmp/parallel-auth.cookies \
            -H "Origin: $origin" -H "X-CSRF-Token: $new_csrf" -H 'Content-Type: application/json' \
            --data-binary @/tmp/parallel-account-switch.json \
            "$origin/api/auth/account_test.php?action=switch")"
          test "$switch_status" = 403
          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -b /tmp/parallel-auth.cookies "$origin/api/auth/account_test.php?action=me" \
            | jq -e '.ok == true and .context == "TENANT"' >/dev/null
          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -b /tmp/parallel-auth.cookies -c /tmp/parallel-auth.cookies \
            -H "Origin: $origin" -H "X-CSRF-Token: $new_csrf" -X POST \
            "$origin/api/auth/account_test.php?action=logout" | jq -e '.ok == true' >/dev/null
          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -H "Origin: $origin" -H 'Content-Type: application/json' \
            -c /tmp/parallel-account-relogin.cookies --data-binary @/tmp/parallel-account-login.json \
            "$origin/api/auth/account_test.php?action=login" > /tmp/parallel-account-relogin.json
          jq -e '.ok == true and .context == "TENANT"' /tmp/parallel-account-relogin.json >/dev/null
          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -b /tmp/parallel-account-relogin.cookies "$origin/" > /tmp/parallel-account-relogin-editor.html
          grep -q '<title>Linien-Editor</title>' /tmp/parallel-account-relogin-editor.html
          relogin_csrf="$(jq -r '.csrfToken' /tmp/parallel-account-relogin.json)"
          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -b /tmp/parallel-account-relogin.cookies -c /tmp/parallel-account-relogin.cookies \
            -H "Origin: $origin" -H "X-CSRF-Token: $relogin_csrf" -X POST \
            "$origin/api/auth/account_test.php?action=logout" | jq -e '.ok == true' >/dev/null
          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -b /tmp/parallel-auth.cookies "$origin/api/auth/me.php" \
            | jq -e '.ok == true' >/dev/null
          old_csrf="$(jq -r '.csrfToken' /tmp/parallel-old-result.json)"
          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -b /tmp/parallel-auth.cookies -c /tmp/parallel-auth.cookies \
            -H "Origin: $origin" -H "X-CSRF-Token: $old_csrf" -X POST \
            "$origin/api/auth/logout.php" | jq -e '.ok == true' >/dev/null
          rm -f /tmp/parallel-old-login.json /tmp/parallel-account-login.json /tmp/parallel-account-spoof.json \
            /tmp/parallel-account-wrong.json /tmp/parallel-account-unknown.json \
            /tmp/parallel-account-wrong-result.json /tmp/parallel-account-unknown-result.json \
            /tmp/parallel-old-result.json /tmp/parallel-account-result.json /tmp/parallel-auth.cookies \
            /tmp/parallel-account-only.cookies /tmp/parallel-legacy-only.cookies \
            /tmp/parallel-account-relogin.cookies /tmp/parallel-account-relogin.json \
            /tmp/parallel-account-relogin-editor.html \
            /tmp/parallel-account-editor.html /tmp/parallel-legacy-editor.html
          echo 'PARALLEL_ACCOUNT_AUTH=OK'

      - name: Register missing Cottbus city without changing existing routes
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.repair_cottbus_city }}
        shell: bash
        env:
          SSHPASS: ${{ secrets.STRATO_PASSWORD }}
          STRATO_USER: ${{ secrets.STRATO_USER }}
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          STRATO_PORT: ${{ secrets.STRATO_PORT }}
          STRATO_SSH_KEY: ${{ secrets.STRATO_SSH_KEY }}
          STAGING_TARGET_PATH: ${{ vars.STAGING_TARGET_PATH }}
          STAGING_PRIVATE_PATH: ${{ vars.STAGING_PRIVATE_PATH }}
        run: |
          set -euo pipefail
          SSH_BASE=(ssh -p "$STRATO_PORT" -o UpdateHostKeys=no -o StrictHostKeyChecking=yes)
          if [ -n "$STRATO_SSH_KEY" ]; then
            SSH_RUN=("${SSH_BASE[@]}" -i ~/.ssh/id_rsa)
          else
            SSH_RUN=(sshpass -e "${SSH_BASE[@]}")
          fi
          "${SSH_RUN[@]}" "$STRATO_USER@$STRATO_HOST" \
            "bash -s -- '$STAGING_TARGET_PATH' '$STAGING_PRIVATE_PATH'" <<'REMOTE_CITY'
          set -euo pipefail
          webroot="$(cd "./$1" && pwd -P)"
          private_root="$(cd "./$2" && pwd -P)"
          LEHRFAHRER_ENV=staging LEHRFAHRER_APP_ROOT="$webroot" LEHRFAHRER_PRIVATE_DATA_DIR="$private_root" \
            php -q -d "auto_prepend_file=$private_root/runtime-env.php" <<'PHP'
          <?php
          set_exception_handler(static function (Throwable $error): void {
              file_put_contents('php://stderr', 'Cottbus city postcheck failed: ' . $error->getMessage() . "\n");
              exit(1);
          });
          require_once getenv('LEHRFAHRER_APP_ROOT') . '/api/_tenant_route_storage.php';
          $company = 'cmp_2ff1b82166c99988ed6f7eb51cca7b56';
          $files = [];
          $routeCounts = [];
          foreach (['01', '02'] as $number) {
              $file = lehrfahrer_route_file($company, 'cottbus', 'Route_' . $number, 'json', 'Linie_16', 'Standard');
              if (!is_file($file) || is_link($file)) throw new RuntimeException('Existing Route ' . $number . ' is missing.');
              $data = json_decode(strval(file_get_contents($file)), true, 512, JSON_THROW_ON_ERROR);
              if (($data['city'] ?? '') !== 'cottbus' || ($data['routeName'] ?? '') !== 'Route ' . $number) {
                  throw new RuntimeException('Existing Route ' . $number . ' is inconsistent.');
              }
              $stops = $data['stops'] ?? null;
              $points = isset($data['route']['original']) && is_array($data['route']['original'])
                  ? $data['route']['original'] : ($data['routePoints'] ?? null);
              if (!is_array($stops) || count($stops) !== ($number === '01' ? 20 : 19) || !is_array($points)) {
                  throw new RuntimeException('Existing Route ' . $number . ' has invalid stops or route points.');
              }
              $routeCounts[$number] = ['stops' => count($stops), 'routePoints' => count($points)];
              $files[$number] = ['path' => $file, 'sha' => hash_file('sha256', $file)];
          }
          $alreadyPresent = lehrfahrer_route_city_exists($company, 'cottbus');
          if (!$alreadyPresent) lehrfahrer_route_register_city($company, 'Cottbus');
          if (!lehrfahrer_route_city_exists($company, 'cottbus')) throw new RuntimeException('Cottbus city registration failed.');
          $places = lehrfahrer_route_safe_entries(lehrfahrer_tenant_area($company, 'cities'));
          if (!in_array('cottbus', $places, true)) throw new RuntimeException('Editor city source does not find Cottbus.');
          foreach (['01', '02'] as $number) {
              if (!hash_equals($files[$number]['sha'], hash_file('sha256', $files[$number]['path']))) {
                  throw new RuntimeException('Existing Route ' . $number . ' changed.');
              }
              if (lehrfahrer_route_find_file($company, 'cottbus', 'Route_' . $number, 'json', 'Linie_16', 'Standard')
                  !== $files[$number]['path']) throw new RuntimeException('Editor cannot load Route ' . $number . '.');
          }
          echo json_encode(['cityRegistered' => true, 'cityAlreadyPresent' => $alreadyPresent,
              'editorCitySourceContainsCottbus' => true, 'editorRoute01Found' => true, 'editorRoute02Found' => true,
              'routeHashesUnchanged' => true, 'routeCounts' => $routeCounts], JSON_THROW_ON_ERROR), "\n";
          PHP
          REMOTE_CITY

      - name: Verify persisted GTFS route comparison and warm derived cache
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_gtfs_routes_v1 }}
        shell: bash
        env:
          SSHPASS: ${{ secrets.STRATO_PASSWORD }}
          STRATO_USER: ${{ secrets.STRATO_USER }}
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          STRATO_PORT: ${{ secrets.STRATO_PORT }}
          STRATO_SSH_KEY: ${{ secrets.STRATO_SSH_KEY }}
          STAGING_TARGET_PATH: ${{ vars.STAGING_TARGET_PATH }}
          STAGING_PRIVATE_PATH: ${{ vars.STAGING_PRIVATE_PATH }}
        run: |
          set -euo pipefail
          SSH_BASE=(ssh -p "$STRATO_PORT" -o UpdateHostKeys=no -o StrictHostKeyChecking=yes)
          if [ -n "$STRATO_SSH_KEY" ]; then
            SSH_RUN=("${SSH_BASE[@]}" -i ~/.ssh/id_rsa)
          else
            SSH_RUN=(sshpass -e "${SSH_BASE[@]}")
          fi
          "${SSH_RUN[@]}" "$STRATO_USER@$STRATO_HOST" \
            "bash -s -- '$STAGING_TARGET_PATH' '$STAGING_PRIVATE_PATH'" <<'REMOTE_SCRIPT'
          set -euo pipefail
          webroot="$(cd "./$1" && pwd -P)"
          private_root="$(cd "./$2" && pwd -P)"
          LEHRFAHRER_ENV=staging LEHRFAHRER_APP_ROOT="$webroot" LEHRFAHRER_PRIVATE_DATA_DIR="$private_root" \
            php -q -d max_execution_time=900 -d memory_limit=512M -d "auto_prepend_file=$private_root/runtime-env.php" <<'PHP'
          <?php
          require_once getenv('LEHRFAHRER_APP_ROOT') . '/api/_tenant_storage.php';
          require_once getenv('LEHRFAHRER_APP_ROOT') . '/api/_gtfs_candidate.php';
          require_once getenv('LEHRFAHRER_APP_ROOT') . '/api/_tenant_route_storage.php';
          require_once getenv('LEHRFAHRER_APP_ROOT') . '/api/_gtfs_route_preview.php';
          require_once getenv('LEHRFAHRER_APP_ROOT') . '/api/_gtfs_route_assignment.php';
          require_once getenv('LEHRFAHRER_APP_ROOT') . '/api/_route_categories.php';
          require_once getenv('LEHRFAHRER_APP_ROOT') . '/api/_gtfs_route_creation.php';
          $company = 'cmp_2ff1b82166c99988ed6f7eb51cca7b56';
          $root = lehrfahrer_tenant_path($company, 'imports', 'gtfs/candidate');
          $dir = lehrfahrer_gtfs_candidate_active_dir($root);
          $candidate = $dir . '/candidate.zip';
          $current = lehrfahrer_tenant_path($company, 'imports', 'gtfs/latest.zip');
          $index = lehrfahrer_tenant_path($company, 'imports', 'gtfs/index/variants.sqlite');
          $beforeCandidate = hash_file('sha256', $candidate);
          $beforeCurrent = hash_file('sha256', $current);
          $ready = lehrfahrer_gtfs_candidate_preflight($dir, $current, $index);
          $cachedStart = microtime(true);
          $cached = lehrfahrer_gtfs_candidate_preflight($dir, $current, $index);
          $cachedSeconds = round(microtime(true) - $cachedStart, 1);
          if ($cached['analysis']['lineCounts'] !== $ready['analysis']['lineCounts'] || $cachedSeconds > 30) {
              throw new RuntimeException('Cached route report is inconsistent or too slow.');
          }
          if (!hash_equals($beforeCandidate, hash_file('sha256', $candidate))
              || !hash_equals($beforeCurrent, hash_file('sha256', $current))) {
              throw new RuntimeException('GTFS-SHA changed during read-only comparison.');
          }
          $line16 = array_values(array_filter($ready['analysis']['lines'],
              static fn(array $line): bool => $line['line'] === '16'));
          if (count($line16) !== 1 || $line16[0]['status'] === 'GEAENDERT') {
              throw new RuntimeException('Line 16 comparison is missing or falsely changed.');
          }
          $referenceStatuses = [];
          foreach ($ready['analysis']['lines'] as $line) {
              if (in_array($line['line'], ['1', '890', '16'], true)) $referenceStatuses[$line['line']] = $line['status'];
          }
          $selected = lehrfahrer_gtfs_route_selection_read($root . '/route-selections', $beforeCandidate);
          $oldOnlyMarked = 0; $candidateVariants = 0;
          foreach ($line16[0]['variants'] as $variant) {
              if ($variant['candidatePresent'] === true) { $candidateVariants++; continue; }
              if (isset($selected[lehrfahrer_gtfs_route_selection_id('16', $variant['selectionKey'])])) $oldOnlyMarked++;
          }
          $validSelected = lehrfahrer_gtfs_route_selection_valid($ready['analysis'], $selected);
          $applied = lehrfahrer_gtfs_route_selection_apply($ready['analysis'], $selected);
          $validLine16 = array_values(array_filter($applied['lines'],
              static fn(array $line): bool => $line['line'] === '16'))[0];
          if ($candidateVariants === 0 || $validLine16['selectedVariantCount']
              !== count(array_filter($line16[0]['variants'], static fn(array $variant): bool =>
                  $variant['candidatePresent'] === true
                  && isset($validSelected[lehrfahrer_gtfs_route_selection_id('16', $variant['selectionKey'])])))) {
              throw new RuntimeException('Line 16 candidate-only selection postcheck failed.');
          }
          $citiesRoot = lehrfahrer_tenant_area($company, 'cities');
          $cityPlaces = array_values(array_filter(lehrfahrer_route_safe_entries($citiesRoot),
              static fn(string $place): bool => is_dir(lehrfahrer_route_city_path($company, $place))));
          $routeStorage = [];
          foreach (['01', '02'] as $number) {
              $relative = 'lines/cottbus/Linie_16/Standard/Route_' . $number . '.json';
              $file = lehrfahrer_tenant_path($company, 'lines', 'cottbus/Linie_16/Standard/Route_' . $number . '.json');
              $data = is_file($file) && !is_link($file) ? json_decode(strval(file_get_contents($file)), true) : null;
              $routeStorage[$number] = ['path' => $relative, 'exists' => is_file($file),
                  'validJson' => is_array($data), 'city' => $data['city'] ?? null,
                  'line' => $data['lineName'] ?? null, 'route' => $data['routeName'] ?? null,
                  'category' => $data['variantCategory'] ?? null, 'variant' => $data['variantName'] ?? null,
                  'lineFolder' => $data['lineFolder'] ?? null, 'categoryFolder' => $data['categoryFolder'] ?? null,
                  'fileBase' => $data['fileBase'] ?? null,
                  'stops' => is_array($data['stops'] ?? null) ? count($data['stops']) : null,
                  'routePoints' => is_array($data['routePoints'] ?? null) ? count($data['routePoints']) : null];
          }
          $existing = lehrfahrer_gtfs_preview_route_files(lehrfahrer_route_line_city_path($company, 'cottbus'), '16');
          $preview = lehrfahrer_gtfs_preview_creation_proposals(
              lehrfahrer_gtfs_preview_line($ready['analysis'], $validSelected, $existing, '16'), $beforeCandidate);
          $assignments = lehrfahrer_gtfs_assignment_read($root . '/route-assignments', $beforeCandidate);
          $categories = lehrfahrer_route_categories_read(
              lehrfahrer_tenant_path($company, 'settings', 'route_categories.json'), $existing);
          $assignmentRows = [];
          foreach ($preview['variants'] as $variant) {
              $id = lehrfahrer_gtfs_route_selection_id('16', $variant['selectionKey']);
              $assignment = lehrfahrer_gtfs_assignment_validate($assignments[$id] ?? [], $existing, $categories);
              $assignmentRows[] = ['routeNumber' => $assignment['routeNumber'], 'category' => $assignment['category'],
                  'action' => $assignment['action'], 'ready' => $assignment['ready'],
                  'startStop' => $variant['startStop'], 'destination' => $variant['destination'],
                  'stopCount' => $variant['stopCount']];
          }
          $selectedComparison = array_map(static fn(array $variant): array => [
              'status' => $variant['result'], 'stopCount' => $variant['stopCount'],
              'comparisonStatus' => (static function () use ($ready, $variant): string {
                  foreach ($ready['analysis']['lines'] as $line) if ($line['line'] === '16') {
                      foreach ($line['variants'] as $entry) if ($entry['selectionKey'] === $variant['selectionKey']) {
                          return $entry['status'] . ':' . strval($entry['diff']['note'] ?? '');
                      }
                  }
                  return 'missing';
              })()
          ], $preview['variants']);
          echo json_encode(['comparisonMode' => $ready['analysis']['comparisonMode'],
              'referenceStatuses' => $referenceStatuses, 'lineTotal' => count($ready['analysis']['lines']),
              'lineCounts' => $ready['analysis']['lineCounts'],
              'previewLine16' => ['selected' => $preview['selectedVariantCount'],
                  'oldOnlyMarksIgnored' => $oldOnlyMarked, 'candidateVariantsSelectable' => $candidateVariants,
                  'existingRoutes' => $preview['existingRouteCount'],
                  'creationProposals' => count(array_filter($preview['variants'],
                      static fn(array $variant): bool => isset($variant['creationPreview']))),
                  'results' => array_count_values(array_column($preview['variants'], 'result')),
                  'assignmentRows' => $assignmentRows],
              'routeStorage' => ['companyId' => $company, 'citiesCottbusExists' => is_dir(lehrfahrer_route_city_path($company, 'cottbus')),
                  'places' => $cityPlaces, 'linesCottbusExists' => is_dir(lehrfahrer_route_line_city_path($company, 'cottbus')),
                  'routes' => $routeStorage],
              'manualAdoptionReady' => $ready['manualAdoptionReady'], 'candidateShaUnchanged' => true,
              'currentShaUnchanged' => true, 'cachedSeconds' => $cachedSeconds], JSON_THROW_ON_ERROR), "\n";
          PHP
          REMOTE_SCRIPT

      - name: Create private Control-DB restore point
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.create_control_db_restore_point || inputs.verify_control_db_recovery || inputs.migrate_accounts) }}
        shell: bash
        env:
          SSHPASS: ${{ secrets.STRATO_PASSWORD }}
          STRATO_USER: ${{ secrets.STRATO_USER }}
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          STRATO_PORT: ${{ secrets.STRATO_PORT }}
          STRATO_SSH_KEY: ${{ secrets.STRATO_SSH_KEY }}
          STAGING_TARGET_PATH: ${{ vars.STAGING_TARGET_PATH }}
          STAGING_PRIVATE_PATH: ${{ vars.STAGING_PRIVATE_PATH }}
          LIVE_TARGET_PATH: ${{ secrets.STRATO_TARGET_PATH }}
        run: |
          set -euo pipefail
          REMOTE="$STRATO_USER@$STRATO_HOST"
          SSH_BASE=(ssh -p "$STRATO_PORT" -o UpdateHostKeys=no -o StrictHostKeyChecking=yes)
          if [ -n "$STRATO_SSH_KEY" ]; then
            SSH_BASE+=(-i ~/.ssh/id_rsa)
            SSH_RUN=("${SSH_BASE[@]}")
          else
            SSH_RUN=(sshpass -e "${SSH_BASE[@]}")
          fi

          "${SSH_RUN[@]}" "$REMOTE" \
            "bash -s -- '$STAGING_TARGET_PATH' '$STAGING_PRIVATE_PATH' '$LIVE_TARGET_PATH'" <<'REMOTE_SCRIPT'
          set -euo pipefail
          staging_target="$1"
          staging_private="$2"
          live_target="${3#/}"
          webroot="$(cd "./$staging_target" && pwd -P)"
          private_root="$(cd "./$staging_private" && pwd -P)"
          if [ -z "$live_target" ] || [ "$live_target" = "." ]; then
            live_webroot="$(pwd -P)"
          else
            live_webroot="$(cd "./$live_target" && pwd -P)"
          fi
          case "$private_root/" in "$webroot/"*|"$live_webroot/"*) exit 31 ;; esac
          case "$webroot/" in "$private_root/"*) exit 32 ;; esac
          test "$(stat -c '%a' "$private_root")" = 700

          runner="$private_root/create-control-db-restore-point.php"
          result="$private_root/control-db-restore-point-result.json"
          cat > "$runner" <<'PHP'
          <?php
          declare(strict_types=1);

          function fail_restore_point(string $message): never {
              file_put_contents('php://stderr', $message . "\n");
              exit(1);
          }

          function control_db_fingerprint(array $configuration): string {
              $pdo = cottbusPdoConnection($configuration);
              $pdo->exec('SET SESSION TRANSACTION ISOLATION LEVEL REPEATABLE READ');
              $pdo->exec('START TRANSACTION WITH CONSISTENT SNAPSHOT');
              $hash = hash_init('sha256');
              try {
                  $tables = $pdo->query("SHOW FULL TABLES WHERE Table_type = 'BASE TABLE'")->fetchAll(PDO::FETCH_COLUMN);
                  sort($tables, SORT_STRING);
                  foreach ($tables as $table) {
                      $table = (string)$table;
                      $quoted = cottbusSqlIdentifier($table);
                      $columns = $pdo->query('SHOW COLUMNS FROM ' . $quoted)->fetchAll(PDO::FETCH_ASSOC);
                      $names = array_map(static fn(array $row): string => (string)$row['Field'], $columns);
                      $primary = array_values(array_map(
                          static fn(array $row): string => (string)$row['Field'],
                          array_filter($columns, static fn(array $row): bool => (string)($row['Key'] ?? '') === 'PRI')
                      ));
                      $order = $primary ?: $names;
                      $query = 'SELECT * FROM ' . $quoted;
                      if ($order !== []) $query .= ' ORDER BY ' . implode(',', array_map('cottbusSqlIdentifier', $order));
                      hash_update($hash, $table . "\0");
                      foreach ($pdo->query($query, PDO::FETCH_NUM) as $row) {
                          hash_update($hash, serialize($row) . "\0");
                      }
                  }
              } finally {
                  if ($pdo->inTransaction()) $pdo->rollBack();
              }
              return hash_final($hash);
          }

          try {
              $privateRoot = (string)getenv('LEHRFAHRER_PRIVATE_DATA_DIR');
              $appRoot = (string)getenv('LEHRFAHRER_APP_ROOT');
              $output = (string)getenv('RESTORE_POINT_RESULT_FILE');
              if ((string)getenv('LEHRFAHRER_ENV') !== 'staging') fail_restore_point('Restore-Punkt ist nicht in Staging.');
              require_once $appRoot . '/api/_control_database.php';
              require_once $privateRoot . '/_control-db-restore-point.php';
              $configuration = lehrfahrer_control_mysql_configuration();
              $configuration['tls_ca'] = trim((string)getenv('LEHRFAHRER_DB_TLS_CA')) ?: null;
              $pdo = cottbusPdoConnection($configuration);
              $environment = $pdo->prepare('SELECT value FROM control_metadata WHERE `key` = ?');
              $environment->execute(['environment']);
              if (!hash_equals('staging', (string)$environment->fetchColumn())) {
                  throw new RuntimeException('Control-DB ist nicht eindeutig an Staging gebunden.');
              }
              $schemaVersion = (int)$pdo->query('SELECT MAX(version) FROM schema_migrations')->fetchColumn();
              if ($schemaVersion !== LEHRFAHRER_CONTROL_SCHEMA_VERSION) {
                  throw new RuntimeException('Control-DB-Schemaversion weicht ab.');
              }
              $company = $pdo->prepare('SELECT slug FROM companies WHERE id = ?');
              $company->execute(['cmp_2ff1b82166c99988ed6f7eb51cca7b56']);
              if (!hash_equals('cottbusverkehr', (string)$company->fetchColumn())) {
                  throw new RuntimeException('Cottbus-Zielgesellschaft stimmt nicht.');
              }
              $capability = cottbusDbBackupCapability($configuration, $privateRoot);
              if (($capability['DB_BACKUP_CAPABLE'] ?? 'NO') !== 'YES'
                  || ($capability['DB_RESTORE_PATH_VALID'] ?? 'NO') !== 'YES') {
                  throw new RuntimeException('DB-Backup-/Restore-Gate ist nicht freigegeben.');
              }
              $before = control_db_fingerprint($configuration);
              $restorePoint = cottbusCreateControlDbRestorePoint(
                  $configuration,
                  $privateRoot,
                  $capability,
                  (string)LEHRFAHRER_CONTROL_SCHEMA_VERSION
              );
              $after = control_db_fingerprint($configuration);
              if (!hash_equals($before, $after)) throw new RuntimeException('Control-DB hat sich beim Backup veraendert.');
              $directory = (string)$restorePoint['directory'];
              $dump = (string)$restorePoint['dump'];
              $manifest = (string)$restorePoint['manifest'];
              $metadata = $restorePoint['metadata'];
              if (is_link($directory) || is_link($dump) || is_link($manifest)
                  || substr(sprintf('%o', fileperms($directory)), -3) !== '700'
                  || substr(sprintf('%o', fileperms($dump)), -3) !== '600'
                  || substr(sprintf('%o', fileperms($manifest)), -3) !== '600'
                  || !hash_equals((string)$metadata['sha256'], (string)hash_file('sha256', $dump))
                  || (int)$metadata['bytes'] !== (int)filesize($dump)
                  || ($metadata['restore']['client_validated'] ?? false) !== true) {
                  throw new RuntimeException('Restore-Punkt hat die Sicherheitsvalidierung nicht bestanden.');
              }
              $safe = [
                  'ok' => true,
                  'restore_point_id' => basename($directory),
                  'backup_bytes' => (int)$metadata['bytes'],
                  'backup_sha256' => (string)$metadata['sha256'],
                  'directory_mode' => '0700',
                  'dump_mode' => '0600',
                  'manifest_mode' => '0600',
                  'schema_version' => $schemaVersion,
                  'database_environment' => 'staging',
                  'company_id' => 'cmp_2ff1b82166c99988ed6f7eb51cca7b56',
                  'company_slug' => 'cottbusverkehr',
                  'DB_BACKUP_CAPABLE' => 'YES',
                  'DB_RESTORE_PATH_VALID' => 'YES',
                  'backup_mechanism' => (string)$capability['mechanism'],
                  'control_db_fingerprint_before' => $before,
                  'control_db_fingerprint_after' => $after,
                  'control_db_unchanged' => true,
              ];
              $json = json_encode($safe, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . "\n";
              if (file_put_contents($output, $json, LOCK_EX) !== strlen($json) || !chmod($output, 0600)) {
                  throw new RuntimeException('Sicheres Restore-Punkt-Ergebnis konnte nicht geschrieben werden.');
              }
          } catch (Throwable $error) {
              fail_restore_point('Control-DB-Restore-Punkt fehlgeschlagen: ' . $error->getMessage());
          }
          PHP
          chmod 600 "$runner"
          rm -f -- "$result"
          LEHRFAHRER_ENV=staging \
          LEHRFAHRER_APP_ROOT="$webroot" \
          LEHRFAHRER_PRIVATE_DATA_DIR="$private_root" \
          RESTORE_POINT_RESULT_FILE="$result" \
            php -q -d "auto_prepend_file=$private_root/runtime-env.php" -f "$runner"
          chmod 600 "$result"
          cat "$result"
          rm -f -- "$runner" "$result"
          REMOTE_SCRIPT

      - name: Verify Control-DB recovery drill in isolated ephemeral MariaDB
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_control_db_recovery }}
        shell: bash
        env:
          SSHPASS: ${{ secrets.STRATO_PASSWORD }}
          STRATO_USER: ${{ secrets.STRATO_USER }}
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          STRATO_PORT: ${{ secrets.STRATO_PORT }}
          STRATO_SSH_KEY: ${{ secrets.STRATO_SSH_KEY }}
          STAGING_PRIVATE_PATH: ${{ vars.STAGING_PRIVATE_PATH }}
        run: |
          set -euo pipefail
          umask 077
          REMOTE="$STRATO_USER@$STRATO_HOST"
          SSH_BASE=(ssh -p "$STRATO_PORT" -o UpdateHostKeys=no -o StrictHostKeyChecking=yes)
          SCP_BASE=(scp -P "$STRATO_PORT" -o UpdateHostKeys=no -o StrictHostKeyChecking=yes)
          if [ -n "$STRATO_SSH_KEY" ]; then
            SSH_BASE+=(-i ~/.ssh/id_rsa)
            SCP_BASE+=(-i ~/.ssh/id_rsa)
            SSH_RUN=("${SSH_BASE[@]}")
            SCP_RUN=("${SCP_BASE[@]}")
          else
            SSH_RUN=(sshpass -e "${SSH_BASE[@]}")
            SCP_RUN=(sshpass -e "${SCP_BASE[@]}")
          fi
          temp_dir="$(mktemp -d)"
          container="lf-recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            rm -rf -- "$temp_dir"
          }
          trap cleanup EXIT

          restore_id="$("${SSH_RUN[@]}" "$REMOTE" "bash -s -- '$STAGING_PRIVATE_PATH'" <<'REMOTE_FIND'
          set -euo pipefail
          private_root="$(cd "./${1#./}" && pwd -P)"
          base="$private_root/backups/control-db"
          test -d "$base" && test ! -L "$base"
          latest="$(find "$base" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -r | head -n1)"
          case "$latest" in
            20??????T??????Z-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo 'Kein sicherer Restore-Punkt gefunden.' >&2; exit 1 ;;
          esac
          test -f "$base/$latest/control.sql" && test ! -L "$base/$latest/control.sql"
          test -f "$base/$latest/manifest.json" && test ! -L "$base/$latest/manifest.json"
          printf '%s\n' "$latest"
          REMOTE_FIND
          )"
          remote_base="./${STAGING_PRIVATE_PATH#/}/backups/control-db/$restore_id"
          "${SCP_RUN[@]}" "$REMOTE:$remote_base/control.sql" "$temp_dir/control.sql"
          "${SCP_RUN[@]}" "$REMOTE:$remote_base/manifest.json" "$temp_dir/manifest.json"
          chmod 600 "$temp_dir/control.sql" "$temp_dir/manifest.json"

          expected_sha="$(jq -er '.sha256 | select(test("^[0-9a-f]{64}$"))' "$temp_dir/manifest.json")"
          expected_bytes="$(jq -er '.bytes | numbers' "$temp_dir/manifest.json")"
          actual_sha="$(sha256sum "$temp_dir/control.sql" | awk '{print $1}')"
          actual_bytes="$(stat -c %s "$temp_dir/control.sql")"
          test "$expected_sha" = "$actual_sha"
          test "$expected_bytes" = "$actual_bytes"
          jq -e '.restore.client_validated == true and (.expected_tables | length) >= 20' "$temp_dir/manifest.json" >/dev/null

          root_password="$(openssl rand -hex 24)"
          docker run -d --name "$container" \
            -e MARIADB_ROOT_PASSWORD="$root_password" \
            -e MARIADB_DATABASE=control_recovery \
            mariadb:11 >/dev/null
          for attempt in $(seq 1 60); do
            if docker exec "$container" mariadb -uroot -p"$root_password" -N -B -e 'SELECT 1' >/dev/null 2>&1; then break; fi
            if [ "$attempt" -eq 60 ]; then echo 'Ephemere MariaDB ist nicht authentifiziert bereit.' >&2; exit 1; fi
            sleep 1
          done

          docker exec -i "$container" mariadb -uroot -p"$root_password" control_recovery < "$temp_dir/control.sql"
          echo 'RECOVERY_ISOLATED_IMPORT=OK'
          before="$(docker exec "$container" mariadb -N -B -uroot -p"$root_password" control_recovery \
            -e "SELECT CONCAT(COALESCE((SELECT value FROM control_metadata WHERE \`key\`='auth_mode'),'PARALLEL'),'/',COALESCE((SELECT value FROM control_metadata WHERE \`key\`='auth_cutover_lock'),'OPEN'));" | tr -d '\r')"
          if [ "$before" != 'PARALLEL/OPEN' ]; then echo "Isolierter Ausgangszustand: $before" >&2; exit 1; fi
          echo 'RECOVERY_ISOLATED_INITIAL_STATE=OK'

          docker exec "$container" mariadb -uroot -p"$root_password" control_recovery \
            -e "INSERT INTO control_metadata (\`key\`,value,updated_at) VALUES ('auth_cutover_lock','LOCKED',UTC_TIMESTAMP()) ON DUPLICATE KEY UPDATE value='LOCKED',updated_at=UTC_TIMESTAMP();"
          locked="$(docker exec "$container" mariadb -N -B -uroot -p"$root_password" control_recovery \
            -e "SELECT value FROM control_metadata WHERE \`key\`='auth_cutover_lock';" | tr -d '\r')"
          if [ "$locked" != LOCKED ]; then echo 'Isolierter Lock konnte nicht gesetzt werden.' >&2; exit 1; fi
          echo 'RECOVERY_ISOLATED_LOCK=OK'

          docker exec -i "$container" mariadb -uroot -p"$root_password" control_recovery < "$temp_dir/control.sql"
          after="$(docker exec "$container" mariadb -N -B -uroot -p"$root_password" control_recovery \
            -e "SELECT CONCAT(COALESCE((SELECT value FROM control_metadata WHERE \`key\`='auth_mode'),'PARALLEL'),'/',COALESCE((SELECT value FROM control_metadata WHERE \`key\`='auth_cutover_lock'),'OPEN'));" | tr -d '\r')"
          if [ "$after" != "$before" ]; then echo "Isolierter Restore-Zustand: $after" >&2; exit 1; fi
          echo 'RECOVERY_ISOLATED_ROLLBACK=OK'
          table_count="$(docker exec "$container" mariadb -N -B -uroot -p"$root_password" control_recovery \
            -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='control_recovery' AND table_type='BASE TABLE';" | tr -d '\r')"
          expected_table_count="$(jq -er '.expected_tables | length' "$temp_dir/manifest.json")"
          if [ "$table_count" != "$expected_table_count" ]; then echo 'Isolierte Tabellenzahl nach Restore ungueltig.' >&2; exit 1; fi

          jq -n \
            --arg restore_point_id "$restore_id" \
            --arg backup_sha256 "$actual_sha" \
            --argjson backup_bytes "$actual_bytes" \
            '{ok:true,restore_point_id:$restore_point_id,backup_sha256:$backup_sha256,backup_bytes:$backup_bytes,
              isolated_database:"ephemeral-github-mariadb",initial_restore:true,
              fault_injected:"auth_cutover_lock=LOCKED",rollback_restored_auth_state:"PARALLEL/OPEN",
              expected_tables_restored:true,staging_database_touched:false}'

      - name: Verify controlled recovery on real staging MariaDB
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_control_db_recovery }}
        shell: bash
        env:
          SSHPASS: ${{ secrets.STRATO_PASSWORD }}
          STRATO_USER: ${{ secrets.STRATO_USER }}
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          STRATO_PORT: ${{ secrets.STRATO_PORT }}
          STRATO_SSH_KEY: ${{ secrets.STRATO_SSH_KEY }}
          STAGING_TARGET_PATH: ${{ vars.STAGING_TARGET_PATH }}
          STAGING_PRIVATE_PATH: ${{ vars.STAGING_PRIVATE_PATH }}
          BASIC_USER: ${{ secrets.STAGING_BASIC_AUTH_USER }}
          BASIC_PASSWORD: ${{ secrets.STAGING_BASIC_AUTH_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          origin='https://staging.lehrfahrer.de'
          remote="$STRATO_USER@$STRATO_HOST"
          ssh_base=(ssh -p "$STRATO_PORT" -o UpdateHostKeys=no -o StrictHostKeyChecking=yes)
          if [ -n "$STRATO_SSH_KEY" ]; then
            ssh_base+=(-i ~/.ssh/id_rsa)
            ssh_run=("${ssh_base[@]}")
          else
            ssh_run=(sshpass -e "${ssh_base[@]}")
          fi
          recovery() {
            "${ssh_run[@]}" "$remote" \
              "bash -s -- '$STAGING_TARGET_PATH' '$STAGING_PRIVATE_PATH' '${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}' '$1'" <<'REMOTE_RECOVERY'
          set -euo pipefail
          webroot="$(cd "./$1" && pwd -P)"
          private_root="$(cd "./$2" && pwd -P)"
          case "$private_root/" in "$webroot/"*) exit 1 ;; esac
          test "$(stat -c '%a' "$private_root")" = 700
          LEHRFAHRER_ENV=staging LEHRFAHRER_APP_ROOT="$webroot" \
          LEHRFAHRER_PRIVATE_DATA_DIR="$private_root" \
          LEHRFAHRER_RECOVERY_RUN_ID="$3" LEHRFAHRER_RECOVERY_ACTION="$4" \
          LEHRFAHRER_RECOVERY_RUN=1 \
            php -q -d "auto_prepend_file=$private_root/runtime-env.php" \
              -f "$private_root/control-db-live-recovery.php"
          REMOTE_RECOVERY
          }
          locked=0
          cleanup() {
            if [ "$locked" -eq 1 ]; then
              recovery recover || recovery cancel || echo 'Recovery erfordert administrativen Eingriff.' >&2
            fi
            rm -f /tmp/lf-recovery-login.json /tmp/lf-recovery-result.json \
              /tmp/lf-recovery-relogin.json /tmp/lf-recovery-cookies \
              /tmp/lf-recovery-new-cookies /tmp/lf-recovery-select.json
          }
          trap cleanup EXIT
          recovery inspect | jq -e '.ok == true and .engine == "mariadb" and .mode == "PARALLEL" and .lock == "OPEN" and .restore_point_valid == true and .marker_present == false' >/dev/null
          if recovery recover >/dev/null 2>&1; then echo 'Recovery ohne aktiven Drill wurde erlaubt.' >&2; exit 1; fi
          jq -n --arg password "$ADMIN_PASSWORD" '{login:"staging-admin",password:$password}' > /tmp/lf-recovery-login.json
          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -H "Origin: $origin" -H 'Content-Type: application/json' \
            -c /tmp/lf-recovery-cookies --data-binary @/tmp/lf-recovery-login.json \
            "$origin/api/auth/account_test.php?action=login" > /tmp/lf-recovery-result.json
          jq -e '.ok == true and .context == "TENANT"' /tmp/lf-recovery-result.json >/dev/null
          membership_id="$(jq -r '.membershipId' /tmp/lf-recovery-result.json)"
          csrf="$(jq -r '.csrfToken' /tmp/lf-recovery-result.json)"
          jq -n --arg membershipId "$membership_id" '{membershipId:$membershipId}' > /tmp/lf-recovery-select.json
          locked=1
          recovery lock | jq -e '.ok == true and .mode == "PARALLEL" and .lock == "LOCKED"' >/dev/null
          for action in login select switch; do
            if [ "$action" = login ]; then
              status="$(curl --silent --show-error --output /tmp/lf-recovery-result.json --write-out '%{http_code}' \
                -u "$BASIC_USER:$BASIC_PASSWORD" -H "Origin: $origin" -H 'Content-Type: application/json' \
                --data-binary @/tmp/lf-recovery-login.json "$origin/api/auth/account_test.php?action=login")"
            else
              status="$(curl --silent --show-error --output /tmp/lf-recovery-result.json --write-out '%{http_code}' \
                -u "$BASIC_USER:$BASIC_PASSWORD" -b /tmp/lf-recovery-cookies \
                -H "Origin: $origin" -H "X-CSRF-Token: $csrf" -H 'Content-Type: application/json' \
                --data-binary @/tmp/lf-recovery-select.json "$origin/api/auth/account_test.php?action=$action")"
            fi
            test "$status" = 503
            jq -e '.ok == false' /tmp/lf-recovery-result.json >/dev/null
          done
          recovery recover | jq -e '.ok == true and .mode == "PARALLEL" and .lock == "OPEN"' >/dev/null
          locked=0
          recovery inspect | jq -e '.ok == true and .mode == "PARALLEL" and .lock == "OPEN" and .marker_present == false' >/dev/null
          if recovery recover >/dev/null 2>&1; then echo 'Erneuter Recovery wurde erlaubt.' >&2; exit 1; fi
          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -H "Origin: $origin" -H 'Content-Type: application/json' \
            -c /tmp/lf-recovery-new-cookies --data-binary @/tmp/lf-recovery-login.json \
            "$origin/api/auth/account_test.php?action=login" > /tmp/lf-recovery-relogin.json
          jq -e '.ok == true and .context == "TENANT"' /tmp/lf-recovery-relogin.json >/dev/null
          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -b /tmp/lf-recovery-new-cookies "$origin/" | grep -q '<title>Linien-Editor</title>'
          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -b /tmp/lf-recovery-new-cookies "$origin/api/list_lines.php?scope=driver" \
            | jq -e '.ok == true' >/dev/null
          new_csrf="$(jq -r '.csrfToken' /tmp/lf-recovery-relogin.json)"
          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -b /tmp/lf-recovery-new-cookies -c /tmp/lf-recovery-new-cookies \
            -H "Origin: $origin" -H "X-CSRF-Token: $new_csrf" -X POST \
            "$origin/api/auth/account_test.php?action=logout" | jq -e '.ok == true' >/dev/null
          curl --fail --silent --show-error -u "$BASIC_USER:$BASIC_PASSWORD" \
            -H "Origin: $origin" -H 'Content-Type: application/json' \
            -c /tmp/lf-recovery-new-cookies --data-binary @/tmp/lf-recovery-login.json \
            "$origin/api/auth/account_test.php?action=login" \
            | jq -e '.ok == true and .context == "TENANT"' >/dev/null
          echo 'REAL_STAGING_AUTH_RECOVERY=OK'

