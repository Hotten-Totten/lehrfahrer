name: Diagnose staging smoke 41352273721

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Configure existing staging SSH access
        shell: bash
        env:
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          STRATO_PORT: ${{ secrets.STRATO_PORT }}
          STRATO_SSH_KEY: ${{ secrets.STRATO_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$STRATO_SSH_KEY" ]; then
            printf '%s\n' "$STRATO_SSH_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
          else
            if ! sudo apt-get update -qq >/dev/null 2>&1 \
                || ! sudo apt-get install -y -qq sshpass >/dev/null 2>&1; then
              echo 'SMOKE_CATEGORY=ACCESS_FAILURE'
              exit 0
            fi
          fi
          if [ -n "${{ secrets.STRATO_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.STRATO_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$STRATO_PORT" "$STRATO_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Classify only the failed run's private smoke error
        shell: bash
        env:
          SSHPASS: ${{ secrets.STRATO_PASSWORD }}
          STRATO_USER: ${{ secrets.STRATO_USER }}
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          STRATO_PORT: ${{ secrets.STRATO_PORT }}
          STRATO_SSH_KEY: ${{ secrets.STRATO_SSH_KEY }}
          STAGING_PRIVATE_PATH: ${{ vars.STAGING_PRIVATE_PATH }}
          STAGING_TARGET_PATH: ${{ vars.STAGING_TARGET_PATH }}
          LIVE_TARGET_PATH: ${{ secrets.STRATO_TARGET_PATH }}
        run: |
          set -euo pipefail
          for name in STAGING_PRIVATE_PATH STAGING_TARGET_PATH LIVE_TARGET_PATH; do
            path="${!name}"
            if [ -z "$path" ] || [[ ! "$path" =~ ^[A-Za-z0-9_./-]+$ ]]; then
              echo "SMOKE_CATEGORY=PATH_CONFIG_INVALID_${name}"; exit 0
            fi
          done
          case "$STAGING_PRIVATE_PATH" in
            /*|.|..|*../*|*/..|*//*|lehrfahrer-private|*/lehrfahrer-private)
              echo 'SMOKE_CATEGORY=PRIVATE_PATH_UNSAFE'; exit 0 ;;
          esac
          if [ "$STAGING_PRIVATE_PATH" = "$LIVE_TARGET_PATH" ] || [ "$STAGING_PRIVATE_PATH" = "$STAGING_TARGET_PATH" ]; then
            echo 'SMOKE_CATEGORY=PATHS_OVERLAP'; exit 0
          fi
          ssh_base=(ssh -p "$STRATO_PORT" -o UpdateHostKeys=no -o StrictHostKeyChecking=yes)
          if [ -n "$STRATO_SSH_KEY" ]; then
            ssh_base+=(-i ~/.ssh/id_rsa)
            ssh_run=("${ssh_base[@]}")
          else
            ssh_run=(sshpass -e "${ssh_base[@]}")
          fi
          if ! "${ssh_run[@]}" "$STRATO_USER@$STRATO_HOST" 'printf SSH_OK' 2>/dev/null | grep -qx SSH_OK; then
            echo 'SMOKE_CATEGORY=SSH_CONNECTION_FAILURE'; exit 0
          fi
          echo 'SMOKE_SSH=OK'
          result="$("${ssh_run[@]}" "$STRATO_USER@$STRATO_HOST" "bash -s -- '$STAGING_PRIVATE_PATH'" 2>/dev/null <<'REMOTE'
          set -euo pipefail
          if ! cd -- "./${1#./}" 2>/dev/null; then echo 'IMPORT_STATUS=INACCESSIBLE'; exit 0; fi
          # Only one isolated staging tenant directory may be inspected.
          set -- companies/cmp_*/imports
          if [ "$#" -ne 1 ] || [ ! -d "$1" ] || [ -L "$1" ]; then echo 'IMPORT_STATUS=TENANT_NOT_UNIQUE'; exit 0; fi
          dir="$1"
          files="$(find "$dir" -type f -print | wc -l | tr -d ' ')" || { echo 'IMPORT_STATUS=COUNT_FAILED'; exit 0; }
          directories="$(find "$dir" -mindepth 1 -type d -print | wc -l | tr -d ' ')" || { echo 'IMPORT_STATUS=COUNT_FAILED'; exit 0; }
          links="$(find "$dir" -type l -print | wc -l | tr -d ' ')" || { echo 'IMPORT_STATUS=COUNT_FAILED'; exit 0; }
          if [[ "$files" =~ ^[0-9]+$ && "$directories" =~ ^[0-9]+$ && "$links" =~ ^[0-9]+$ ]]; then
            printf 'IMPORT_FILES=%s IMPORT_DIRS=%s IMPORT_LINKS=%s\n' "$files" "$directories" "$links"
          else
            echo 'IMPORT_STATUS=COUNT_FAILED'
          fi
          REMOTE
          )" || { echo 'IMPORT_STATUS=SSH_ERROR'; exit 0; }
          case "$result" in
            IMPORT_FILES=*) if [[ "$result" =~ ^IMPORT_FILES=[0-9]+\ IMPORT_DIRS=[0-9]+\ IMPORT_LINKS=[0-9]+$ ]]; then printf '%s\n' "$result"; else echo 'IMPORT_STATUS=INVALID_OUTPUT'; fi ;;
            IMPORT_STATUS=*) printf '%s\n' "$result" ;;
            *) echo 'IMPORT_STATUS=INVALID_OUTPUT' ;;
          esac