name: Deploy to Strato

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-strato-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare SSH client
        shell: bash
        run: |
          mkdir -p ~/.ssh

          if [ -n "${{ secrets.STRATO_SSH_KEY }}" ]; then
            echo "${{ secrets.STRATO_SSH_KEY }}" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
          else
            sudo apt-get update
            sudo apt-get install -y sshpass
          fi

          if [ -n "${{ secrets.STRATO_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.STRATO_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${{ secrets.STRATO_PORT }}" "${{ secrets.STRATO_HOST }}" >> ~/.ssh/known_hosts
          fi

      - name: Deploy via rsync over SSH/SFTP
        shell: bash
        run: |
          TARGET="${{ secrets.STRATO_USER }}@${{ secrets.STRATO_HOST }}:${{ secrets.STRATO_TARGET_PATH }}"

          if [ -n "${{ secrets.STRATO_SSH_KEY }}" ]; then
            rsync -az \
              --exclude ".git/" \
              --exclude ".github/" \
              --exclude "WorkingSystem/" \
              --exclude "Offlinekarten/" \
              --exclude "backup/" \
              --exclude "_linien/" \
              --exclude "app5/" \
              --exclude "app6/" \
              --exclude "node_modules/" \
              --exclude "*.log" \
              -e "ssh -i ~/.ssh/id_rsa -p ${{ secrets.STRATO_PORT }}" \
              ./ "$TARGET"
          else
            export SSHPASS="${{ secrets.STRATO_PASSWORD }}"
            sshpass -e rsync -az \
              --exclude ".git/" \
              --exclude ".github/" \
              --exclude "WorkingSystem/" \
              --exclude "Offlinekarten/" \
              --exclude "backup/" \
              --exclude "_linien/" \
              --exclude "app5/" \
              --exclude "app6/" \
              --exclude "node_modules/" \
              --exclude "*.log" \
              -e "ssh -p ${{ secrets.STRATO_PORT }}" \
              ./ "$TARGET"
          fi
